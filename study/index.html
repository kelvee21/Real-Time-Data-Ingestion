rows. Of the 124 spoiled rows, the other 108 were removed by the\nfilter in `clean()`. 6,000 − 124 = 5,876 rows landed, exactly.\n\n**Line to say in review.** \"numInputRows is a bit below rows written\nbecause Spark pushes the not-null checks into the CSV scan. Those rows\nare dropped before they're counted. That's why I check correctness from\nthe generator's spoiled count against PostgreSQL, not from Spark's input\ncount.\"\n\n**Follow-up trap.** \"How would you see the pushed filters?\" → Call\n`batch_df.explain()` inside `write_batch`. The scan line shows\n`PushedFilters: [IsNotNull(...), ...]`.\n\n---\n\n## Self-check\n\n1. What is written to the checkpoint before a batch runs, and what after?\n   [Before: `offsets/N` (and `sources/0/N`). After the sink succeeds:\n   `commits/N`.]\n2. Why must `event_time` be in the `dropDuplicates` key list? [Spark can\n   only evict a state entry once it knows its event time is older than\n   the watermark.]\n3. What makes a replayed batch harmless? [`event_id` is the primary key\n   and the merge uses `ON CONFLICT (event_id) DO NOTHING`.]\n4. Why did plain `TIMESTAMP` store times 2 hours off? [The JDBC driver\n   converted using the JVM's local zone, UTC+2, not the session's UTC.]\n5. Why did `\"-5\"` pass the first filter? [It is a valid integer, so\n   `try_cast` gives `-5`, not null. \"Is not null\" was true.]\n","study/10-code-review-defense.md":"# 10 — Defending This Project in Code Review\n\nA reviewer will check three things: do you know **why** each piece is\nthere, can you back it with **numbers** from your own runs, and do you\nknow the **weak spots**. Below are likely questions, grouped by area, with\nshort model answers grounded in this repo. Say them in your own words.\n\n> **Help:** if a question uses a term you can't explain, the long answer is in [09 · The hard parts](09-hard-concepts-explained.md). For a line of code, see [04 · The streaming job line by line](04-streaming-job-line-by-line.md) or [03 · The generator line by line](03-generator-line-by-line.md). Every function is in [12 · Reference](12-streaming-and-sql-reference.md).\n\n## The 60-second opening\n\n> \"A Python generator writes CSV files of fake shop events into a folder,\n> one file every few seconds. A Spark Structured Streaming job watches\n> that folder. Every 5 seconds it reads the new files, converts the text\n> to proper types, drops invalid rows and duplicates, and writes the batch\n> to PostgreSQL in two steps: a bulk insert into a staging table, then one\n> SQL merge into `events` that skips any `event_id` already there. A\n> checkpoint lets the job restart where it stopped, and the merge makes a\n> replayed batch harmless. I tested nine cases, including a crash, a\n> forced replay and a database outage, and measured latency at three\n> loads: p50 5.4 seconds at 50 rows a second with the right settings.\"\n\n## Generator (`data_generator.py`)\n\n**Q: Why CSV files in a folder and not Kafka?**\nA: The spec asks for it (Part 1: \"creates fake e-commerce events (CSV\nfiles)\", Part 2: \"monitor the folder\"). A folder is the simplest\nreplayable source: files stay on disk, so after a crash Spark can read\nthem again. Kafka would be the production choice; the Spark code would\nchange only in `read_stream()`.\n\n**Q: How do you stop Spark reading a half-written file?**\nA: `write_file()` writes to `_events_....csv`, then `os.replace()` renames\nit. Spark ignores names starting with `_`, and the rename is atomic.\nTC-01 found 0 leftover `_` files after 20 files.\n\n**Q: Why does the generator spoil rows on purpose?**\nA: To test the cleaning rules. `spoil()` puts `\"\"`, `\"-5\"`, `\"unknown\"`\nor `\"NaN\"` into one of `price`, `event_type`, `user_id`, `event_time`. It\nprints how many it spoiled per file, so the expected row count is exact:\nrows written minus rows spoiled. In TC-04 that is 2,000 − 385 = 1,615.\n\n**Q: Why `--seed`?**\nA: `random.seed(args.seed)` makes the same \"random\" values every run, so\na test can be repeated. TC-01 and TC-04 used `--seed 42`. (The\n`event_id`s still differ: `uuid.uuid4()` does not use Python's `random`.)\n\n**Q: Why is `event_id` a UUID made by the generator?**\nA: It is the natural key. Every event has one unique id from the moment it\nexists, so the database can tell a replayed row from a new one. A\ndatabase `SERIAL` id could not do that: a replay would get a new number.\n\n## Streaming job (`spark_streaming_to_postgres.py`)\n\n**Q: Why read every column as a string?**\nA: `RAW_SCHEMA` is all `StringType`. In Spark 4, ANSI mode is on, so\n`CAST('unknown' AS INT)` throws and would stop the stream. Reading text\nand then using `try_cast` turns a bad value into null, and the filter\ndrops the row.\n\n**Q: Why must you give a schema at all?**\nA: A streaming source cannot scan the files first to guess types, because\nthe files don't exist yet when the query starts. `readStream.schema(...)`\nis required for file sources.\n\n**Q: Walk me through the filter.**\nA: `clean()` keeps a row only if `event_id` and `event_time` are not null,\n`user_id > 0`, `product_id > 0`, `event_type` is one of `view`,\n`add_to_cart`, `purchase`, `price >= 0`, and `quantity` is null or\n`>= 0`. A comparison with null is not true, so `> 0` and `>= 0` also\nreject nulls.\n\n**Q: Tell me about the bug you found.**\nA: TC-04 first gave 1,642 rows, not 1,615. All 27 extra rows had\n`user_id = -5`. The filter only checked \"is not null\", and `\"-5\"` casts to\na valid integer. Fix: `> 0` in Spark, plus `CHECK (user_id > 0)` and\n`CHECK (product_id > 0)` in the table. After the fix: 1,615 rows, 0\nbreaking a rule. The bad run is kept in `reports/logs/bug_run/`.\n\n**Q: Why `dropDuplicates` in Spark if the primary key already stops\nduplicates?**\nA: Two layers. `dropDuplicates` removes repeats inside the stream before\nthey cost a JDBC write: in TC-07 a copied file of 98 rows produced 0\nrows to write. The primary key catches anything older than the 10-minute\nwatermark, and replays.\n\n**Q: Why is `event_time` in the dedup keys?**\nA: `.dropDuplicates([\"event_id\", \"event_time\"])` with\n`.withWatermark(\"event_time\", \"10 minutes\")`. Spark can only forget an id\nonce it knows its event time is older than the watermark. Without the\nwatermark column in the keys, state would grow forever.\n\n**Q: Why `foreachBatch`?**\nA: There is no streaming JDBC sink. `foreachBatch` hands me each batch\nas a normal DataFrame, so I can use the batch JDBC writer and then run\nmy own SQL with psycopg2.\n\n**Q: Why `persist()` in `write_batch`?**\nA: `batch_df` is used twice: `count()` and the JDBC write. Without\n`persist()`, Spark would read and clean the files twice. `unpersist()`\nfrees it at the end.\n\n**Q: Why `spark.sql.shuffle.partitions = 4`?**\nA: `dropDuplicates` shuffles. The default 200 partitions would mean 200\ntiny tasks for ~100 rows. 4 suits a laptop. Note it is fixed in the\ncheckpoint once the query has run.\n\n**Q: Why set the session time zone to UTC?**\nA: The generator writes UTC times without a zone. With\n`spark.sql.session.timeZone = UTC`, `try_to_timestamp` reads them as UTC.\n\n## PostgreSQL (`postgres_setup.sql`)\n\n**Q: Why a staging table?**\nA: Spark's JDBC writer only does plain `INSERT`. On a replay it would hit\nthe primary key and fail the batch. So I append to `events_staging`,\nwhich has no constraints, then run `INSERT ... SELECT ... ON CONFLICT\n(event_id) DO NOTHING` and `TRUNCATE` in one transaction.\n\n**Q: Why `TIMESTAMPTZ`?**\nA: With plain `TIMESTAMP`, times were stored 2 hours late: the JDBC\ndriver converts with the JVM's local zone (UTC+2), not Spark's UTC\nsession zone. `TIMESTAMPTZ` stores an absolute instant. TC-03: values\nmatch the CSV exactly with `SET timezone='UTC'`.\n\n**Q: Why `CHECK` constraints when Spark already filters?**\nA: Defence in depth. The TC-04 bug showed that the Spark filter can be\nwrong. The database is the last place a bad row can be stopped, and it\nalso protects against any other writer.\n\n**Q: Why `NUMERIC(10,2)` for price, not `FLOAT`?**\nA: Money must be exact. A float cannot store 0.10 exactly; `NUMERIC`\ncan. Spark casts to `DECIMAL(10,2)` to match.\n\n**Q: What are the two indexes for?**\nA: `idx_events_time` and `idx_events_type`, for reports that filter by\ntime range or event type. The primary key index on `event_id` is also\nwhat makes `ON CONFLICT` fast.\n\n**Q: Is the setup script safe to run twice?**\nA: Yes. `CREATE DATABASE` and `CREATE ROLE` have no `IF NOT EXISTS`, so\nthe script builds the command with `SELECT ... WHERE NOT EXISTS` and runs\nit with `\\gexec` only when needed. Tables and indexes use\n`IF NOT EXISTS`.\n\n**Q: What can `spark_app` do?**\nA: `SELECT, INSERT` on `events`; `SELECT, INSERT, TRUNCATE` on\n`events_staging`. Nothing else: no update, delete, drop. It is not a\nsuperuser. The password is only in the gitignored `.env`.\n\n## Reliability\n\n**Q: What happens if the job crashes mid-batch?**\nA: The batch has an `offsets` file but no `commits` file. On restart\nSpark re-runs it. If the merge had already committed, `ON CONFLICT DO\nNOTHING` skips every row. Tested with `taskkill /F`: all 1,176 valid\nrows arrived, no duplicates.\n\n**Q: Prove the replay is harmless.**\nA: TC-05. I deleted `checkpoint/events/commits/42` and restarted. Spark\nre-ran batch 42: 83 rows, 0 inserted. Total stayed 3,190, distinct ids\n3,190.\n\n**Q: What if the database is down?**\nA: TC-08. With `PGPORT=5499` (nothing listening) the first psycopg2\ncall raised `OperationalError: ... Connection refused`, the query\nstopped with exit code 1, and batch 44 had an offset but no commit.\nRestarted with normal settings: batch 44 re-ran, then 45 and 46. Total\nreached the expected 3,428, no duplicates.\n\n**Q: Does the job retry by itself?**\nA: No. It stops, and the next start recovers. In production a supervisor\n(a service manager, Kubernetes, Airflow) would restart it.\n\n**Q: What if a file arrives twice?**\nA: TC-07. Spark sees a new file name and reads it, but `dropDuplicates`\nrecognises every id: 98 rows read, 0 written. If it came more than 10\nminutes later, the primary key would skip the rows instead.\n\n## Testing (`reports/test_cases.md`)\n\n**Q: How did you know the expected row count exactly?**\nA: The generator prints the spoiled count per file, and every kind of\nspoiling breaks a rule. So rows in PostgreSQL must equal rows generated\nminus rows spoiled. For P2: 6,000 − 124 = 5,876, and 5,876 landed.\n\n**Q: Which test failed?**\nA: TC-04 first (the `-5` bug), and TC-09 at P1's settings (fell behind).\nI kept both failures in the document with the cause and the fix.\n\n**Q: Are the tests automated?**\nA: No, they are a manual plan with real results, which is what the spec\nasks for. The checks are SQL queries I can rerun. Automating them with\npytest and a throwaway database would be the next step.\n\n## Performance (`reports/performance_metrics.md`)\n\n**Q: What is your latency?**\nA: Run P2 (50 rows/s, 5 s trigger, 5 files per batch): p50 5.4 s, p95\n13.4 s, max 15.4 s. Measured as `ingested_at − event_time` in\nPostgreSQL, so it covers the whole path.\n\n**Q: Why did P1 fall behind?**\nA: One file every 2 s arrived; at most one file per 5 s was processed.\n2.5 files in for every one out. After 2 minutes 24 of 60 files were\nwaiting and latency reached 116 s. Each batch took only ~3 s of its 5 s,\nso the cap was the bottleneck, not the machine.\n\n**Q: Did Spark warn you?**\nA: Only once per run, for the slow first batch: `Current batch is falling\nbehind`. That warning means one batch took longer than the trigger. It\nsays nothing about a growing backlog. Latency is the real signal.\n\n**Q: What is your throughput?**\nA: P3 at 1,000 rows/s: 902 rows/s landed, 2,495 rows/s processed by\nSpark inside a batch. Batches of ~10,000 rows took 3.7 s, batches of\n~100 rows 3.0 s: almost all fixed cost.\n\n**Q: Why is `numInputRows` lower than the rows written?**\nA: Spark pushes not-null checks into the CSV reader, so some bad rows are\ndropped before they're counted: 5,984 of 6,000 in P2.\n\n## Deliverables\n\n**Q: Is everything the spec lists there?**\nA: Yes, nine items: `data_generator.py`, `spark_streaming_to_postgres.py`,\n`postgres_setup.sql`, `postgres_connection_details.txt`,\n`reports/project_overview.md`, `reports/user_guide.md`, `reports/test_cases.md`,\n`reports/performance_metrics.md`, `reports/system_architecture.png`. The diagram is drawn\nby `src/diagram.py`, so it can be regenerated.\n\n**Q: The spec says `postgres_connection_details.txt` has the password.\nDoes it?**\nA: It has host, port, database, user, the JDBC URL and the psql command,\nand says where the password is instead of the password itself: it is\nchosen when `postgres_setup.sql` runs (`-v app_password=...`) and kept\nonly in `.env`, which is gitignored. `.env.example` shows the variable\nnames with `PGPASSWORD=` empty. A password in a committed text file would\nbe a leak.\n\n**Q: How would someone else run it?**\nA: [reports/user_guide.md](../reports/user_guide.md): install, run\n`postgres_setup.sql` with psql, copy `.env.example` to `.env`, start the\njob, start the generator, check with psql.\n\n## Weak spots to admit honestly\n\nSay these before you are asked. Each one with the fix.\n\n| Weak spot | Why it matters | What I would do |\n|---|---|---|\n| **Single machine** | Generator, Spark and PostgreSQL shared one laptop's CPU and disk. Numbers won't transfer to a cluster | Rerun on a cluster with a separate DB server |\n| **2-minute runs, one per setting** | Can't show slow growth (dedup state, folder listing) or run-to-run spread | Hour-long runs, three repeats each |\n| **`MAX_FILES=1` default falls behind at 50 rows/s** | Someone running the defaults under load gets growing latency | Kept for readable tests. Document it (done); for real use `MAX_FILES=5` or more |\n| **File source, not Kafka** | Folder listing gets slower as files pile up; no partitions, no consumer groups | Swap `read_stream()` to `spark.readStream.format(\"kafka\")`; archive processed files (`cleanSource`) meanwhile |\n| **TC-08 used a wrong port, not a real outage** | Proves the \"can't connect\" path. Not a server dying mid-transaction | Stop the PostgreSQL service during a batch on a test server |\n| **Staging table assumes one writer** | Two jobs would `TRUNCATE` each other's rows | One staging table per job, or a temp table per batch, or a `batch_id` column |\n| **Rejected rows are dropped silently** | Nobody can see *which* rows failed or why; only the count gap shows it | A dead-letter table (below) |\n| **No automatic restart** | After TC-08 the job stayed down until started by hand | Run it under a supervisor with restart-on-failure |\n| **psycopg2 `with connect()` doesn't close** | In psycopg2, the `with` block commits or rolls back but leaves the connection open until garbage collection | Call `conn.close()` explicitly, or use a connection pool |\n| **Late events beyond 10 minutes** | `dropDuplicates` with a watermark drops rows older than the watermark | Widen the watermark, or dedup only in PostgreSQL |\n\n**How to add a dead-letter table.** \"Dead letter\" means rows that could\nnot be delivered, kept aside for inspection.\n\n1. In `clean()`, keep the typed rows and compute a reason instead of only\n   filtering:\n\n   ```python\n   reason = (F.when(F.col(\"event_time\").isNull(), \"bad event_time\")\n              .when(~(F.col(\"user_id\") > 0) | F.col(\"user_id\").isNull(), \"bad user_id\")\n              .when(~F.col(\"event_type\").isin(EVENT_TYPES), \"bad event_type\")\n              .when(F.col(\"price\").isNull() | (F.col(\"price\") \u003c 0), \"bad price\"))\n   ```\n\n2. Keep the raw text too (read it before the casts), so you can see the\n   original value.\n3. In `write_batch`, split the batch: rows with `reason` null go to the\n   normal path; the rest are appended by JDBC to an `events_rejected`\n   table (`raw_line TEXT, reason TEXT, batch_id BIGINT, rejected_at\n   TIMESTAMPTZ DEFAULT now()`).\n4. Grant `spark_app` `INSERT` on it.\n5. New test: the count in `events_rejected` must equal the generator's\n   spoiled count (minus rows Spark dropped in the reader).\n\n## Self-check\n\n1. In one sentence, why is a replayed batch harmless? [`event_id` is the\n   primary key and the merge uses `ON CONFLICT (event_id) DO NOTHING`.]\n2. Give P2's latency numbers. [p50 5.4 s, p95 13.4 s, max 15.4 s.]\n3. Name two weak spots and their fixes. [E.g. single writer on staging →\n   per-job staging table; silent drops → dead-letter table.]\n4. What did TC-05 delete, and what did the replay insert?\n   [`checkpoint/events/commits/42`; 83 rows read, 0 inserted.]\n","study/11-glossary-and-practice.md":"# 11 — Glossary, Practice Questions and Hands-on Drills\n\nUse this page last, as a rehearsal. Cover the answers, say yours out loud,\nthen compare. The drills run read-only queries on the real `events` table\nand small Python scripts on the real metrics files.\n\n> **Help:** this glossary covers concepts. Every PySpark method and SQL keyword used in the code is in [12 · Streaming and SQL reference](12-streaming-and-sql-reference.md). The longer explanations are in [09 · The hard parts](09-hard-concepts-explained.md).\n\n## A. Glossary (one line each)\n\n| Term | Meaning |\n|---|---|\n| **Event** | One user action: a view, an add-to-cart or a purchase. One row in `events` |\n| **Batch processing** | Process a fixed, finished set of data in one go |\n| **Stream processing** | Process data continuously as it arrives, with no end |\n| **Spark** | An engine that splits data work across many cores or machines |\n| **PySpark** | The Python interface to Spark |\n| **Structured Streaming** | Spark's streaming API: the same DataFrame code, run again on each new slice of data |\n| **DataFrame** | A table of rows and named, typed columns that Spark processes |\n| **Driver** | The main process that plans the work. `write_batch` runs here |\n| **Executor / task** | The workers that run pieces of a job, one task per partition |\n| **`local[*]`** | Run Spark on this machine only, using every CPU core |\n| **Partition** | One slice of a DataFrame. Each is processed by one task |\n| **Shuffle** | Moving rows between partitions so equal keys meet. `dropDuplicates` needs one |\n| **Lazy evaluation** | Spark only builds a plan until an action (`count`, `save`) forces it to run |\n| **Action** | An operation that runs the plan and returns or writes data (`count()`, `save()`) |\n| **Source** | Where a streaming query reads from. Here: the CSV file source on `data/incoming/` |\n| **Sink** | Where a streaming query writes. Here: `foreachBatch` |\n| **Micro-batch** | One small batch job that Spark runs per trigger on newly arrived data |\n| **Trigger** | How often a micro-batch starts (`processingTime=\"5 seconds\"`) |\n| **`maxFilesPerTrigger`** | The most files one micro-batch may read (`MAX_FILES`) |\n| **Backlog** | Files that have arrived but are not processed yet |\n| **Falling behind** | Data arrives faster than it is processed, so the backlog grows |\n| **Checkpoint** | Folder where Spark records offsets, commits and state, so it can restart |\n| **Offset** | A position in the source. For files: which files belong to batch N |\n| **Commit (checkpoint)** | The marker Spark writes after a batch's sink succeeded |\n| **State / state store** | Data Spark keeps between batches. Here: event ids seen recently |\n| **Watermark** | Newest event time seen minus an allowed delay (10 minutes). Older data is \"too late\" |\n| **Event time** | When the action happened (`event_time`, set by the generator) |\n| **Processing time** | When the system handles the event (Spark's clock) |\n| **Ingestion time** | When the row landed in the database (`ingested_at`) |\n| **At-least-once** | Every batch is delivered; some may be delivered twice after a failure |\n| **Exactly-once** | Every batch takes effect exactly once. Here: at-least-once + idempotent write |\n| **Idempotent** | Doing it twice has the same effect as doing it once |\n| **Natural key** | An id that comes with the data (`event_id`), not invented by the database |\n| **Primary key** | Column whose values must be unique and not null (`event_id`) |\n| **Staging table** | A plain landing table for a batch before it is merged (`events_staging`) |\n| **Merge / upsert** | Insert new rows and skip (or update) existing ones in one statement |\n| **`ON CONFLICT DO NOTHING`** | PostgreSQL: if the key already exists, skip the row instead of failing |\n| **JDBC** | Java's standard way to talk to databases. Spark writes to PostgreSQL through it |\n| **JDBC driver** | The library for one database: `org.postgresql:postgresql:42.7.4` |\n| **psycopg2** | The Python library the job uses to run the merge SQL |\n| **Transaction** | A group of SQL statements that succeed or fail together |\n| **`TIMESTAMPTZ`** | PostgreSQL type for an absolute instant (stored in UTC) |\n| **Schema-on-read** | Types are decided when reading, not stored in the file |\n| **ANSI mode** | Strict SQL rules in Spark 4: a bad cast throws instead of returning null |\n| **`try_cast`** | A cast that returns null for a bad value instead of throwing |\n| **Atomic rename** | A rename that happens all at once: readers see no file or the whole file |\n| **Filter pushdown** | Running a filter inside the reader so fewer rows are loaded |\n| **Least privilege** | Give a login only the rights it needs (`spark_app`) |\n| **Listener** | A class Spark calls on query events (`ProgressLogger.onQueryProgress`) |\n| **Latency** | Time from event to row in the database (`ingested_at − event_time`) |\n| **Throughput** | Rows handled per second |\n| **p50 / p95** | The median, and the value only 5% of rows exceed |\n| **Fixed cost** | Work paid once per batch whatever its size (~3 s here) |\n| **Dead-letter table** | A table for rows that could not be loaded, kept for inspection (not built yet) |\n| **winutils / `HADOOP_HOME`** | Helper files Spark needs on Windows to write checkpoints |\n\n## B. Practice questions (with model answers)\n\n**1. What does one micro-batch do in this job, start to end?**\nLists new files (up to `MAX_FILES`), reads them as strings, casts and\nfilters (`clean()`), drops duplicates, then `write_batch` appends to\n`events_staging` by JDBC and merges into `events`. Then Spark writes the\ncommit.\n\n**2. How many files can P1's settings process per minute? How many\narrive?**\n12 processed (one per 5 s), 30 arrive (one per 2 s).\n\n**3. What are the four bad values the generator uses, and which one got\nthrough the first filter?**\n`\"\"`, `\"-5\"`, `\"unknown\"`, `\"NaN\"`. `\"-5\"` in `user_id`: it casts to a\nvalid integer.\n\n**4. Name the five folders in a checkpoint and what each holds.**\n`metadata` (query id), `offsets` (what each batch covers), `sources`\n(file names per batch), `commits` (finished batches), `state` (dedup ids).\n\n**5. What would happen if you dropped `.withWatermark(...)` but kept\n`dropDuplicates`?**\nIt would still work, but state would keep every `event_id` forever and\ngrow without limit.\n\n**6. Why does `events_staging` have no constraints?**\nSo the JDBC bulk insert never fails half way. The rules are applied when\nrows move into `events`.\n\n**7. A reviewer runs `SELECT event_time FROM events LIMIT 1` and sees\n`+02`. Is the data wrong?**\nNo. The server's display zone is UTC+2. The column is `TIMESTAMPTZ`, so\nthe instant is right. `SET timezone='UTC'` shows it in UTC.\n\n**8. What does `inserted = cur.rowcount` count?**\nThe rows the `INSERT ... ON CONFLICT DO NOTHING` actually inserted. Rows\nskipped by the conflict are not counted.\n\n**9. In TC-08, why did no data get lost?**\nThe batch failed before Spark wrote its commit. The files and the offset\nstayed, so the next start re-ran batch 44.\n\n**10. Why is P2's p50 about 5.4 s?**\nA file waits on average half a trigger (2.5 s) for a batch to start, and\nthe batch takes ~3 s.\n\n**11. Why does `batches.jsonl` show `at` two hours later than\n`progress.jsonl`'s `timestamp` for the same batch?**\n`at` is `time.strftime(...)` in local time (UTC+2). `timestamp` is\nSpark's UTC time.\n\n**12. Why might `numInputRows` and the generator's row count differ?**\nSpark pushes not-null checks into the CSV reader, so some bad rows are\ndropped before being counted (5,984 of 6,000 in P2).\n\n## C. Hands-on drills\n\n### Setup\n\nAll SQL drills are read-only. In Git Bash:\n\n```bash\nPSQL=\"/c/Program Files/PostgreSQL/18/bin/psql.exe\"\n\"$PSQL\" -w -h localhost -U postgres -d ecommerce\n```\n\nIn PowerShell:\n\n```powershell\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -w -h localhost -U postgres -d ecommerce\n```\n\nThen, first thing in the session, so times show in UTC like the CSV\nfiles:\n\n```sql\nSET timezone = 'UTC';\n```\n\nThe table held **138,629** rows when these outputs were taken (all test\nand performance runs together), with 138,629 distinct `event_id`s.\n\n### Drill 1: Events per type per minute\n\n```sql\nSELECT date_trunc('minute', event_time) AS minute, event_type, count(*) AS n\nFROM events\nWHERE event_time >= '2026-11-04 11:03:00+00' AND event_time \u003c '2026-11-04 11:05:00+00'\nGROUP BY 1, 2\nORDER BY 1, 2;\n```\n\n```\n         minute         | event_type  |  n\n------------------------+-------------+------\n 2026-11-04 11:03:00+00 | add_to_cart |  489\n 2026-11-04 11:03:00+00 | purchase    |  246\n 2026-11-04 11:03:00+00 | view        | 2196\n 2026-11-04 11:04:00+00 | add_to_cart |  376\n 2026-11-04 11:04:00+00 | purchase    |  183\n 2026-11-04 11:04:00+00 | view        | 1699\n```\n\nThis window is run P2. `date_trunc('minute', ...)` cuts each time down\nto the start of its minute. `GROUP BY 1, 2` means \"group by the first\nand second columns of the SELECT\". The 11:04 minute is smaller because\nthe generator stopped at 11:04:45. Question: what share are views? (Whole\ntable: 75.1% views, 16.8% add-to-cart, 8.1% purchases, close to the\ngenerator's weights 75 / 17 / 8.)\n\n### Drill 2: Purchase revenue by category\n\n```sql\nSELECT category,\n       count(*)                AS purchases,\n       sum(quantity)           AS items,\n       sum(price * quantity)   AS revenue,\n       round(avg(price), 2)    AS avg_price\nFROM events\nWHERE event_type = 'purchase'\nGROUP BY category\nORDER BY revenue DESC;\n```\n\n```\n  category   | purchases | items |  revenue   | avg_price\n-------------+-----------+-------+------------+-----------\n electronics |      2323 |  4619 | 3569663.68 |    774.72\n sports      |      2241 |  4450 | 1381029.40 |    308.02\n home        |      2206 |  4426 |  908789.50 |    205.49\n fashion     |      2185 |  4336 |  559356.74 |    129.64\n books       |      2214 |  4400 |  145054.16 |     32.98\n```\n\nCheck it against the generator: `CATEGORIES` gives electronics prices\nfrom 50 to 1,500, so a mean near 775 is right. Books are 5 to 60, mean\n~33. Quantity for a purchase is 1 to 3, mean 2, so items ≈ 2 × purchases.\nRevenue is exact to the cent because `price` is `NUMERIC(10,2)`.\n\n### Drill 3: Latency percentiles for one run\n\n```sql\nSELECT round(percentile_cont(0.5)  WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time))::numeric, 1) AS p50,\n       round(percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time))::numeric, 1) AS p95,\n       round(max(extract(epoch FROM ingested_at - event_time))::numeric, 1) AS worst,\n       count(*)\nFROM events\nWHERE ingested_at BETWEEN '2026-11-04 11:02:30+00' AND '2026-11-04 11:05:30+00';\n```\n\n```\n p50 | p95  | worst | count\n-----+------+-------+-------\n 5.4 | 13.4 |  15.4 |  5876\n```\n\nThe same numbers `perf_report.py` printed for P2. `::numeric` is needed\nbecause `round(x, 1)` needs a `numeric`, and `percentile_cont` returns a\n`double precision`. Try changing the window to P1\n(`'2026-11-04 10:49:50+00'` to `'2026-11-04 10:53:00+00'`) and watch p50\njump to about a minute.\n\n### Drill 4: Top users\n\n```sql\nSELECT user_id,\n       count(*)                                        AS events,\n       count(*) FILTER (WHERE event_type = 'purchase') AS purchases\nFROM events\nGROUP BY user_id\nORDER BY events DESC, user_id\nLIMIT 5;\n```\n\n```\n user_id | events | purchases\n---------+--------+-----------\n     472 |    322 |        24\n     258 |    319 |        14\n      59 |    315 |        30\n     107 |    315 |        34\n     161 |    312 |        25\n```\n\n`FILTER (WHERE ...)` counts only the rows that match, inside the same\ngroup. The generator picks `user_id` uniformly from 1 to 500, so with\n138,629 rows each user averages ~277 events. A top of 322 is normal\nrandom spread, not a \"power user\".\n\n### Drill 5: Prove the data is clean\n\n```sql\nSELECT count(*) AS rule_breakers FROM events\nWHERE user_id \u003c= 0 OR product_id \u003c= 0 OR price \u003c 0 OR quantity \u003c 0\n   OR event_type NOT IN ('view', 'add_to_cart', 'purchase');\n-- 0\n\nSELECT count(*), count(DISTINCT event_id) FROM events;   -- 138629 | 138629\nSELECT count(*) FROM events_staging;                      -- 0\n```\n\nThree facts in three lines: no row breaks a rule, no duplicates, and the\nstaging table was emptied after the last merge.\n\n### Drill 6: Mean batch duration per run, with pandas\n\n`metrics/progress.jsonl` has one JSON object per line, so pandas reads it\nwith `lines=True`. Save as a script in the project folder and run with\n`python`:\n\n```python\nimport pandas as pd\n\ndf = pd.read_json(\"metrics/progress.jsonl\", lines=True)\ndf[\"timestamp\"] = pd.to_datetime(df[\"timestamp\"])\n\nruns = {\"P1\": (\"2026-11-04T10:49:50Z\", \"2026-11-04T10:53:00Z\"),\n        \"P2\": (\"2026-11-04T11:02:30Z\", \"2026-11-04T11:05:30Z\"),\n        \"P3\": (\"2026-11-04T11:06:00Z\", \"2026-11-04T11:09:30Z\")}\n\nfor name, (start, end) in runs.items():\n    w = df[(df.timestamp >= start) & (df.timestamp \u003c= end) & (df.num_input_rows > 0)]\n    print(name, len(w), \"batches,\", w.num_input_rows.sum(), \"rows,\",\n          \"mean\", round(w.trigger_ms.mean()), \"ms,\",\n          \"median\", round(w.trigger_ms.median()), \"ms\")\n```\n\nReal output:\n\n```\nP1 36 batches, 3592 rows, mean 3037 ms, median 2768 ms\nP2 24 batches, 5984 rows, mean 3306 ms, median 2809 ms\nP3 15 batches, 119684 rows, mean 3746 ms, median 3127 ms\n```\n\nThe means match `reports/performance_metrics.md`. The medians are lower because\nthe slow first batch (10 to 12.5 s) pulls the mean up. Which number\ndescribes the steady state better? (The median.)\n\n### Drill 7: The same with Spark (batch, not streaming)\n\nA normal `spark.read` works on the same file. This starts Spark (about\n25 to 30 s), so run it in a terminal with `HADOOP_HOME` set:\n\n```python\nfrom pyspark.sql import SparkSession, functions as F\n\nspark = (SparkSession.builder.master(\"local[*]\")\n         .config(\"spark.sql.session.timeZone\", \"UTC\")\n         .getOrCreate())\np = spark.read.json(\"metrics/progress.jsonl\")\np = p.withColumn(\"ts\", F.to_timestamp(\"timestamp\"))\n\n(p.filter(F.col(\"num_input_rows\") > 0)\n  .withColumn(\"run\", F.when(F.col(\"ts\").between(\"2026-11-04 10:49:50\", \"2026-11-04 10:53:00\"), \"P1\")\n                      .when(F.col(\"ts\").between(\"2026-11-04 11:02:30\", \"2026-11-04 11:05:30\"), \"P2\")\n                      .when(F.col(\"ts\").between(\"2026-11-04 11:06:00\", \"2026-11-04 11:09:30\"), \"P3\"))\n  .filter(F.col(\"run\").isNotNull())\n  .groupBy(\"run\")\n  .agg(F.count(\"*\").alias(\"batches\"), F.round(F.avg(\"trigger_ms\")).alias(\"mean_ms\"))\n  .orderBy(\"run\")\n  .show())\nspark.stop()\n```\n\nWhy the `timeZone` line: the window strings have no zone, so Spark reads\nthem in the *session* time zone. Without it the session zone is the\nlaptop's (UTC+2), the windows are two hours off, and the result is\nempty. This is the code-level version of the +2 hours story.\n\nReal output:\n\n```\n+---+-------+-------+\n|run|batches|mean_ms|\n+---+-------+-------+\n| P1|     36| 3037.0|\n| P2|     24| 3306.0|\n| P3|     15| 3746.0|\n+---+-------+-------+\n```\n\nSame numbers as pandas. `when(...).when(...)` is SQL's `CASE WHEN`;\na row matching no window gets null and is filtered out.\n\n### Drill 8: Read a checkpoint by hand\n\n```bash\nls checkpoint/events/commits | sort -n | tail -3\ncat checkpoint/perf_P3/sources/0/5 | head -3\ncat checkpoint/perf_P3/offsets/5 | head -2\n```\n\nThe `sources` file lists the CSV files batch 5 read. The `offsets` file's\nsecond line holds `batchWatermarkMs` (the watermark) and\n`batchTimestampMs`. Convert the watermark with Python:\n`datetime.fromtimestamp(1793789819007 / 1000, timezone.utc)` →\n`2026-11-04 10:56:59.007+00:00`. Look only; never edit a checkpoint of a\njob you care about.\n\n## D. Two-minute walkthrough script\n\n1. **Problem (15 s).** \"An online shop wants user events in a database\n   within seconds, not in tomorrow's batch.\"\n2. **Flow (35 s).** \"A generator writes CSV files, renamed in atomically.\n   Spark Structured Streaming reads new files every 5 seconds, reads\n   everything as text, casts with try_cast, filters bad rows, and drops\n   duplicates with a 10-minute watermark. foreachBatch appends each batch\n   to a staging table and merges it into events with ON CONFLICT DO\n   NOTHING.\"\n3. **Safety (30 s).** \"The checkpoint plus the idempotent merge means a\n   crash or replay never loses or doubles rows. Tested: forced replay of\n   83 rows inserted 0; database outage recovered with no loss; a bug\n   that let user_id -5 through was caught by an exact row count and\n   fixed in Spark and with CHECK constraints.\"\n4. **Numbers (25 s).** \"At 50 rows a second, p50 latency 5.4 s once\n   maxFilesPerTrigger was 5. With 1 it fell behind. At 1,000 rows a\n   second it kept up with 10-second batches.\"\n5. **Limits (15 s).** \"One laptop, 2-minute runs, a file source instead\n   of Kafka, rejected rows not kept yet.\"\n","study/12-streaming-and-sql-reference.md":"# 12 — Streaming API and SQL Reference (A–Z)\n\nEvery PySpark function, method and option, and every SQL and psql keyword\nused in this project's code, in alphabetical order. Each entry gives the\nform used here, what it does, the line from the project, and one gotcha.\nUse your browser's find (Ctrl+F) to jump to a word.\n\n> **Help:** the code is read in order in [04 · The streaming job line by line](04-streaming-job-line-by-line.md) and [05 · PostgreSQL, JDBC and the merge](05-postgres-jdbc-and-the-merge.md). Concepts behind the entries are in [09 · The hard parts](09-hard-concepts-explained.md).\n\nFiles: **job** = `spark_streaming_to_postgres.py`, **gen** =\n`data_generator.py`, **setup** = `postgres_setup.sql`, **perf** =\n`src/perf_report.py`.\n\n---\n\n## Part 1: PySpark (streaming and DataFrame)\n\n### Building the session\n\n| Name | As used | What it does | Line in the project | Gotcha |\n|---|---|---|---|---|\n| `SparkSession.builder` | `SparkSession.builder` | Starts describing a Spark session | job `build_spark()` | Nothing runs until `getOrCreate()` |\n| `.appName(name)` | `.appName(\"ecommerce-events-to-postgres\")` | Name shown in the Spark UI and logs | job | Not the query name; that is `queryName` |\n| `.master(url)` | `.master(\"local[*]\")` | Where Spark runs. `local[*]` = this machine, all cores | job | `local` without `[*]` uses one core only |\n| `.config(key, value)` | `.config(\"spark.jars.packages\", \"org.postgresql:postgresql:42.7.4\")` | Downloads the JDBC driver from Maven at start-up | job | Needs internet the first time; cached in `~/.ivy2.5.2` after |\n| `spark.sql.shuffle.partitions` | `.config(..., \"4\")` | Partitions after a shuffle (`dropDuplicates`) | job | Default 200. Saved in the checkpoint: a stateful query keeps the old value |\n| `spark.sql.session.timeZone` | `.config(..., \"UTC\")` | Zone for parsing and showing timestamps in Spark SQL | job | Does **not** change the JVM zone the JDBC driver uses (the +2 h story) |\n| `.getOrCreate()` | `.getOrCreate()` | Returns the running session or starts one (~25 to 30 s here) | job | If a session already exists, new `.config` values may be ignored |\n| `sparkContext.setLogLevel(level)` | `spark.sparkContext.setLogLevel(\"WARN\")` | Hides INFO lines | job | Messages printed before this line still appear |\n| `spark.stop()` | `spark.stop()` | Shuts Spark down | job `main()` | On Windows it prints a harmless \"Failed to delete ... postgresql-42.7.4.jar\" error |\n\n### Schema types\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `StructType([...])` | `StructType([StructField(c, StringType()) for c in COLS])` | A table schema: an ordered list of fields | job `RAW_SCHEMA` | Spark matches schema columns to CSV columns by **position**, not by header name. `COLS` must be in the same order as the generator's `FIELDS` |\n| `StructField(name, type)` | `StructField(c, StringType())` | One column. Nullable by default | job | — |\n| `StringType()` | `StringType()` | Text type | job | Reading as text is deliberate: casts come later with `try_cast` |\n\n### Reading the stream\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `spark.readStream` | `spark.readStream` | Starts a streaming read (vs `spark.read` for batch) | job `read_stream()` | Returns a reader, not data |\n| `.schema(s)` | `.schema(RAW_SCHEMA)` | Gives the column types up front | job | **Required** for streaming file sources: there are no files to infer from yet |\n| `.option(\"header\", True)` | `.option(\"header\", True)` | First line of each file is column names, skip it | job | Every file has its own header (`writer.writeheader()` in gen) |\n| `.option(\"maxFilesPerTrigger\", n)` | `.option(\"maxFilesPerTrigger\", MAX_FILES)` | Most files per micro-batch | job | `MAX_FILES=1` fell behind at 50 rows/s (P1). See 08 |\n| `.csv(path)` | `.csv(INPUT_DIR)` | Watch this folder for CSV files | job | Ignores files starting with `_` or `.`; the folder must exist (hence `os.makedirs`) |\n\n### Transforming\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `F` | `from pyspark.sql import functions as F` | The module of column functions | job | Convention; `F.col`, not `col` |\n| `.withColumn(name, expr)` | `.withColumn(\"user_id\", F.expr(\"try_cast(user_id AS INT)\"))` | Adds or replaces a column | job `clean()` | Same name = replace. Each call adds a step to the plan |\n| `F.expr(sql)` | `F.expr(\"try_cast(price AS DECIMAL(10,2))\")` | Writes a column as a SQL string | job | Typos are only caught when the query starts |\n| `try_cast(x AS T)` | `try_cast(user_id AS INT)` | Cast that returns null on a bad value | job | `\"-5\"` is a *good* INT: it passes (TC-04 bug) |\n| `try_to_timestamp(s, fmt)` | `try_to_timestamp(event_time, 'yyyy-MM-dd HH:mm:ss.SSS')` | Text to timestamp with a pattern; null if it does not match | job | Read in the session zone (UTC here). `SSS` = milliseconds |\n| `DECIMAL(10,2)` | in `try_cast(price AS DECIMAL(10,2))` | Exact number, 10 digits, 2 after the point | job | `\"NaN\"` becomes null: decimals have no NaN |\n| `F.lower(col)` / `F.trim(col)` | `F.lower(F.trim(\"event_type\"))` | Lower-case / remove outer spaces | job | `\" View \"` becomes `\"view\"` and passes `isin` |\n| `F.col(name)` | `F.col(\"user_id\")` | Refers to a column | job | — |\n| `.filter(cond)` | `typed.filter(...)` | Keeps rows where the condition is **true** | job | Null counts as not true, so the row is dropped |\n| `&` / `|` / `~` | `F.col(\"event_id\").isNotNull() & (F.col(\"user_id\") > 0)` | AND / OR / NOT on columns | job | Wrap each comparison in brackets: `&` binds tighter than `>` |\n| `.isNotNull()` / `.isNull()` | `F.col(\"quantity\").isNull()` | Null tests | job | `== None` does not work on columns |\n| `.isin(list)` | `F.col(\"event_type\").isin(EVENT_TYPES)` | Value is in the list | job | Null is not in any list |\n| `>`, `>=` on columns | `F.col(\"price\") >= 0` | Comparison, gives true/false/null | job | `null >= 0` is null, so the row is dropped (wanted here) |\n| `.withWatermark(col, delay)` | `.withWatermark(\"event_time\", \"10 minutes\")` | Sets how late data may be; lets state be cleaned | job | Rows older than the watermark are dropped by `dropDuplicates` |\n| `.dropDuplicates(cols)` | `.dropDuplicates([\"event_id\", \"event_time\"])` | Keeps the first row per key; in streaming, remembers keys in state | job | Include the watermark column in the keys, or state never shrinks |\n| `.select(*cols)` | `batch_df.select(*COLS)` | Keeps these columns in this order | job `write_batch()` | `*COLS` unpacks the list into arguments |\n| `.persist()` / `.unpersist()` | `batch_df.select(*COLS).persist()` | Keep the computed data in memory for reuse / free it | job | Without it, `count()` and `save()` would each re-read the files |\n| `.count()` | `rows = batch_df.count()` | Number of rows. An **action**: runs the plan | job | — |\n\n### Writing the stream\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `.writeStream` | `clean(...).writeStream` | Starts describing the streaming output | job `main()` | Nothing runs until `.start()` |\n| `.queryName(name)` | `.queryName(\"events_to_postgres\")` | Name of the query in logs and errors | job | Shows in the TC-08 error: `Query events_to_postgres [id = ...]` |\n| `.foreachBatch(fn)` | `.foreachBatch(write_batch)` | Calls `fn(batch_df, batch_id)` once per micro-batch | job | At-least-once: `fn` may run twice for the same `batch_id` |\n| `.option(\"checkpointLocation\", dir)` | `.option(\"checkpointLocation\", CHECKPOINT_DIR)` | Where offsets, commits and state are kept | job | One per query. Never share; never edit by hand except in tests |\n| `.trigger(processingTime=...)` | `.trigger(processingTime=TRIGGER)` | Start a batch every N seconds | job | A batch longer than N delays the next; Spark warns \"falling behind\" |\n| `.start()` | `.start()` | Starts the query in the background; returns a `StreamingQuery` | job | Returns at once; the script must then wait |\n| `query.awaitTermination(t)` | `query.awaitTermination(args.run_seconds)` | Waits for the query to end, or `t` seconds | job | Raises if the query failed (TC-08's `StreamingQueryException`) |\n| `query.stop()` | `query.stop()` | Stops the query cleanly | job | Used by `--run-seconds` and Ctrl+C |\n\n### Batch JDBC write (inside `foreachBatch`)\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `.write.format(\"jdbc\")` | `batch_df.write.format(\"jdbc\")` | Batch writer to a database | job | No streaming version exists, hence `foreachBatch` |\n| `.option(\"url\", ...)` | `JDBC_URL = \"jdbc:postgresql://localhost:5432/ecommerce\"` | Which server and database | job | Built from `PGHOST`/`PGPORT`/`PGDATABASE` |\n| `.option(\"dbtable\", ...)` | `\"events_staging\"` | Target table | job | If missing, Spark tries `CREATE TABLE`, which `spark_app` may not do: good |\n| `.option(\"user\"/\"password\", ...)` | `PG[\"user\"]`, `PG[\"password\"]` | Login | job | From `.env`; never hard-code |\n| `.option(\"driver\", ...)` | `\"org.postgresql.Driver\"` | Java class of the driver | job | `ClassNotFoundException` = the package download failed |\n| `.mode(\"append\")` | `.mode(\"append\")` | Add rows, keep existing ones | job | `\"overwrite\"` would drop and recreate the table |\n| `.save()` | `.save()` | Runs the write (an action) | job | Each partition writes in its own transaction |\n\n### Progress listener\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `StreamingQueryListener` | `class ProgressLogger(StreamingQueryListener)` | Base class for query event callbacks | job | The callbacks run on the driver; keep them fast |\n| `spark.streams.addListener(l)` | `spark.streams.addListener(ProgressLogger())` | Registers the listener | job `main()` | Add it before `.start()` to see the first batch |\n| `onQueryStarted(event)` | prints `event.id` | Called once at start | job | — |\n| `onQueryProgress(event)` | `json.loads(event.progress.json)` | Called after each batch with its report | job | Field names are camelCase: `numInputRows`, `durationMs` |\n| `onQueryIdle(event)` | `pass` | Called when a trigger finds no new data | job | Added in Spark 3.5; defined here so every callback is covered |\n| `onQueryTerminated(event)` | prints `event.exception` | Called when the query ends | job | `exception=None` = clean stop |\n\n---\n\n## Part 2: Python libraries used around Spark\n\n| Name | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `argparse` | `ap.add_argument(\"--rows\", type=int, default=100)` | Command-line options | gen, job, perf | `--bad-rate` becomes `args.bad_rate` |\n| `csv.DictWriter` | `writer.writeheader(); writer.writerows(events)` | Writes dicts as CSV rows | gen | Open with `newline=\"\"` on Windows or you get blank lines |\n| `datetime.now(timezone.utc)` | `.strftime(\"%Y-%m-%d %H:%M:%S.%f\")[:-3]` | Current UTC time as text, ms precision | gen | `%f` is microseconds; `[:-3]` cuts to ms |\n| `load_dotenv()` | `load_dotenv()` | Reads `.env` into environment variables | gen, job, perf | Does not overwrite variables already set, so `PGPORT=5499 python ...` wins |\n| `os.getenv(k, default)` | `os.getenv(\"MAX_FILES\", \"1\")` | Reads a setting | job | Always a string: hence `int(...)` |\n| `os.replace(a, b)` | `os.replace(tmp_path, ...)` | Atomic rename (overwrites `b`) | gen | Atomic only on the same disk |\n| `psycopg2.connect(**PG)` | `with psycopg2.connect(**PG) as conn, conn.cursor() as cur:` | Opens a connection; the `with` block is a transaction | job | `with` commits or rolls back but does **not** close the connection |\n| `cur.execute(sql, params)` | `cur.execute(MERGE_SQL)` | Runs SQL | job, perf | Use `%s` parameters, never string formatting, for values |\n| `cur.rowcount` | `inserted = cur.rowcount` | Rows affected by the last statement | job | For `ON CONFLICT DO NOTHING`: only rows actually inserted |\n| `cur.fetchone()` | `n, p50, p95, worst, rate = cur.fetchone()` | One result row as a tuple | perf | Numbers come back as `Decimal`: hence `float(...)` |\n| `random.choices(seq, weights)` | `random.choices(EVENT_TYPES, weights=EVENT_WEIGHTS)[0]` | Weighted pick (75/17/8) | gen | Returns a list; `[0]` takes the item |\n| `uuid.uuid4()` | `str(uuid.uuid4())` | Random unique id | gen | Not affected by `random.seed` |\n| `statistics.mean` | `statistics.mean(trig)` | Average | perf | Includes the slow first batch |\n\n---\n\n## Part 3: SQL and psql\n\n### Symbols and psql commands\n\n| Item | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `--` | `-- 1. Database.` | Comment to end of line | setup | — |\n| `\\set ON_ERROR_STOP on` | first line | psql stops at the first error | setup | Without it psql carries on after errors |\n| `:'var'` | `:'app_password'` | Inserts a `-v` variable as a quoted literal | setup | Set with `psql -v app_password='...'` |\n| `\\gexec` | `SELECT 'CREATE DATABASE ecommerce' WHERE NOT EXISTS (...)\\gexec` | Runs each result value as a SQL command | setup | No row = nothing runs: the \"if not exists\" trick |\n| `\\connect db` | `\\connect ecommerce` | Switch database inside the script | setup | Plain SQL cannot switch databases |\n| `\\d table` | `\\d events` | Describe columns, keys, indexes | TC-03 | psql only |\n| `::type` | `round(x::numeric, 1)` | Cast | drills | `round(double, 1)` does not exist; cast to `numeric` |\n| `%L` | `format('CREATE ROLE ... PASSWORD %L', ...)` | Quote as a literal inside `format()` | setup | Safe against quotes in the password |\n| `%s` | `BETWEEN %s AND %s` | psycopg2 placeholder, not SQL | perf | Filled by the driver, safely quoted |\n\n### psql options (command line)\n\n| Option | Meaning | Example |\n|---|---|---|\n| `-h` / `-p` | host / port | `-h localhost -p 5432` |\n| `-U` / `-d` | user / database | `-U postgres -d ecommerce` |\n| `-v name=value` | set a variable | `-v app_password='...'` |\n| `-f file` | run a file | `-f postgres_setup.sql` |\n| `-c \"sql\"` | run one command | `-c \"SELECT count(*) FROM events;\"` |\n| `-w` | never ask for a password (fail instead) | used in the drills |\n\n### A–C\n\n| Keyword | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `AND` / `OR` | `WHERE user_id \u003c= 0 OR product_id \u003c= 0 ...` | Both true / either true | drill 5 | `AND` binds tighter than `OR`: add brackets when mixing |\n| `avg(x)` | `round(avg(price), 2)` | Mean | drill 2 | Ignores nulls |\n| `BETWEEN a AND b` | `WHERE ingested_at BETWEEN %s AND %s` | Inclusive range | perf | Inclusive at both ends |\n| `CHECK (cond)` | `user_id INT NOT NULL CHECK (user_id > 0)` | Row rule; insert fails if false | setup | A null makes the check *unknown*, which passes: pair with `NOT NULL` |\n| `count(*)` / `count(DISTINCT x)` | `count(*)`, `count(DISTINCT event_id)` | Rows / different values | perf, tests | `count(x)` skips nulls |\n| `CREATE DATABASE` | built by `\\gexec` | New database | setup | Has no `IF NOT EXISTS`; cannot run inside a transaction |\n| `CREATE INDEX IF NOT EXISTS` | `idx_events_time ON events (event_time)` | Index for fast lookups by a column | setup | Speeds reads, slows each insert a little |\n| `CREATE ROLE ... LOGIN PASSWORD` | `CREATE ROLE spark_app LOGIN PASSWORD %L` | A user that can log in | setup | Roles are server-wide, not per database |\n| `CREATE TABLE IF NOT EXISTS` | `CREATE TABLE IF NOT EXISTS events (...)` | Create only if missing | setup | Does not alter an existing table to match |\n\n### D–I\n\n| Keyword | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `date_trunc('minute', t)` | `date_trunc('minute', event_time)` | Cut a time down to the minute | drill 1 | Uses the session zone for day/hour boundaries |\n| `DEFAULT now()` | `ingested_at TIMESTAMPTZ NOT NULL DEFAULT now()` | Fill when the insert does not give a value | setup | `now()` = start of the **transaction**, same for every row in the merge |\n| `DO NOTHING` | `ON CONFLICT (event_id) DO NOTHING` | Skip the conflicting row | job | Counts as 0 in `rowcount` |\n| `EXCLUDING CONSTRAINTS` | in `LIKE events ...` | Copy columns but not CHECKs | setup | `NOT NULL` is still copied (it belongs to the column) |\n| `extract(epoch FROM interval)` | `extract(epoch FROM ingested_at - event_time)` | Interval to seconds | perf | Returns `numeric` in PostgreSQL 14+ |\n| `FILTER (WHERE ...)` | `count(*) FILTER (WHERE event_type = 'purchase')` | Aggregate only matching rows | drill 4 | — |\n| `format(fmt, ...)` | `format('CREATE ROLE spark_app LOGIN PASSWORD %L', :'app_password')` | Build a string safely | setup | `%I` for names, `%L` for values |\n| `GRANT ... ON ... TO` | `GRANT SELECT, INSERT ON events TO spark_app` | Give rights | setup | `CONNECT` on the database and `USAGE` on the schema are needed too |\n| `greatest(a, b)` | `greatest(extract(...), 1)` | Larger value | perf | Avoids dividing by zero |\n| `GROUP BY` | `GROUP BY category` / `GROUP BY 1, 2` | One output row per group | drills | Numbers refer to SELECT positions |\n| `IN (...)` | `CHECK (event_type IN ('view', 'add_to_cart', 'purchase'))` | In the list | setup | — |\n| `INCLUDING DEFAULTS` | in `LIKE events ...` | Copy `DEFAULT now()` too | setup | — |\n| `INSERT INTO ... SELECT` | `INSERT INTO events (...) SELECT ... FROM events_staging` | Copy rows from a query | job `MERGE_SQL` | Column lists must line up by position |\n| `INT` / `TEXT` / `NUMERIC(10,2)` | column types | 4-byte integer / any length text / exact decimal | setup | Use `NUMERIC` for money, never `float` |\n\n### L–W\n\n| Keyword | As used | What it does | Line | Gotcha |\n|---|---|---|---|---|\n| `LIKE table` | `CREATE TABLE ... events_staging (LIKE events ...)` | Copy another table's columns | setup | A copy at creation time; later changes to `events` do not follow |\n| `LIMIT n` | `LIMIT 5` | First n rows | drills | Use with `ORDER BY` or the rows are arbitrary |\n| `max` / `min` | `max(ingested_at) - min(ingested_at)` | Largest / smallest | perf | — |\n| `NOT EXISTS (subquery)` | `WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'spark_app')` | True if the subquery has no rows | setup | `SELECT 1`: the value does not matter |\n| `NOT NULL` | `event_time TIMESTAMPTZ NOT NULL` | Value required | setup | — |\n| `ON CONFLICT (col)` | `ON CONFLICT (event_id)` | What to do when the unique key exists | job | Needs a unique index or PK on that column |\n| `ORDER BY` | `ORDER BY revenue DESC` | Sort | drills | — |\n| `percentile_cont(f) WITHIN GROUP (ORDER BY x)` | `percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(...))` | The value at fraction f of the sorted list, interpolated | perf | `percentile_disc` returns a real row value instead; returns `double precision` |\n| `pg_database` / `pg_roles` | `SELECT 1 FROM pg_database WHERE datname = 'ecommerce'` | System catalogs of databases / roles | setup | — |\n| `PRIMARY KEY` | `event_id TEXT PRIMARY KEY` | Unique + not null + index | setup | The base of idempotency |\n| `round(x, n)` | `round(avg(price), 2)` | Round to n decimals | drills | Needs `numeric` |\n| `SELECT` | everywhere | Read data | — | — |\n| `SET timezone = 'UTC'` | before checking times | Display times in UTC for this session | TC-03, drills | Only display; stored instants do not change |\n| `sum(x)` | `sum(price * quantity)` | Total | drill 2 | — |\n| `TIMESTAMPTZ` | `event_time TIMESTAMPTZ NOT NULL` | Absolute instant | setup | Plain `TIMESTAMP` stored times +2 h off via JDBC |\n| `TRUNCATE` | `TRUNCATE events_staging` | Empty a table instantly | job | Takes a strong lock; needs the `TRUNCATE` grant |\n| `USAGE ON SCHEMA` | `GRANT USAGE ON SCHEMA public TO spark_app` | May see objects in the schema | setup | Without it, table grants are useless |\n| `WHERE` | `WHERE event_type = 'purchase'` | Row filter | everywhere | — |\n","study/13-review-day-runbook.md":"# 13 — Review-Day Runbook\n\nA live demo script: what to check before the review, the exact commands to\nrun, what you should see, what to say, and what to do if something fails\nin front of the reviewer. Commands are given for PowerShell and Git Bash\nwhere they differ. Run everything from the project folder\n`C:\\Workstation\\Amalitech\\Week-5\\Real-Time-Data-Ingestion`.\n\n> **Help:** every command's background is in [01 · Setup: PostgreSQL and Spark](01-setup-postgres-and-spark.md) and [../user_guide.md](../reports/user_guide.md). The test you show live is explained in [07 · Testing the pipeline](07-testing-the-pipeline.md). Answers to likely questions are in [10 · Code-review defense](10-code-review-defense.md).\n\n## What state things are in\n\n| Item | State (as of 4 November 2026) |\n|---|---|\n| PostgreSQL 18 | Windows service on `localhost:5432`, starts at boot |\n| Database `ecommerce` | `events`: **138,629** rows, all distinct `event_id`s. `events_staging`: 0 rows |\n| Role `spark_app` | Not a superuser. Password only in `.env` |\n| Checkpoints | `checkpoint/events`, `checkpoint/perf_P2`, `checkpoint/perf_P3` |\n| Evidence | `reports/logs/`, `metrics/*.jsonl`, `reports/test_cases.md`, `reports/performance_metrics.md` |\n\nThe demo below uses **its own folders** (`data/demo`, `checkpoint/demo`),\nso it never disturbs the recorded runs. You do not need to empty `events`:\nevery check counts only rows that landed during the demo.\n\n---\n\n## 15 minutes before the review\n\nOpen three terminals in the project folder. Call them **JOB**, **GEN**\nand **SQL**.\n\n### 1. PostgreSQL is up and the data is there\n\nPowerShell:\n\n```powershell\nGet-Service postgresql*\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -w -h localhost -U postgres -d ecommerce -c \"SELECT count(*), count(DISTINCT event_id) FROM events;\"\n```\n\nGit Bash:\n\n```bash\nPSQL=\"/c/Program Files/PostgreSQL/18/bin/psql.exe\"\n\"$PSQL\" -w -h localhost -U postgres -d ecommerce -c \"SELECT count(*), count(DISTINCT event_id) FROM events;\"\n```\n\nThe service must say `Running`; the query must show two equal numbers\n(138629 if nothing was added since). **Connection refused** means the\nservice is stopped: start it from an admin PowerShell with\n`Start-Service postgresql*`, or from the Services app.\n\n### 2. `.env` is present, without showing the password\n\n```powershell\nSelect-String -Path .env -Pattern \"PASSWORD\" -NotMatch\n```\n\n```bash\ngrep -v PASSWORD .env\n```\n\nYou should see `PGHOST=localhost`, `PGPORT=5432`, `PGDATABASE=ecommerce`,\n`PGUSER=spark_app` and the four job settings. Check the password works\nwithout printing it:\n\n```powershell\npython -c \"import os, psycopg2, dotenv; dotenv.load_dotenv(); psycopg2.connect(host=os.getenv('PGHOST'), port=os.getenv('PGPORT'), dbname=os.getenv('PGDATABASE'), user=os.getenv('PGUSER'), password=os.getenv('PGPASSWORD')).close(); print('spark_app login OK')\"\n```\n\n### 3. Java, Python and winutils\n\n```powershell\njava -version                      # 17.x\npython --version                   # 3.13\n$env:HADOOP_HOME = \"C:\\Users\\User\\hadoop\"; $env:PATH += \";$env:HADOOP_HOME\\bin\"\nTest-Path \"$env:HADOOP_HOME\\bin\\winutils.exe\"     # True\n```\n\n```bash\nexport HADOOP_HOME=\"C:\\\\Users\\\\User\\\\hadoop\"; export PATH=\"$PATH:/c/Users/User/hadoop/bin\"\nls /c/Users/User/hadoop/bin/winutils.exe\n```\n\nSet `HADOOP_HOME` in the **JOB** terminal especially. A terminal opened\nbefore winutils was installed does not have it.\n\n### 4. Reset the demo folders\n\nPowerShell:\n\n```powershell\nRemove-Item -Recurse -Force data\\demo, checkpoint\\demo -ErrorAction SilentlyContinue\n```\n\nGit Bash:\n\n```bash\nrm -rf data/demo checkpoint/demo\n```\n\nNever delete `checkpoint/events`: it is the evidence for TC-05 to TC-08.\n\n### 5. Open these files in VS Code, in this order\n\n1. `Real-Time-Data-Ingestion-II.md` (the spec)\n2. `reports/system_architecture.png`\n3. `data_generator.py`\n4. `spark_streaming_to_postgres.py`\n5. `postgres_setup.sql`\n6. `reports/test_cases.md`\n7. `reports/performance_metrics.md`\n\n---\n\n## The demo, in order (about 15 minutes)\n\n### Stage 1: The architecture (2 min)\n\nOpen `reports/system_architecture.png` and give the two-minute summary\n(end of this page). Then point at the spec's deliverables table and say\nthat all nine files are in the folder.\n\n### Stage 2: Start the job (1 min, plus ~30 s start-up)\n\n**JOB** terminal, PowerShell:\n\n```powershell\n$env:HADOOP_HOME = \"C:\\Users\\User\\hadoop\"; $env:PATH += \";$env:HADOOP_HOME\\bin\"\n$env:INPUT_DIR = \"data/demo\"; $env:CHECKPOINT_DIR = \"checkpoint/demo\"; $env:MAX_FILES = \"5\"\npython spark_streaming_to_postgres.py\n```\n\nGit Bash:\n\n```bash\nexport HADOOP_HOME=\"C:\\\\Users\\\\User\\\\hadoop\"\nINPUT_DIR=data/demo CHECKPOINT_DIR=checkpoint/demo MAX_FILES=5 python spark_streaming_to_postgres.py\n```\n\nThese variables beat `.env`, because `load_dotenv()` never overwrites a\nvariable that is already set. While Spark starts (25 to 30 s), say:\n\"Spark is starting the JVM and loading the PostgreSQL JDBC driver.\"\n\nYou should see:\n\n```\nquery started: id=...\nwatching data/demo every 5 seconds, up to 5 file(s) per batch\n```\n\nTwo warnings are normal: `spark.sql.adaptive.enabled is not supported in\nstreaming ...` and `Disabling AQE since AQE is not supported in stateful\nworkloads`. AQE (adaptive query execution) is a batch optimisation that\nSpark switches off for streaming. Say so if asked.\n\nNote the UTC start time in the **SQL** terminal for later:\n\n```powershell\n$since = (Get-Date).ToUniversalTime().ToString(\"yyyy-MM-ddTHH:mm:ssZ\"); $since\n```\n\n```bash\nsince=$(date -u +%Y-%m-%dT%H:%M:%SZ); echo $since\n```\n\n### Stage 3: Start the generator (2 min)\n\n**GEN** terminal (`INPUT_DIR` must match the job's folder):\n\n```powershell\n$env:INPUT_DIR = \"data/demo\"\npython data_generator.py --rows 100 --every 2 --batches 30 --bad-rate 0.2 --seed 42 | Tee-Object -Variable gen\n```\n\n```bash\nINPUT_DIR=data/demo python data_generator.py --rows 100 --every 2 --batches 30 --bad-rate 0.2 --seed 42 | tee reports/logs/demo_gen.log\n```\n\nThe `Tee-Object` / `tee` part shows the output and also keeps it, for\nthe exact-count check in Stage 4.\n\nGEN prints one line per file: `events_..._.csv: 100 rows (23 spoiled)`.\nJOB prints one line per batch: `batch 3: 162 rows, 162 inserted, 1.3 s`.\nThe first batch takes ~6 s; later ones ~1.3 s inside `write_batch`.\n\n**Say:** \"20% of rows are broken on purpose. The generator prints how many\nper file, so I know exactly how many rows should arrive: rows written\nminus rows spoiled.\"\n\nOptional: open `http://localhost:4040` while the job runs. The\n**Structured Streaming** tab shows input rate and batch duration live.\n\n### Stage 4: Check the database (3 min)\n\n**SQL** terminal. Open psql (`& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\"\n-w -h localhost -U postgres -d ecommerce`, or `\"$PSQL\" ...` in Git Bash),\nthen:\n\n```sql\nSET timezone = 'UTC';\n\n-- rows from the demo so far (keep re-running while the generator writes)\nSELECT count(*) FROM events WHERE ingested_at > now() - interval '10 minutes';\n\n-- the newest rows: times match the CSV exactly (TIMESTAMPTZ)\nSELECT event_id, event_time, user_id, event_type, price, ingested_at\nFROM events ORDER BY ingested_at DESC LIMIT 5;\n\n-- nothing broken got in\nSELECT count(*) AS rule_breakers FROM events\nWHERE user_id \u003c= 0 OR product_id \u003c= 0 OR price \u003c 0 OR quantity \u003c 0\n   OR event_type NOT IN ('view', 'add_to_cart', 'purchase');\n\n-- no duplicates, staging emptied\nSELECT count(*) = count(DISTINCT event_id) AS no_dupes FROM events;\nSELECT count(*) FROM events_staging;\n```\n\nIf the demo has been running longer than 10 minutes, widen the interval.\nExpected: the count grows every ~5 s; `rule_breakers` 0; `no_dupes` `t`;\nstaging 0.\n\n**The exact-count check.** When GEN prints `done: 30 files, 3000 rows`,\nadd up the spoiled numbers in the **GEN** terminal:\n\n```powershell\n($gen | Select-String '\\((\\d+) spoiled' | ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum).Sum\n```\n\n```bash\npython -c \"import re;print(sum(int(x) for x in re.findall(r'\\((\\d+) spoiled', open('reports/logs/demo_gen.log').read())))\"\n```\n\nRows in `events` from the demo should equal 3,000 minus that number.\n\n**Say:** \"This exact count is how I found the user_id -5 bug in TC-04:\n27 rows too many.\"\n\n### Stage 5: A live test, the duplicate file (2 min)\n\nWhile the job runs, copy a processed file under a new name. Copy to an\nunderscore name first, then rename, so Spark never sees half a file.\n\nPowerShell (**GEN** terminal, after the generator finished):\n\n```powershell\n$f = Get-ChildItem data\\demo\\events_*.csv | Select-Object -First 1\nCopy-Item $f.FullName data\\demo\\_dup.csv\nRename-Item data\\demo\\_dup.csv events_zz_duplicate_copy.csv\n```\n\nGit Bash:\n\n```bash\nf=$(ls data/demo/events_*.csv | head -1)\ncp \"$f\" data/demo/_dup.csv && mv data/demo/_dup.csv data/demo/events_zz_duplicate_copy.csv\n```\n\nWhat happens: Spark reads the file (it is a new name), `dropDuplicates`\nrecognises every `event_id`, and the batch has 0 rows to write. JOB\nprints **no** `batch` line, because `write_batch` returns early on an\nempty batch. Prove it in two places:\n\n```sql\nSELECT count(*) FROM events WHERE ingested_at > now() - interval '10 minutes';   -- unchanged\n```\n\n```powershell\nGet-Content metrics\\progress.jsonl -Tail 2\n```\n\n```bash\ntail -2 metrics/progress.jsonl\n```\n\nThe last progress line shows `num_input_rows` of about 100 (Spark read\nthe file), yet nothing was inserted.\n\n**Say:** \"In TC-07 the same test read 98 rows and passed 0. If the copy\ncame after the 10-minute watermark, the primary key with ON CONFLICT DO\nNOTHING would skip the rows instead.\"\n\n**Alternative test: forced replay** (if asked, 3 min). Stop the job with\nCtrl+C. Delete the highest-numbered file in `checkpoint\\demo\\commits`\n(if `offsets` has a higher number than `commits`, delete that offset\ntoo, as TC-05 did for batch 43). Start the job again with the Stage 2\ncommand. JOB prints `batch N: X rows, 0 inserted`. The recorded version:\nbatch 42, 83 rows, 0 inserted.\n\n### Stage 6: Metrics and the performance report (3 min)\n\nStop the job with Ctrl+C in **JOB** (it prints `query stopped:\nexception=None`). Then:\n\n```powershell\npython -m src.perf_report --since $since --label \"review demo\"\n```\n\n```bash\npython -m src.perf_report --since \"$since\" --label \"review demo\"\n```\n\nPoint at: batches with data, Spark's rows read, mean batch duration,\nlanded rows, latency p50 / p95 / max. Then open `reports/performance_metrics.md`\nand walk the P1 / P2 / P3 table:\n\n- P1: `MAX_FILES=1` at 50 rows/s fell behind, p50 62.7 s.\n- P2: `MAX_FILES=5`, same load: p50 5.4 s, p95 13.4 s.\n- P3: 1,000 rows/s, 10 s trigger: 2,495 rows/s processed, p50 16.6 s.\n\n**Say:** \"2.5 files arrived for every file processed in P1. The batches\ntook 3 seconds of their 5, so the cap was the bottleneck, not the machine.\nOne setting fixed it.\"\n\nThe demo used `--bad-rate 0.2` and a 2 s file interval, so its numbers are\nclose to P2's but not identical. That is fine: say it.\n\n### Stage 7: Questions (rest of the time)\n\nKeep [10 · Code-review defense](10-code-review-defense.md) open. Lead\nwith the weak spots before you are asked.\n\n---\n\n## The 2-minute verbal summary\n\n1. **What (20 s).** \"A pipeline that moves fake shop events from CSV files\n   into PostgreSQL within seconds, using Spark Structured Streaming.\"\n2. **Flow (40 s).** \"The generator writes a CSV every few seconds, under\n   an underscore name, then renames it, so Spark never reads half a\n   file. Every 5 seconds Spark reads up to N new files, reads every\n   column as text, casts with try_cast, filters invalid rows, and drops\n   duplicate event ids within a 10-minute watermark. foreachBatch\n   appends the batch to a staging table by JDBC, then one SQL statement\n   moves it into events with ON CONFLICT DO NOTHING and empties staging.\"\n3. **Safety (30 s).** \"The checkpoint records which files each batch read\n   and whether it finished. A crash means the batch is re-run, and the\n   primary key makes the re-run harmless. Tested: forced replay inserted\n   0 of 83, a hard kill and a database outage lost nothing, and the exact\n   row count caught a real bug.\"\n4. **Performance (20 s).** \"p50 latency 5.4 seconds at 50 rows a second;\n   it kept up at 1,000 rows a second. The default of one file per batch\n   falls behind under load, and I can show the arithmetic.\"\n5. **Limits (10 s).** \"One laptop, short runs, a file source not Kafka,\n   rejected rows not stored yet.\"\n\n---\n\n## If something fails live\n\n| Symptom | Likely cause | What to do |\n|---|---|---|\n| `Connection refused` from psql or the job | PostgreSQL service stopped | `Start-Service postgresql*` (admin), rerun |\n| `UnsatisfiedLinkError ... NativeIO$Windows` or `HADOOP_HOME and hadoop.home.dir are unset` | `HADOOP_HOME` not set in this terminal | Set it inline (Stage 2 command), restart the job |\n| `password authentication failed for user \"spark_app\"` | `.env` password differs from the role's | Check step 2. Do not type the password on screen |\n| Spark hangs at `:: resolving dependencies` | No internet and the driver not cached | It is cached in `~/.ivy2.5.2` from earlier runs; check Wi-Fi, wait 30 s |\n| Job runs, but no `batch` lines | GEN writes to another folder | Both terminals need `INPUT_DIR=data/demo`. Check `ls data/demo` |\n| Batches read 0 files on restart | Files already recorded in `checkpoint/demo` | Expected after a restart. Generate new files, or reset (step 4) |\n| Latency keeps growing | Falling behind | You started with `MAX_FILES=1`. Say \"this is P1\", then restart with `MAX_FILES=5` |\n| `Current batch is falling behind` once at start | Slow first batch (~6 to 12 s) | Normal. Explain it is about one slow batch, not backlog |\n| `Failed to delete ... postgresql-42.7.4.jar` at exit | Windows locks the jar during shutdown | Harmless. Say so and move on |\n| `The state for version N doesn't exist in loadedMaps` | First batch after a restart reloads state from disk | Harmless; Spark's own message says it is normal |\n| Spark UI on 4041 instead of 4040 | Another Spark session still running | Harmless. Close the other one when convenient |\n| Ctrl+C does not stop the job | Shutdown stuck | Second Ctrl+C, or `taskkill /F /IM java.exe` in another terminal. The checkpoint makes this safe (the hard-kill test) |\n| Something fails that you can't fix in a minute | — | Stop. Show the recorded evidence instead: `reports/logs/`, `metrics/batches.jsonl`, `reports/test_cases.md`. Every test has its log |\n\n## Self-check\n\n1. Why does the demo use `data/demo` and `checkpoint/demo`? [So it does\n   not disturb the recorded runs or inherit their \"already done\" files.]\n2. Why does the duplicate file print no `batch` line? [Its batch has 0\n   rows after `dropDuplicates`, and `write_batch` returns early on 0.]\n3. Which two warnings are harmless at start-up? [AQE disabled for\n   streaming / stateful workloads.]\n4. What do you show if the live demo breaks? [The recorded evidence:\n   `reports/logs/`, `metrics/*.jsonl`, `reports/test_cases.md`, `reports/performance_metrics.md`.]\n","reports/project_overview.md":"# Project Overview: Real-Time E-commerce Event Ingestion\n\nA pipeline that simulates an online shop's user activity and loads it into\nPostgreSQL as it happens. Fake events (product views, add-to-carts, purchases)\nare written as CSV files. Spark Structured Streaming picks up each new file\nwithin seconds, cleans it, and writes the rows into a PostgreSQL table.\n\n![System architecture](system_architecture.png)\n\n## Components\n\n| Component | File | Role |\n|---|---|---|\n| Event generator | `src/data_generator.py` (run as `python data_generator.py`) | Writes a CSV of fake events every few seconds into `data/incoming/`. A set share of rows is deliberately broken so the cleaning can be tested |\n| Streaming job | `src/cleaning.py`, `src/postgres_sink.py`, `src/main.py` (run as `python spark_streaming_to_postgres.py`) | Watches the folder, reads each new file once, casts and validates every row, drops duplicates, and writes each micro-batch to PostgreSQL |\n| Database | `postgres_setup.sql` | Creates the `ecommerce` database, the `spark_app` login, the `events` table and its `events_staging` landing table |\n| Checkpoint | `checkpoint/events/` | Spark's memory: which files each batch read, which batches finished, and the deduplication state. Lets the job restart where it stopped |\n| Metrics | `metrics/*.jsonl`, `src/perf_report.py` | Spark's progress report per batch, a per-batch write log, and a latency summary from the database |\n\n## Data flow\n\n1. **Generate.** The generator builds 100 events (by default). Each has a\n   UUID `event_id`, a UTC timestamp with milliseconds, a user, a product, a\n   category and a price. It writes them to `_events_\u003ctime>.csv`, then renames\n   the file to `events_\u003ctime>.csv`. Spark ignores names starting with `_`,\n   so it never sees a half-written file.\n2. **Detect.** Every 5 seconds (the trigger), Spark lists the folder and takes\n   up to `MAX_FILES` new files as one micro-batch.\n3. **Clean.** Every column is read as text and then converted with `try_cast`,\n   so a bad value becomes null instead of crashing the batch. A row is kept\n   only if it has an id and a valid time, a positive user and product id,\n   a known event type and a price ≥ 0.\n4. **De-duplicate.** Rows with an `event_id` already seen in the last 10\n   minutes of event time are dropped (`withWatermark` + `dropDuplicates`).\n5. **Write.** For each micro-batch, `foreachBatch` appends the rows to\n   `events_staging` over JDBC. One SQL statement then copies them into\n   `events` with `ON CONFLICT (event_id) DO NOTHING` and empties the staging table.\n6. **Commit.** Only after the write succeeds does Spark record the batch as\n   done in the checkpoint.\n\n## Table\n\n```sql\nevents (\n  event_id    TEXT PRIMARY KEY,\n  event_time  TIMESTAMPTZ NOT NULL,\n  user_id     INT NOT NULL CHECK (user_id > 0),\n  session_id  TEXT,\n  event_type  TEXT NOT NULL CHECK (event_type IN ('view','add_to_cart','purchase')),\n  product_id  INT NOT NULL CHECK (product_id > 0),\n  category    TEXT,\n  price       NUMERIC(10,2) NOT NULL CHECK (price >= 0),\n  quantity    INT CHECK (quantity >= 0),\n  ingested_at TIMESTAMPTZ NOT NULL DEFAULT now()\n)\n```\n\n## Design decisions\n\n| Decision | Why |\n|---|---|\n| Read as strings, then `try_cast` | One bad value nulls one field and fails one row's checks. It does not fail the file. Spark 4 runs in ANSI mode, where a plain `cast` throws |\n| Staging table + `ON CONFLICT DO NOTHING` | Spark delivers each batch *at least once*: after a crash it re-runs the last unfinished batch. Keying on `event_id` makes a re-run insert nothing twice. Tested: a forced replay of 83 rows inserted 0 |\n| Watermark + `dropDuplicates` | Catches the same event arriving twice (e.g. a re-sent file) before it reaches the database. The watermark lets Spark forget old ids, so memory stays bounded |\n| `TIMESTAMPTZ` columns | Stores an absolute instant. With plain `TIMESTAMP`, the JDBC driver wrote times in the laptop's zone (UTC+2), so every event looked 2 hours late |\n| `ingested_at DEFAULT now()` | The database stamps arrival time, so end-to-end latency is `ingested_at − event_time` with no extra code |\n| Rules in Spark *and* `CHECK` constraints in PostgreSQL | Spark filters bad rows. The constraints stop anything that slips past. Testing found exactly that case: `user_id = -5` passed a not-null check |\n| Dedicated `spark_app` role | The job can insert events and empty its staging table, nothing else. The password lives only in `.env` |\n| Settings from `.env` | The same code runs against another database, folder or trigger without edits |\n\n## Results\n\n- **Correctness:** with 20% of rows deliberately broken, exactly the expected\n  1,615 of 2,000 rows arrived, and none broke a rule. Restarts, a hard kill,\n  a duplicated file, a forced batch replay and an unreachable database all\n  ended with the expected row count and no duplicates. See [test_cases.md](test_cases.md).\n- **Performance:** at 50 rows/s with 5 files per batch, p50 latency was 5.4 s.\n  At 1,000 rows/s with 10 files per batch and a 10 s trigger, 2,495 rows/s\n  were processed. With only 1 file per batch, the job falls behind. See\n  [performance_metrics.md](performance_metrics.md).\n\n## Limitations and next steps\n\n- Rejected rows are dropped without a record. A production version would\n  write them to a `events_rejected` table (a \"dead-letter\" table) with the reason.\n- A folder of CSV files stands in for a message queue. Kafka would be the\n  usual source in production, and Spark's code would change only in `readStream`.\n- The staging table assumes one writer. Two jobs at once would need a staging\n  table per job, or a batch-id column.\n- Everything was measured on one laptop.\n","reports/user_guide.md":"# User Guide\n\nHow to set up and run the pipeline, check that it works, and reset it.\nCommands are for Windows PowerShell. Git Bash variants are given where they\ndiffer.\n\n## 1. Prerequisites\n\n| Need | Check with | Notes |\n|---|---|---|\n| Java 17 | `java -version` | Spark runs on the JVM |\n| Python 3.10+ | `python --version` | Tested with 3.13 |\n| PostgreSQL 16+ | `& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" --version` | Tested with 18, running on port 5432 |\n| winutils (Windows only) | `echo $env:HADOOP_HOME` | `winutils.exe` and `hadoop.dll` in `%HADOOP_HOME%\\bin`. Spark's checkpoint writes fail without them |\n| Internet, once | | The first run downloads the PostgreSQL JDBC driver from Maven |\n\n## 2. Install\n\n```powershell\npip install -r requirements.txt\n```\n\n## 3. Create the database\n\nRun the setup script as the `postgres` superuser. Choose a password for the\npipeline's own login, `spark_app`:\n\n```powershell\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -p 5432 -U postgres `\n    -v app_password='choose-a-password' -f postgres_setup.sql\n```\n\nThis creates the `ecommerce` database, the `spark_app` role, and the\n`events` and `events_staging` tables. Running it again is safe.\n\n## 4. Configure\n\n```powershell\ncopy .env.example .env\n```\n\nOpen `.env` and set `PGPASSWORD` to the password from step 3. The other\nvalues work as they are.\n\n## 5. Run\n\nUse two terminals, both in this folder.\n\n**Terminal 1: the streaming job.** Start it first. It takes about 30 seconds\nto start, then prints `watching data/incoming every 5 seconds`.\n\n```powershell\n$env:HADOOP_HOME = \"C:\\Users\\User\\hadoop\"      # only if not set system-wide\npython spark_streaming_to_postgres.py\n```\n\n**Terminal 2: the generator.**\n\n```powershell\npython data_generator.py                          # 100 rows every 2 s, until Ctrl+C\npython data_generator.py --rows 100 --every 2 --batches 20 --bad-rate 0.2\n```\n\n| Generator flag | Default | Meaning |\n|---|---|---|\n| `--rows` | 100 | rows per file |\n| `--every` | 2 | seconds between files |\n| `--batches` | 0 | number of files; 0 = until Ctrl+C |\n| `--bad-rate` | 0.02 | share of rows given one broken field |\n| `--seed` | none | fixed random numbers, for repeatable tests |\n| `--out` | `data/incoming` | target folder |\n\nThe job prints one line per micro-batch:\n\n```\nbatch 3: 85 rows, 85 inserted, 1.3 s\n```\n\nStop either program with **Ctrl+C**. To stop the job automatically, use\n`python spark_streaming_to_postgres.py --run-seconds 120`.\n\n## 6. Check the results\n\nUnit tests first. They need Spark but not PostgreSQL:\n\n```powershell\npytest\npyright\n```\n\n`analysis.ipynb` runs the generator, the cleaning steps and one\n`--once` pass into PostgreSQL on its own folder (`data/notebook/`), top to bottom.\n\n```powershell\n$psql = \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\"\n& $psql -h localhost -U spark_app -d ecommerce -c \"SELECT event_type, count(*) FROM events GROUP BY 1;\"\n& $psql -h localhost -U spark_app -d ecommerce -c \"SELECT count(*), count(DISTINCT event_id) FROM events;\"\n```\n\nThe two counts in the second query must be equal (no duplicates).\n\n**Latency and throughput** of a run (pass the run's start time, in UTC):\n\n```powershell\npython -m src.perf_report --since 2026-11-04T10:50:00Z --label \"my run\"\n```\n\nPer-batch details are in `metrics/batches.jsonl` (rows, rows inserted, write\ntimes) and `metrics/progress.jsonl` (Spark's own rates and durations).\n\n## 7. Tuning\n\nSet these in `.env`, or for one run: `$env:MAX_FILES = \"5\"`.\n\n| Setting | Default | Effect |\n|---|---|---|\n| `TRIGGER` | `5 seconds` | How often a micro-batch starts. Longer = bigger, cheaper batches, higher latency |\n| `MAX_FILES` | 1 | Most files per batch. Use 5 or more for real loads: with 1, the job falls behind at 50 rows/s |\n| `INPUT_DIR` | `data/incoming` | Folder the job watches |\n| `CHECKPOINT_DIR` | `checkpoint/events` | Where the job keeps its progress. One per query: never share it |\n\n## 8. Reset\n\nStop the job first. Then:\n\n```powershell\nRemove-Item -Recurse -Force checkpoint\nRemove-Item data\\incoming\\*.csv\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -U postgres -d ecommerce -c \"TRUNCATE events, events_staging;\"\n```\n\nIf you delete the checkpoint but keep the files, the job reads every file\nagain on its next star
