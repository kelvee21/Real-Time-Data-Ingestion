t. The primary key stops duplicate rows, so this is safe.\n\n## 9. Troubleshooting\n\n| Symptom | Cause and fix |\n|---|---|\n| `UnsatisfiedLinkError ... NativeIO$Windows` | winutils missing. Set `HADOOP_HOME` and add `%HADOOP_HOME%\\bin` to PATH, then open a new terminal |\n| `ClassNotFoundException: org.postgresql.Driver` | The JDBC download failed. Check internet access and run again |\n| `password authentication failed for user \"spark_app\"` | `PGPASSWORD` in `.env` differs from the one used in step 3 |\n| `Connection refused` | PostgreSQL is not running, or the port is wrong |\n| The job runs but writes nothing | The generator writes to another folder; or every row breaks a rule; or the files were already processed (see the checkpoint) |\n| Latency keeps growing | The job is falling behind. Raise `MAX_FILES` (section 7) |\n| `Failed to delete ... postgresql-42.7.4.jar` at exit | Windows keeps the jar locked during shutdown. Harmless |\n","reports/test_cases.md":"# Test Cases: Real-Time Event Ingestion\n\nManual test plan for the pipeline, with the result of each test when it was\nrun on 4 November 2026.\n\n**Environment:** Windows 11 laptop, Python 3.13, PySpark 4.3 (`local[*]`),\nJava 17, PostgreSQL 18 on `localhost:5432`, database `ecommerce`, role\n`spark_app`. Job settings: trigger 5 s, `MAX_FILES=1`, unless the test says\notherwise. The logs for each run are in `logs/`.\n\n**How the expected row count is known exactly.** The generator prints how\nmany rows it spoiled in each file (`100 rows (23 spoiled)`). Every kind of\nspoiling breaks a rule the job enforces, so the rows that reach PostgreSQL\nmust equal *rows generated − rows spoiled*, no more and no less.\n\n## Summary\n\n| ID | Test | Result |\n|---|---|---|\n| TC-01 | Generator writes complete CSV files | Pass |\n| TC-02 | Spark detects and processes each new file | Pass |\n| TC-03 | Columns have the right types in PostgreSQL | Pass |\n| TC-04 | Dirty rows are rejected, clean rows all arrive | **Failed first, then Pass** after a fix |\n| TC-05 | A replayed batch does not create duplicates | Pass |\n| TC-06 | After a restart, old files are not read again | Pass |\n| TC-07 | A duplicated input file adds no rows | Pass |\n| TC-08 | Database unreachable: no data lost | Pass |\n| TC-09 | Throughput keeps up with the input rate | Pass at 2 of 3 settings (see performance_metrics.md) |\n\n---\n\n## TC-01: Generator writes complete CSV files\n\n| | |\n|---|---|\n| **Preconditions** | `data/incoming/` empty |\n| **Steps** | `python data_generator.py --rows 100 --every 2 --batches 20 --bad-rate 0.2 --seed 42` |\n| **Expected** | 20 files named `events_*.csv`, each with a header and 100 rows. No `_`-prefixed temporary files left behind. |\n| **Actual** | 20 files, header + 100 rows each. `ls -a data/incoming \\| grep -c '^_'` returned 0. |\n| **Result** | Pass |\n\n## TC-02: Spark detects and processes each new file\n\n| | |\n|---|---|\n| **Preconditions** | Job running (`python spark_streaming_to_postgres.py`), empty checkpoint |\n| **Steps** | Start the generator from TC-01 while the job runs. Watch the job's console and `metrics/batches.jsonl`. |\n| **Expected** | One micro-batch per file (`MAX_FILES=1`), 20 batches with data. |\n| **Actual** | Batches 0 to 19 each processed one file (75–89 valid rows each). `metrics/batches.jsonl` had 20 lines. |\n| **Result** | Pass |\n\n## TC-03: Columns have the right types in PostgreSQL\n\n| | |\n|---|---|\n| **Steps** | `\\d events` in psql. `SELECT event_time, price FROM events LIMIT 3;` |\n| **Expected** | `event_time` is `timestamp with time zone`, `price` is `numeric(10,2)`, `user_id`/`product_id`/`quantity` are `integer`. Times match the generator's UTC times. |\n| **Actual** | All types as expected. With `SET timezone='UTC'`, `event_time` values match the CSV strings exactly (no 2-hour shift). |\n| **Result** | Pass |\n\n## TC-04: Dirty rows are rejected, clean rows all arrive\n\n| | |\n|---|---|\n| **Preconditions** | Empty `events` table, empty checkpoint |\n| **Steps** | Run TC-01's generator (`--bad-rate 0.2`, seed 42) with the job running. Then: `SELECT count(*) FROM events;` and count rows breaking any rule. |\n| **Expected** | 2,000 generated − 385 spoiled = **1,615 rows**, and 0 rows breaking a rule. |\n| **Actual, first run** | **1,642 rows.** 27 too many. All 27 had `user_id = -5`. |\n| **Cause** | The filter only checked `user_id IS NOT NULL`. The bad value `\"-5\"` casts to a valid integer, so it passed. |\n| **Fix** | Filter changed to `user_id > 0` and `product_id > 0`. The same rule was added to the table as `CHECK (user_id > 0)` and `CHECK (product_id > 0)`, so the database also refuses such rows. |\n| **Actual, after the fix** | **1,615 rows**, 1,615 distinct `event_id`s, 0 rule-breaking rows, `events_staging` empty. |\n| **Result** | Pass (after fix). The run with the bug is kept in `logs/bug_run/`. |\n\n## TC-05: A replayed batch does not create duplicates\n\nSpark guarantees *at-least-once* delivery to `foreachBatch`: if the job stops\nafter writing a batch but before recording it as done, it runs that batch\nagain. This test forces exactly that situation.\n\n| | |\n|---|---|\n| **Preconditions** | 3,190 rows in `events`. Batch 42 (83 rows) already written and committed. |\n| **Steps** | 1. Stop the job. 2. Delete `checkpoint/events/commits/42` (and the empty batch 43's offset and commit files), so Spark believes batch 42 never finished. 3. Start the job. |\n| **Expected** | Spark re-runs batch 42. The merge inserts 0 rows. The total stays 3,190. |\n| **Actual** | `{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83}`. Total 3,190, distinct ids 3,190. |\n| **Result** | Pass |\n\nA hard kill was also tested: the job was killed with `taskkill /F` while the\ngenerator was writing 15 files, then restarted. All 1,176 valid rows arrived,\nwith no duplicates (`count = count(DISTINCT event_id) = 3,190`).\n\n## TC-06: After a restart, old files are not read again\n\n| | |\n|---|---|\n| **Preconditions** | The job from TC-04 stopped after batch 20. 20 files in the folder. |\n| **Steps** | Restart the job with the same checkpoint. Add 5 new files. |\n| **Expected** | Batch numbers continue from 21. Only the 5 new files are read. |\n| **Actual** | First new batch was 21. Batches 22–26 each held one new file. None of the 20 old files was read again. |\n| **Result** | Pass |\n\n## TC-07: A duplicated input file adds no rows\n\n| | |\n|---|---|\n| **Steps** | While the job runs, copy an already-processed file to `events_zz_duplicate_copy.csv` (copy to a `_` name first, then rename). |\n| **Expected** | Spark reads it as a new file, but no rows are added. |\n| **Actual** | Batch 21 read 98 rows and passed 0 on: the in-stream `dropDuplicates` (watermark 10 minutes) recognised every `event_id`. The total matched the expected 2,014 exactly. |\n| **Result** | Pass |\n\nIf the copy had arrived more than 10 minutes later, the watermark would have\nlet those ids out of Spark's memory. The primary key with\n`ON CONFLICT DO NOTHING` is the second line of defence that would then skip them.\n\n## TC-08: Database unreachable, no data lost\n\nThe database was made unreachable by pointing the job at a port with nothing\nlistening (`PGPORT=5499`). This has the same effect on the job as stopping\nthe server, without stopping the shared PostgreSQL service.\n\n| | |\n|---|---|\n| **Steps** | 1. Generate 3 files. 2. `PGPORT=5499 python spark_streaming_to_postgres.py`. 3. Then start the job again with the normal settings. |\n| **Expected** | Step 2: the batch fails, the query stops with an error, and the batch is not marked as done. Step 3: the batch is re-run and its rows arrive. |\n| **Actual** | Step 2: `psycopg2.OperationalError: ... port 5499 failed: Connection refused`, exit code 1. The checkpoint had offsets for batch 44 but no commit. Step 3: batch 44 re-ran, then 45 and 46. The total reached the expected 3,428, with no duplicates. |\n| **Result** | Pass |\n\n## TC-09: Throughput keeps up with the input rate\n\n| | |\n|---|---|\n| **Steps** | Three 2-minute runs at different loads and settings, each with its own input folder and checkpoint. See `performance_metrics.md`. |\n| **Expected** | Rows landing per second ≈ rows generated per second, with latency that stays flat. |\n| **Actual** | P1 (50 rows/s, 1 file per batch): **fell behind**. 24 of 60 files were still waiting at the end, and latency rose to 116 s. P2 (same load, 5 files per batch): kept up, p95 latency 13.4 s. P3 (1,000 rows/s, 10 files per batch, 10 s trigger): kept up, p95 21.9 s. |\n| **Result** | Fail at P1's settings, Pass at P2 and P3. The default `.env` uses `MAX_FILES=1` for the functional tests. Use 5 or more for real loads. |\n","reports/performance_metrics.md":"# Performance Metrics\n\nMeasured on 4 November 2026 on a Windows 11 laptop: Spark 4.3 in `local[*]`\nmode, PostgreSQL 18 on the same machine. Every number below comes from a\nreal run. The raw data is in `metrics/progress.jsonl`,\n`metrics/batches.jsonl` and `logs/perf_*`.\n\n## What was measured, and how\n\n| Metric | Meaning | Source |\n|---|---|---|\n| **Input rate** | Rows the generator wrote per second | generator settings (`--rows` ÷ `--every`) |\n| **Batch duration** | Time Spark took for one micro-batch, read to merge | `triggerExecution` in Spark's progress report, logged by the `ProgressLogger` listener |\n| **Processed rows/s** | Rows in a batch ÷ batch duration (Spark's own figure) | `processedRowsPerSecond` |\n| **Landed rows/s** | Rows that reached `events`, per second of the run | `count(*) / (max(ingested_at) − min(ingested_at))` |\n| **End-to-end latency** | Time from the event happening to the row being in PostgreSQL | `ingested_at − event_time`, as p50 / p95 / max |\n| **JDBC / merge time** | Time of the two writes inside each batch | `metrics/batches.jsonl` |\n\n`src/perf_report.py --since \u003cUTC time>` prints all of these for one run.\n\nEach run lasted about 2.5 minutes: 30 s to start Spark, then 2 minutes of\ngenerated files. Runs P2 and P3 used their own input folder and checkpoint,\nso no run inherited another's backlog. 2% of rows were spoiled on purpose.\n\n## Results\n\n| Run | Input | Trigger | Files per batch | Batches | Mean batch (ms) | Spark rows/s | Landed rows/s | Latency p50 / p95 / max |\n|---|---|---|---|---|---|---|---|---|\n| **P1** | 50 rows/s (100 every 2 s) | 5 s | 1 | 36 | 3,037 | 35 | **20.5** | 62.7 s / 113.2 s / 116.4 s |\n| **P2** | 50 rows/s (100 every 2 s) | 5 s | 5 | 24 | 3,306 | 84 | 53.3 | **5.4 s / 13.4 s** / 15.4 s |\n| **P3** | 1,000 rows/s (1,000 every 1 s) | 10 s | 10 | 15 | 3,746 | 2,495 | 902.1 | 16.6 s / 21.9 s / 22.6 s |\n\nInside each batch (medians from `metrics/batches.jsonl`), the JDBC append to\n`events_staging` took 1.2 s and the SQL merge into `events` 56 ms for batches\nof ~100 rows. For P3's batches of ~10,000 rows they took 1.4 s and 145 ms.\nThe first batch of every run is slower (6–12 s) because Spark compiles the\nquery and opens connections.\n\n## What the numbers say\n\n**1. P1 falls behind, and the cause is the settings, not the hardware.**\nWith `MAX_FILES=1` and a 5 s trigger, the job can take at most one file every\n5 s. The generator writes one every 2 s, so 2.5 files arrive for each one\nprocessed. The queue only grows: after 2 minutes, 24 of 60 files were still\nwaiting, and latency climbed steadily to almost 2 minutes. The machine was\nnot the limit: each batch took ~3 s of its 5 s slot. (Spark's\n`Current batch is falling behind` warning appeared only once per run, for the\nslow first batch, so it is not a reliable backlog alarm. Watch latency or the\nnumber of waiting files instead.)\n\n**2. P2 fixes it with one setting.** Same load, same trigger, but\n`MAX_FILES=5`. Each batch now takes everything that arrived since the last\none (about 2–3 files), so the queue never builds. p50 latency drops from\n62.7 s to 5.4 s. That is roughly half a trigger interval plus one batch\nduration, which is the floor for a 5 s micro-batch design.\n\n**3. Bigger batches are cheaper per row.** A batch of 100 rows took ~3 s. A\nbatch of ~10,000 rows (P3) took ~3.7 s. Most of a batch's time is fixed cost\n(planning, the JDBC connection, the merge transaction), not per-row work.\nSo P3 handled 20 times the input of P2 with only slightly longer batches,\nat 2,495 rows/s processed.\n\n**4. Latency vs throughput is a dial.** P3's longer trigger (10 s) gives\nbigger, more efficient batches, but every event waits longer for its batch\nto start: p50 16.6 s vs 5.4 s. Pick the trigger from the latency the\nbusiness needs, then set `maxFilesPerTrigger` high enough that the job keeps up.\n\n## Limits of these measurements\n\n- Everything ran on one laptop, so the generator, Spark and PostgreSQL competed\n  for the same CPU and disk. A cluster with a separate database would behave\n  differently.\n- Runs were 2 minutes long. A longer run would show whether state (the\n  deduplication store) slowly grows. The 10-minute watermark should keep it flat.\n- `numInputRows` is a little lower than the rows written (e.g. 5,984 of 6,000 in\n  P2). Spark pushes the `IS NOT NULL` checks down into the CSV reader, so rows\n  with an empty `event_time` or `user_id` are dropped before they are counted.\n\n## Settings to use\n\n| Situation | Trigger | `MAX_FILES` |\n|---|---|---|\n| Functional tests (one file = one batch, easy to follow) | 5 s | 1 |\n| ~50 rows/s, low latency | 5 s | 5 |\n| ~1,000 rows/s | 10 s | 10 or more |\n","postgres_connection_details.txt":"PostgreSQL connection details: real-time event ingestion lab\n================================================================\n\nHost:      localhost\nPort:      5432\nDatabase:  ecommerce\nUser:      spark_app        (login role created by postgres_setup.sql; may only\n                             SELECT/INSERT on events and SELECT/INSERT/TRUNCATE\n                             on events_staging)\nPassword:  not stored in this file. It is chosen when postgres_setup.sql is run\n           (psql -v app_password='...') and kept in .env as PGPASSWORD, which\n           is gitignored. Ask the author for it, or run the setup script with\n           your own password.\n\nTables:    events          (final, one row per event, PK event_id)\n           events_staging  (landing table for each micro-batch, emptied after the merge)\n\nJDBC URL used by Spark:\n           jdbc:postgresql://localhost:5432/ecommerce\n           driver org.postgresql.Driver (Maven package org.postgresql:postgresql:42.7.4)\n\npsql:\n           psql -h localhost -p 5432 -U spark_app -d ecommerce\n\nThe streaming job reads all of these from environment variables\n(PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD). See .env.example.\n","src/config.py":"\"\"\"Every setting of the pipeline, read once from env vars / .env.\n\nthe generator, the streaming job, perf_report and the tests all import from\nhere so they never disagree on a folder or a table. relative folders in .env\nare taken from the lab folder, not from where i happen to run python.\n\"\"\"\nimport os\nfrom pathlib import Path\nfrom typing import Any\n\nfrom dotenv import load_dotenv\n\nROOT = Path(__file__).resolve().parents[1]\nload_dotenv(ROOT / \".env\")\n\n\ndef lab_path(value: str) -> Path:\n    \"\"\"data/incoming -> \u003clab>/data/incoming. absolute paths stay as they are.\"\"\"\n    p = Path(value)\n    return p if p.is_absolute() else ROOT / p\n\n\n# keyword arguments for psycopg2.connect(). port is an int, the rest are text.\n# the password only ever comes from the env, never from a file in the repo.\nPG: dict[str, Any] = {\n    \"host\": os.getenv(\"PGHOST\", \"localhost\"),\n    \"port\": int(os.getenv(\"PGPORT\", \"5432\")),\n    \"dbname\": os.getenv(\"PGDATABASE\", \"ecommerce\"),\n    \"user\": os.getenv(\"PGUSER\", \"spark_app\"),\n    \"password\": os.getenv(\"PGPASSWORD\", \"\"),\n}\nJDBC_URL = f\"jdbc:postgresql://{PG['host']}:{PG['port']}/{PG['dbname']}\"\nJDBC_PACKAGE = \"org.postgresql:postgresql:42.7.4\"\n\nINPUT_DIR = lab_path(os.getenv(\"INPUT_DIR\", \"data/incoming\"))\nCHECKPOINT_DIR = lab_path(os.getenv(\"CHECKPOINT_DIR\", \"checkpoint/events\"))\nMETRICS_DIR = lab_path(os.getenv(\"METRICS_DIR\", \"metrics\"))\nTRIGGER = os.getenv(\"TRIGGER\", \"5 seconds\")\nMAX_FILES = int(os.getenv(\"MAX_FILES\", \"1\"))\n","src/spark_session.py":"import logging\nimport os\nimport sys\nimport warnings\nfrom pathlib import Path\n\nfrom pyspark.sql import SparkSession\n\nfrom src.config import JDBC_PACKAGE\n\nlog = logging.getLogger(__name__)\n\n\ndef _saved_user_env(name: str) -> str | None:\n    \"\"\"Read a user env var straight from the registry (windows only).\"\"\"\n    if sys.platform != \"win32\":\n        return None\n    import winreg\n\n    try:\n        with winreg.OpenKey(winreg.HKEY_CURRENT_USER, \"Environment\") as key:\n            value, _ = winreg.QueryValueEx(key, name)\n    except OSError:\n        return None\n    return str(value)\n\n\ndef ensure_hadoop_home() -> None:\n    \"\"\"On windows, point the jvm at winutils.exe before spark starts.\n\n    the checkpoint folder is written through hadoop's file system code, which\n    needs winutils.exe + hadoop.dll on windows. setx only reaches programs\n    opened after it, so a vs code that was already open (and the jupyter\n    kernel it starts) never sees HADOOP_HOME. so: real env var first (.env is\n    loaded by src.config), then the value saved in the registry. the bin\n    folder goes on PATH too, that is where hadoop.dll is.\n    \"\"\"\n    if sys.platform != \"win32\":\n        return\n    home = os.getenv(\"HADOOP_HOME\") or _saved_user_env(\"HADOOP_HOME\")\n    if not home or not (Path(home) / \"bin\" / \"winutils.exe\").exists():\n        warnings.warn(\n            \"HADOOP_HOME is not set or has no bin\\\\winutils.exe, \"\n            \"the checkpoint writes will fail (see study/01)\",\n            stacklevel=2,\n        )\n        return\n    os.environ[\"HADOOP_HOME\"] = home\n    bin_dir = str(Path(home) / \"bin\")\n    if bin_dir.lower() not in os.environ.get(\"PATH\", \"\").lower():\n        os.environ[\"PATH\"] = bin_dir + os.pathsep + os.environ.get(\"PATH\", \"\")\n\n\ndef get_spark(app_name: str = \"ecommerce-events-to-postgres\") -> SparkSession:\n    \"\"\"Build (or reuse) the one SparkSession the job, the notebook and the tests share.\"\"\"\n    # on windows the workers can pick up a different python than the driver\n    # and then crash on import. pin both to the python running this file.\n    os.environ.setdefault(\"PYSPARK_PYTHON\", sys.executable)\n    os.environ.setdefault(\"PYSPARK_DRIVER_PYTHON\", sys.executable)\n    # has to happen before getOrCreate, the jvm copies the env when it starts\n    ensure_hadoop_home()\n    master = os.getenv(\"SPARK_MASTER\", \"local[*]\")\n    spark = (\n        SparkSession.builder\n        .appName(app_name)\n        .master(master)\n        # the postgres jdbc driver. spark pulls it from maven the first time\n        # and keeps it in ~/.ivy2, so only the first run needs internet.\n        .config(\"spark.jars.packages\", JDBC_PACKAGE)\n        # default 200 shuffle partitions is way too many for 100 row batches,\n        # dropDuplicates would run 200 tiny tasks every trigger.\n        .config(\"spark.sql.shuffle.partitions\", os.getenv(\"SPARK_SHUFFLE_PARTITIONS\", \"4\"))\n        # the generator writes utc times, so spark reads them as utc too\n        .config(\"spark.sql.session.timeZone\", \"UTC\")\n        .getOrCreate()\n    )\n    spark.sparkContext.setLogLevel(os.getenv(\"SPARK_LOG_LEVEL\", \"WARN\"))\n    log.info(\"spark %s on %s, ui at %s\", spark.version, master, spark.sparkContext.uiWebUrl)\n    return spark\n","src/data_generator.py":"\"\"\"Part 1: write csv files of fake e-commerce events into a folder, one file every few seconds.\n\n    python -m src.data_generator                          # 100 rows every 2 s, forever (ctrl+c)\n    python -m src.data_generator --rows 500 --every 1 --batches 60\n    python -m src.data_generator --bad-rate 0.2           # 20% of rows get a broken field\n\n(`python data_generator.py` does the same, the brief wants that file name.)\n\neach file is written under a temp name starting with \"_\" and then renamed.\nspark skips files whose names start with \"_\" or \".\", so it never reads a\nhalf written file. the rename is atomic: the file is there complete or not at all.\n\"\"\"\nimport argparse\nimport csv\nimport os\nimport random\nimport time\nimport uuid\nfrom datetime import datetime, timezone\nfrom pathlib import Path\nfrom typing import Any\n\nfrom src.config import INPUT_DIR\n\nFIELDS = [\"event_id\", \"event_time\", \"user_id\", \"session_id\", \"event_type\",\n          \"product_id\", \"category\", \"price\", \"quantity\"]\n\n# category -> (lowest price, highest price)\nCATEGORIES = {\"electronics\": (50, 1500), \"books\": (5, 60), \"fashion\": (10, 250),\n              \"home\": (15, 400), \"sports\": (10, 600)}\nEVENT_TYPES = [\"view\", \"add_to_cart\", \"purchase\"]\nEVENT_WEIGHTS = [75, 17, 8]          # most visits are views, few end in a purchase\nBAD_VALUES = [\"\", \"-5\", \"unknown\", \"NaN\"]\nSPOILABLE = [\"price\", \"event_type\", \"user_id\", \"event_time\"]\n\n# one csv row. values are Any because spoil() can put text where a number was\nEvent = dict[str, Any]\n\n\ndef make_event() -> Event:\n    category = random.choice(list(CATEGORIES))\n    low, high = CATEGORIES[category]\n    event_type = random.choices(EVENT_TYPES, weights=EVENT_WEIGHTS)[0]\n    return {\n        \"event_id\": str(uuid.uuid4()),\n        # utc with milliseconds, e.g. 2026-11-04 09:42:17.123\n        \"event_time\": datetime.now(timezone.utc).strftime(\"%Y-%m-%d %H:%M:%S.%f\")[:-3],\n        \"user_id\": random.randint(1, 500),\n        \"session_id\": uuid.uuid4().hex[:12],\n        \"event_type\": event_type,\n        \"product_id\": random.randint(1000, 1999),\n        \"category\": category,\n        \"price\": round(random.uniform(low, high), 2),\n        # a view buys nothing, so 0. the db allows >= 0\n        \"quantity\": 0 if event_type == \"view\" else random.randint(1, 3),\n    }\n\n\ndef spoil(event: Event) -> Event:\n    \"\"\"Break one field so the spark job's cleaning rules have something to catch.\"\"\"\n    field = random.choice(SPOILABLE)\n    event[field] = random.choice(BAD_VALUES)\n    return event\n\n\ndef write_file(out_dir: Path, rows: int, bad_rate: float) -> tuple[str, int]:\n    \"\"\"Write one csv of `rows` events, about bad_rate of them spoiled. returns (name, spoiled).\"\"\"\n    events = [make_event() for _ in range(rows)]\n    bad = 0\n    for e in events:\n        if random.random() \u003c bad_rate:\n            spoil(e)\n            bad += 1\n    name = f\"events_{datetime.now():%Y%m%d_%H%M%S_%f}.csv\"\n    tmp_path = out_dir / (\"_\" + name)\n    with open(tmp_path, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.DictWriter(f, fieldnames=FIELDS)\n        writer.writeheader()\n        writer.writerows(events)\n    os.replace(tmp_path, out_dir / name)     # atomic rename\n    return name, bad\n\n\ndef main(argv: list[str] | None = None) -> None:\n    ap = argparse.ArgumentParser(description=(__doc__ or \" \").splitlines()[0])\n    ap.add_argument(\"--out\", type=Path, default=INPUT_DIR)\n    ap.add_argument(\"--rows\", type=int, default=100, help=\"rows per file\")\n    ap.add_argument(\"--every\", type=float, default=2.0, help=\"seconds between files\")\n    ap.add_argument(\"--batches\", type=int, default=0, help=\"files to write; 0 = forever\")\n    ap.add_argument(\"--bad-rate\", type=float, default=0.02, help=\"share of rows to spoil\")\n    ap.add_argument(\"--seed\", type=int, help=\"fix the random numbers, for repeatable tests\")\n    args = ap.parse_args(argv)\n    out: Path = args.out\n    rows: int = args.rows\n    batches: int = args.batches\n\n    if args.seed is not None:\n        random.seed(args.seed)\n    out.mkdir(parents=True, exist_ok=True)\n    written = 0\n    try:\n        while batches == 0 or written \u003c batches:\n            name, bad = write_file(out, rows, args.bad_rate)\n            written += 1\n            print(f\"{name}: {rows} rows ({bad} spoiled)\", flush=True)\n            time.sleep(args.every)\n    except KeyboardInterrupt:\n        pass\n    print(f\"done: {written} files, {written * rows} rows\")\n\n\nif __name__ == \"__main__\":\n    main()\n","src/cleaning.py":"\"\"\"Part 2: read the csv folder as a stream, then cast, validate and de-duplicate.\n\none function per step so the tests (and the notebook) can check each rule on\nits own. every function here also works on a normal batch DataFrame, that is\nhow the tests feed it rows without starting a stream.\n\"\"\"\nfrom pathlib import Path\n\nfrom pyspark.sql import Column, DataFrame, SparkSession\nfrom pyspark.sql import functions as F\nfrom pyspark.sql.types import StringType, StructField, StructType\n\nCOLS = [\"event_id\", \"event_time\", \"user_id\", \"session_id\", \"event_type\",\n        \"product_id\", \"category\", \"price\", \"quantity\"]\nEVENT_TYPES = [\"view\", \"add_to_cart\", \"purchase\"]\nTIME_FORMAT = \"yyyy-MM-dd HH:mm:ss.SSS\"\n\n# every column comes in as text. a bad value then turns into a null at the\n# cast step, instead of failing the whole file at read time.\nRAW_SCHEMA = StructType([StructField(c, StringType()) for c in COLS])\n\n\ndef read_stream(spark: SparkSession, input_dir: Path, max_files: int) -> DataFrame:\n    \"\"\"The source: every new csv in input_dir, at most max_files per micro-batch.\"\"\"\n    input_dir.mkdir(parents=True, exist_ok=True)   # the file source dies on a missing folder\n    return (spark.readStream\n            .schema(RAW_SCHEMA)                    # streaming sources need the schema up front\n            .option(\"header\", True)\n            .option(\"maxFilesPerTrigger\", max_files)\n            .csv(str(input_dir)))\n\n\ndef cast_types(raw: DataFrame) -> DataFrame:\n    \"\"\"Text -> real types. try_ versions give null on bad input instead of\n    killing the batch (spark 4 runs in ansi mode, a plain cast would throw).\"\"\"\n    return (raw\n        .withColumn(\"event_time\", F.expr(f\"try_to_timestamp(event_time, '{TIME_FORMAT}')\"))\n        .withColumn(\"user_id\", F.expr(\"try_cast(user_id AS INT)\"))\n        .withColumn(\"product_id\", F.expr(\"try_cast(product_id AS INT)\"))\n        .withColumn(\"price\", F.expr(\"try_cast(price AS DECIMAL(10,2))\"))\n        .withColumn(\"quantity\", F.expr(\"try_cast(quantity AS INT)\"))\n        .withColumn(\"event_type\", F.lower(F.trim(\"event_type\")))\n        .withColumn(\"category\", F.lower(F.trim(\"category\"))))\n\n\ndef is_valid() -> Column:\n    \"\"\"The same rules the events table has as CHECK constraints, checked in spark\n    first so a bad row is dropped here and never fails the merge.\"\"\"\n    return (F.col(\"event_id\").isNotNull()\n        & F.col(\"event_time\").isNotNull()\n        & (F.col(\"user_id\") > 0)            # \"> 0\" also drops null, and \"-5\" casts fine so it needs this\n        & (F.col(\"product_id\") > 0)\n        & F.col(\"event_type\").isin(EVENT_TYPES)\n        & (F.col(\"price\") >= 0)             # null price fails this too\n        & (F.col(\"quantity\").isNull() | (F.col(\"quantity\") >= 0)))\n\n\ndef drop_bad_rows(typed: DataFrame) -> DataFrame:\n    return typed.filter(is_valid())\n\n\ndef drop_duplicates(valid: DataFrame) -> DataFrame:\n    \"\"\"Same event_id seen twice within 10 minutes of event time -> keep one.\n\n    the watermark tells spark when it may forget old ids, so the dedup state\n    does not grow forever. event_time is in the key so spark can drop old state.\n    a copy that comes later than that is still caught by the primary key in\n    postgres (ON CONFLICT DO NOTHING), so this is the first line, not the only one.\n    \"\"\"\n    return (valid\n        .withWatermark(\"event_time\", \"10 minutes\")\n        .dropDuplicates([\"event_id\", \"event_time\"]))\n\n\ndef clean(raw: DataFrame) -> DataFrame:\n    \"\"\"Cast, validate and de-duplicate. rows that fail a rule are dropped.\"\"\"\n    return drop_duplicates(drop_bad_rows(cast_types(raw))).select(*COLS)\n","src/postgres_sink.py":"\"\"\"Part 3: the sink. each micro-batch goes to events_staging by jdbc, then\none sql statement merges it into events.\n\nwhy two steps: the jdbc writer can only append. if the job dies after the\nwrite but before spark marks the batch done, spark runs the batch again. a\nplain append would then add the rows twice. the merge skips ids that are\nalready in events, so running a batch twice is harmless.\n\"\"\"\nimport time\nfrom pathlib import Path\n\nimport psycopg2\nfrom pyspark.sql import DataFrame\n\nfrom src.cleaning import COLS\nfrom src.config import JDBC_URL, METRICS_DIR, PG\nfrom src.metrics import log_jsonl\n\nMERGE_SQL = f\"\"\"\n    INSERT INTO events ({\", \".join(COLS)})\n    SELECT {\", \".join(COLS)} FROM events_staging\n    ON CONFLICT (event_id) DO NOTHING\n\"\"\"\n\n\ndef truncate_staging() -> None:\n    # leftovers from a try that died half way would otherwise get merged again\n    with psycopg2.connect(**PG) as conn, conn.cursor() as cur:\n        cur.execute(\"TRUNCATE events_staging\")\n\n\ndef append_to_staging(batch_df: DataFrame) -> None:\n    (batch_df.write.format(\"jdbc\")\n        .option(\"url\", JDBC_URL)\n        .option(\"dbtable\", \"events_staging\")\n        .option(\"user\", PG[\"user\"])\n        .option(\"password\", PG[\"password\"])\n        .option(\"driver\", \"org.postgresql.Driver\")\n        .mode(\"append\")\n        .save())\n\n\ndef merge_staging() -> int:\n    \"\"\"staging -> events in one transaction. returns how many rows were new.\"\"\"\n    with psycopg2.connect(**PG) as conn, conn.cursor() as cur:\n        cur.execute(MERGE_SQL)\n        inserted = cur.rowcount\n        cur.execute(\"TRUNCATE events_staging\")\n    return inserted\n\n\ndef write_batch(batch_df: DataFrame, batch_id: int, metrics_dir: Path = METRICS_DIR) -> None:\n    \"\"\"Runs once per micro-batch, on the driver, with that batch as a normal DataFrame.\"\"\"\n    started = time.time()\n    batch_df = batch_df.select(*COLS).persist()      # used twice: count + write\n    try:\n        rows = batch_df.count()\n        if rows == 0:\n            return\n        truncate_staging()\n        append_to_staging(batch_df)\n        staged = time.time()\n        inserted = merge_staging()\n    finally:\n        batch_df.unpersist()\n\n    done = time.time()\n    log_jsonl(\"batches.jsonl\", {\n        \"batch_id\": batch_id, \"rows\": rows, \"inserted\": inserted,\n        \"skipped_duplicates\": rows - inserted,\n        \"jdbc_ms\": round((staged - started) * 1000), \"merge_ms\": round((done - staged) * 1000),\n        \"at\": time.strftime(\"%Y-%m-%dT%H:%M:%S\")}, metrics_dir)\n    print(f\"batch {batch_id}: {rows} rows, {inserted} inserted, \"\n          f\"{round(done - started, 1)} s\", flush=True)\n","src/metrics.py":"\"\"\"Per batch logs: my own numbers from write_batch and spark's progress report.\n\nboth go to metrics/*.jsonl, one json object per line, so perf_report (and\npandas, if i want) can read them back without parsing console output.\n\"\"\"\nimport json\nfrom pathlib import Path\nfrom typing import Any\n\nfrom pyspark.sql.streaming.listener import (\n    QueryIdleEvent,\n    QueryProgressEvent,\n    QueryStartedEvent,\n    QueryTerminatedEvent,\n    StreamingQueryListener,\n)\n\nfrom src.config import METRICS_DIR\n\nRecord = dict[str, Any]\n\n\ndef log_jsonl(name: str, record: Record, metrics_dir: Path = METRICS_DIR) -> None:\n    metrics_dir.mkdir(parents=True, exist_ok=True)\n    with open(metrics_dir / name, \"a\", encoding=\"utf-8\") as f:\n        f.write(json.dumps(record) + \"\\n\")\n\n\ndef progress_record(progress: Record) -> Record:\n    \"\"\"Keep the fields of spark's progress json that the performance report uses.\"\"\"\n    durations: Record = progress.get(\"durationMs\", {})\n    return {\n        \"batch_id\": progress[\"batchId\"],\n        \"timestamp\": progress[\"timestamp\"],\n        \"num_input_rows\": progress[\"numInputRows\"],\n        \"input_rows_per_s\": progress.get(\"inputRowsPerSecond\"),\n        \"processed_rows_per_s\": progress.get(\"processedRowsPerSecond\"),\n        \"trigger_ms\": durations.get(\"triggerExecution\"),\n        \"add_batch_ms\": durations.get(\"addBatch\"),\n    }\n\n\nclass ProgressLogger(StreamingQueryListener):\n    \"\"\"Saves spark's own progress report for every micro-batch (rates, durations).\"\"\"\n\n    def __init__(self, metrics_dir: Path = METRICS_DIR) -> None:\n        super().__init__()\n        self.metrics_dir = metrics_dir\n\n    def onQueryStarted(self, event: QueryStartedEvent) -> None:\n        print(f\"query started: id={event.id}\", flush=True)\n\n    def onQueryProgress(self, event: QueryProgressEvent) -> None:\n        progress: Record = json.loads(event.progress.json)\n        log_jsonl(\"progress.jsonl\", progress_record(progress), self.metrics_dir)\n\n    def onQueryIdle(self, event: QueryIdleEvent) -> None:\n        pass\n\n    def onQueryTerminated(self, event: QueryTerminatedEvent) -> None:\n        print(f\"query stopped: exception={event.exception}\", flush=True)\n","src/main.py":"\"\"\"Parts 2 and 3 glued together: watch the folder, clean each new file, write to postgres.\n\n    python -m src.main                    # run until ctrl+c\n    python -m src.main --run-seconds 120  # stop by itself (what the test runs used)\n    python -m src.main --once             # take every file waiting now, then stop\n\n(`python spark_streaming_to_postgres.py` does the same, the brief wants that name.)\n\nsettings come from .env through src.config. flow, per micro-batch:\n  new csv files -> read as strings -> cast + validate -> drop duplicates\n  -> foreachBatch: jdbc insert into events_staging -> sql merge into events\n\"\"\"\nimport argparse\nfrom functools import partial\nfrom pathlib import Path\n\nfrom pyspark.sql import SparkSession\nfrom pyspark.sql.streaming.query import StreamingQuery\n\nfrom src import cleaning, config\nfrom src.metrics import ProgressLogger\nfrom src.postgres_sink import write_batch\nfrom src.spark_session import get_spark\n\n\ndef start_query(\n    spark: SparkSession,\n    input_dir: Path = config.INPUT_DIR,\n    checkpoint_dir: Path = config.CHECKPOINT_DIR,\n    metrics_dir: Path = config.METRICS_DIR,\n    trigger: str = config.TRIGGER,\n    max_files: int = config.MAX_FILES,\n    once: bool = False,\n) -> StreamingQuery:\n    \"\"\"Start the stream and hand back the query. the caller decides when to stop it.\n\n    the folders are parameters so the notebook can run on its own folder and\n    checkpoint without touching the real ones.\n    \"\"\"\n    spark.streams.addListener(ProgressLogger(metrics_dir))\n    writer = (cleaning.clean(cleaning.read_stream(spark, input_dir, max_files))\n              .writeStream\n              .queryName(\"events_to_postgres\")\n              .foreachBatch(partial(write_batch, metrics_dir=metrics_dir))\n              # which files are done + the dedup state. delete it and every\n              # file is read again (harmless, the merge skips known ids)\n              .option(\"checkpointLocation\", str(checkpoint_dir)))\n    # availableNow: everything waiting right now, still split by\n    # maxFilesPerTrigger, then the query stops by itself\n    writer = writer.trigger(availableNow=True) if once else writer.trigger(processingTime=trigger)\n    query = writer.start()\n    mode = \"once\" if once else f\"every {trigger}\"\n    print(f\"watching {input_dir} {mode}, up to {max_files} file(s) per batch\", flush=True)\n    return query\n\n\ndef main(argv: list[str] | None = None) -> None:\n    ap = argparse.ArgumentParser(description=\"csv folder -> spark structured streaming -> postgres\")\n    ap.add_argument(\"--run-seconds\", type=int, default=0, help=\"stop after N seconds; 0 = run forever\")\n    ap.add_argument(\"--once\", action=\"store_true\", help=\"process the files waiting now, then stop\")\n    args = ap.parse_args(argv)\n    run_seconds: int = args.run_seconds\n    if not config.PG[\"password\"]:\n        print(\"note: PGPASSWORD is empty, this only works if the server trusts local logins\")\n\n    spark = get_spark()\n    try:\n        query = start_query(spark, once=args.once)\n        try:\n            if run_seconds:\n                query.awaitTermination(run_seconds)\n                query.stop()              # clean stop, finishes the batch it is on\n            else:\n                query.awaitTermination()\n        except KeyboardInterrupt:\n            query.stop()\n    finally:\n        spark.stop()                      # release the jvm even when a batch failed\n\n\nif __name__ == \"__main__\":\n    main()\n","postgres_setup.sql":"-- postgres_setup.sql: database, application role and tables for the event pipeline.\n--\n-- Run once as a superuser with psql (it uses psql features: -v variables, \\gexec, \\connect):\n--   psql -h localhost -p 5432 -U postgres -v app_password='pick-a-password' -f postgres_setup.sql\n-- Put the same password in .env as PGPASSWORD. Safe to re-run: every step checks first.\n\n\\set ON_ERROR_STOP on\n\n-- 1. Database. CREATE DATABASE has no IF NOT EXISTS, so build the command only when needed.\nSELECT 'CREATE DATABASE ecommerce'\nWHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'ecommerce')\\gexec\n\n-- 2. A login just for the pipeline, so Spark never runs as the superuser.\nSELECT format('CREATE ROLE spark_app LOGIN PASSWORD %L', :'app_password')\nWHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'spark_app')\\gexec\n\n\\connect ecommerce\n\n-- 3. The final table. One row per event.\nCREATE TABLE IF NOT EXISTS events (\n    event_id     TEXT PRIMARY KEY,           -- natural key from the generator: makes re-delivery harmless\n    event_time   TIMESTAMPTZ NOT NULL,       -- when the user acted (TIMESTAMPTZ = an absolute instant)\n    user_id      INT NOT NULL CHECK (user_id > 0),\n    session_id   TEXT,\n    event_type   TEXT NOT NULL CHECK (event_type IN ('view', 'add_to_cart', 'purchase')),\n    product_id   INT NOT NULL CHECK (product_id > 0),\n    category     TEXT,\n    price        NUMERIC(10,2) NOT NULL CHECK (price >= 0),\n    quantity     INT CHECK (quantity >= 0),\n    ingested_at  TIMESTAMPTZ NOT NULL DEFAULT now()   -- when the row landed: latency = ingested_at - event_time\n);\n\n-- 4. Landing table for each micro-batch. Same columns, no constraints, so the bulk\n--    JDBC insert never fails half way; the merge into events applies the rules.\nCREATE TABLE IF NOT EXISTS events_staging (LIKE events INCLUDING DEFAULTS EXCLUDING CONSTRAINTS);\n\n-- 5. Reports filter by time and type.\nCREATE INDEX IF NOT EXISTS idx_events_time ON events (event_time);\nCREATE INDEX IF NOT EXISTS idx_events_type ON events (event_type);\n\n-- 6. Least privilege: the pipeline may read and add events, and empty its staging table.\nGRANT CONNECT ON DATABASE ecommerce TO spark_app;\nGRANT USAGE ON SCHEMA public TO spark_app;\nGRANT SELECT, INSERT ON events TO spark_app;\nGRANT SELECT, INSERT, TRUNCATE ON events_staging TO spark_app;\n","src/perf_report.py":"\"\"\"Sum up one performance run: spark's progress log + end to end latency from postgres.\n\n    python -m src.perf_report --since 2026-11-04T10:50:00Z [--until ...] [--label \"50 rows/s\"]\n\n--since/--until are utc. reads metrics/progress.jsonl (written by the\nlistener in src.metrics) and the events table (ingested_at - event_time = latency).\n\"\"\"\nimport argparse\nimport json\nimport statistics\nfrom dataclasses import dataclass\nfrom datetime import datetime, timezone\nfrom pathlib import Path\n\nimport psycopg2\n\nfrom src.config import METRICS_DIR, PG\nfrom src.metrics import Record\n\nLATENCY_SQL = \"\"\"\n    SELECT count(*),\n           percentile_cont(0.5)  WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)),\n           percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)),\n           max(extract(epoch FROM ingested_at - event_time)),\n           count(*) / greatest(extract(epoch FROM max(ingested_at) - min(ingested_at)), 1)\n    FROM events WHERE ingested_at BETWEEN %s AND %s\"\"\"\n\n\n@dataclass\nclass SparkSummary:\n    batches: int\n    rows: int\n    mean_batch_ms: float\n    max_batch_ms: int\n    mean_rows_per_s: float\n\n\ndef parse_utc(s: str) -> datetime:\n    return datetime.fromisoformat(s.replace(\"Z\", \"+00:00\")).astimezone(timezone.utc)\n\n\ndef load_progress(path: Path, since: datetime, until: datetime) -> list[Record]:\n    \"\"\"Non-empty batches whose spark timestamp is inside [since, until].\"\"\"\n    batches: list[Record] = []\n    with open(path, encoding=\"utf-8\") as f:\n        for line in f:\n            p: Record = json.loads(line)\n            if p[\"num_input_rows\"] and since \u003c= parse_utc(p[\"timestamp\"]) \u003c= until:\n                batches.append(p)\n    return batches\n\n\ndef summarise(batches: list[Record]) -> SparkSummary:\n    if not batches:\n        raise ValueError(\"no non-empty batches in that window\")\n    trig: list[int] = [b[\"trigger_ms\"] for b in batches]\n    proc: list[float] = [b[\"processed_rows_per_s\"] for b in batches if b[\"processed_rows_per_s\"]]\n    return SparkSummary(\n        batches=len(batches),\n        rows=sum(b[\"num_input_rows\"] for b in batches),\n        mean_batch_ms=statistics.mean(trig),\n        max_batch_ms=max(trig),\n        mean_rows_per_s=statistics.mean(proc) if proc else 0.0,\n    )\n\n\ndef main(argv: list[str] | None = None) -> None:\n    ap = argparse.ArgumentParser(description=\"latency + throughput summary of one run\")\n    ap.add_argument(\"--since\", required=True)\n    ap.add_argument(\"--until\", default=datetime.now(timezone.utc).isoformat())\n    ap.add_argument(\"--label\", default=\"\")\n    args = ap.parse_args(argv)\n    since, until = parse_utc(args.since), parse_utc(args.until)\n\n    try:\n        spark_side = summarise(load_progress(METRICS_DIR / \"progress.jsonl\", since, until))\n    except ValueError as e:\n        raise SystemExit(str(e)) from e\n\n    conn = psycopg2.connect(**PG)\n    try:\n        with conn, conn.cursor() as cur:\n            cur.execute(LATENCY_SQL, (since, until))\n            row = cur.fetchone()\n    finally:\n        conn.close()\n    if row is None:  # an aggregate with no GROUP BY always gives a row, this is for pyright\n        raise SystemExit(\"no result from the latency query\")\n    n, p50, p95, worst, rate = row\n\n    print(f\"run: {args.label}\")\n    print(f\"  micro-batches with data : {spark_side.batches}\")\n    print(f\"  rows read by Spark      : {spark_side.rows}\")\n    print(f\"  batch duration (ms)     : mean {spark_side.mean_batch_ms:.0f}, max {spark_side.max_batch_ms}\")\n    print(f\"  processed rows/s (Spark): mean {spark_side.mean_rows_per_s:.0f}\")\n    print(f\"  rows landed in Postgres : {n}  ({float(rate):.1f} rows/s)\")\n    print(f\"  latency p50 / p95 / max : {p50:.1f} s / {p95:.1f} s / {float(worst):.1f} s\")\n\n\nif __name__ == \"__main__\":\n    main()\n","src/diagram.py":"\"\"\"Draw reports/system_architecture.png (the diagram deliverable) with matplotlib.\n\n    python -m src.diagram\n\"\"\"\nfrom pathlib import Path\n\nimport matplotlib\n\nmatplotlib.use(\"Agg\")\nimport matplotlib.pyplot as plt\nfrom matplotlib.patches import FancyArrowPatch, FancyBboxPatch\n\nfrom src.config import ROOT\n\nOUT = ROOT / \"reports\" / \"system_architecture.png\"\n\n# name: (x, y, w, h, title, detail, colour)\nBox = tuple[float, float, float, float, str, str, str]\nBOXES: dict[str, Box] = {\n    \"gen\": (0.2, 3.2, 2.6, 1.5, \"src/data_generator.py\",\n            \"fake events, 1 CSV every N s\\nwrites _tmp then renames\", \"#dbeafe\"),\n    \"dir\": (3.6, 3.2, 2.4, 1.5, \"data/incoming/\",\n            \"events_*.csv\\n(the stream source)\", \"#fef3c7\"),\n    \"spark\": (6.8, 2.2, 3.6, 3.5, \"Spark Structured Streaming\",\n              \"readStream.csv (schema, maxFilesPerTrigger)\\n\"\n              \"try_cast + validate\\nwatermark + dropDuplicates\\nforeachBatch(write_batch)\",\n              \"#dcfce7\"),\n    \"ckpt\": (6.8, 0.2, 3.6, 1.3, \"checkpoint/events/\",\n             \"offsets: files per batch\\ncommits + dedup state\", \"#f3f4f6\"),\n    \"stage\": (11.2, 3.9, 2.9, 1.3, \"events_staging\",\n              \"JDBC bulk append\", \"#fce7f3\"),\n    \"events\": (11.2, 1.7, 2.9, 1.5, \"events\",\n               \"INSERT ... ON CONFLICT\\n(event_id) DO NOTHING\", \"#fce7f3\"),\n    \"metrics\": (11.2, 0.0, 2.9, 1.1, \"metrics/*.jsonl\",\n                \"listener + per-batch log\", \"#f3f4f6\"),\n}\nARROWS = [(\"gen\", \"dir\", \"CSV files\"), (\"dir\", \"spark\", \"new files\"),\n          (\"spark\", \"stage\", \"1. append\"), (\"stage\", \"events\", \"2. merge (SQL)\"),\n          (\"spark\", \"ckpt\", \"progress\"), (\"spark\", \"metrics\", \"\")]\nSIDES = {(\"gen\", \"dir\"): (\"r\", \"l\"), (\"dir\", \"spark\"): (\"r\", \"l\"), (\"spark\", \"stage\"): (\"r\", \"l\"),\n         (\"stage\", \"events\"): (\"b\", \"t\"), (\"spark\", \"ckpt\"): (\"b\", \"t\"),\n         (\"spark\", \"metrics\"): (\"r\", \"l\")}\n\n\ndef centre(name: str, side: str) -> tuple[float, float]:\n    x, y, w, h = BOXES[name][:4]\n    return {\"r\": (x + w, y + h / 2), \"l\": (x, y + h / 2), \"b\": (x + w / 2, y),\n            \"t\": (x + w / 2, y + h)}[side]\n\n\ndef draw(out: Path = OUT) -> Path:\n    fig, ax = plt.subplots(figsize=(14.5, 6.2))\n    ax.set_xlim(0, 14.4)\n    ax.set_ylim(-0.3, 6.4)\n    ax.axis(\"off\")\n    ax.add_patch(FancyBboxPatch((11.0, 1.5), 3.3, 3.9, boxstyle=\"round,pad=0.05\", fill=False,\n                                ls=\"--\", ec=\"#9ca3af\"))\n    ax.text(12.65, 5.55, \"PostgreSQL (ecommerce)\", ha=\"center\", fontsize=10, color=\"#4b5563\")\n    for x, y, w, h, title, detail, colour in BOXES.values():\n        ax.add_patch(FancyBboxPatch((x, y), w, h, boxstyle=\"round,pad=0.05\", fc=colour, ec=\"#374151\"))\n        ax.text(x + w / 2, y + h - 0.3, title, ha=\"center\", va=\"top\", fontsize=10, weight=\"bold\")\n        ax.text(x + w / 2, y + h - 0.65, detail, ha=\"center\", va=\"top\", fontsize=8.5)\n    for a, b, label in ARROWS:\n        sa, sb = SIDES[(a, b)]\n        p, q = centre(a, sa), centre(b, sb)\n        if (a, b) == (\"spark\", \"metrics\"):\n            p = (p[0], 2.6)\n        ax.add_patch(FancyArrowPatch(p, q, arrowstyle=\"-|>\", mutation_scale=14, color=\"#374151\"))\n        if label:\n            ax.text((p[0] + q[0]) / 2, (p[1] + q[1]) / 2 + 0.15, label, ha=\"center\", fontsize=8.5,\n                    color=\"#1f2937\")\n    ax.set_title(\"Real-time e-commerce event ingestion: CSV files -> Spark Structured Streaming -> PostgreSQL\",\n                 fontsize=12)\n    fig.tight_layout()\n    out.parent.mkdir(parents=True, exist_ok=True)\n    fig.savefig(out, dpi=130)\n    plt.close(fig)\n    return out\n\n\nif __name__ == \"__main__\":\n    print(f\"wrote {draw()}\")\n","tests/test_cleaning.py":"from datetime import datetime\nfrom decimal import Decimal\n\nimport pytest\nfrom pyspark.sql import SparkSession\n\nfrom src import cleaning\nfrom tests.helpers import cleaned, first, raw_df, raw_row\n\n\ndef test_good_row_survives_with_real_types(spark: SparkSession) -> None:\n    df = cleaned(spark, raw_row())\n    r = first(df)\n    assert isinstance(r[\"event_time\"], datetime)\n    # collect() turns a timestamp into my laptop's local time, so check the\n    # value in spark, where the session time zone is utc like the generator\n    shown = first(df.selectExpr(\"date_fo     "</ul></div>"
  ).join("");
  return "<h1>Real-Time Data Ingestion</h1><p>Study guide and code browser for DEM05 Lab 2: CSV events \u2192 Spark Structured Streaming \u2192 PostgreSQL. Written for someone who has never used Spark or streaming. Every number comes from real test runs.</p>" +
    '<div class="grid">' + cards + "</div>" +
    "<h2>Suggested reading order</h2><p><strong>01 Setup</strong> \u2192 <strong>02 Batch vs streaming</strong> \u2192 build the lab with <strong>03\u201305</strong> \u2192 understand why it is safe with <strong>06</strong> \u2192 <strong>07 Testing</strong> \u2192 <strong>08 Performance</strong>. Before the review: <strong>09</strong> \u2192 <strong>10</strong> \u2192 <strong>11</strong> \u2192 <strong>13 Runbook</strong>. <strong>12</strong> is an A\u2013Z lookup of every streaming and SQL keyword in the code.</p>" +
    pager(FLAT[0].path);
}
function fileProtocolWarning() {
  return '<div class="card warn"><h3>This page needs to be served over HTTP</h3>' +
    "<p>You opened <code>index.html</code> directly from disk, and browsers block reading the .md files from a <code>file://</code> page. From inside the <code>study/</code> folder run:</p>" +
    '<pre class="code"><code>node serve.js\n# then open http://localhost:8080</code></pre>' +
    "<p>The zero-dependency server always maps to the repository root, so all docs, deliverables and SQL resolve.</p></div>";
}
function splitHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#\//, ""));
  const i = raw.indexOf("#");
  return i < 0 ? { path: raw, anchor: "" } : { path: raw.slice(0, i), anchor: raw.slice(i + 1) };
}
function tocHtml() {
  const hs = [...content.querySelectorAll("article h2, article h3")];
  if (hs.filter(h => h.tagName === "H2").length < 3) return;
  let items = "", open = false;
  for (const h of hs) {
    const link = '<a href="#' + h.id + '">' + h.textContent + "</a>";
    if (h.tagName === "H2") { items += (open ? "</ul></li>" : "") + "<li>" + link + "<ul>"; open = true; }
    else if (open) items += "<li>" + link + "</li>";
  }
  if (open) items += "</ul></li>";
  const h1 = content.querySelector("h1");
  const box = '<details class="toc" open><summary>On this page</summary><ul class="toc-l">' + items + "</ul></details>";
  if (h1) h1.insertAdjacentHTML("afterend", box); else content.insertAdjacentHTML("afterbegin", box);
}
function explainedHtml(path) {
  const ex = EXPLAINED[path];
  if (!ex) return "";
  return '<div class="explained"><b>Explained in:</b> ' +
    ex.map(([href, label]) => '<a href="#/' + href + '">' + label + "</a>").join("") + "</div>";
}
function scrollToAnchor(anchor, smooth) {
  const el = anchor && (document.getElementById(anchor) || document.getElementById("h-" + anchor));
  const behavior = smooth ? "smooth" : "instant";
  if (el) el.scrollIntoView({ behavior }); else window.scrollTo({ top: 0, behavior });
}
let shownPath = null;
async function show(path, anchor) {
  if (path === shownPath) { scrollToAnchor(anchor, true); return; }
  shownPath = path;
  renderSidebar(path);
  document.getElementById("content").innerHTML = fileHint(path) + "Loading…";
  try {
    const raw = await loadFile(path);
    const html = path.endsWith(".md")
      ? renderMarkdown(raw)
      : '<pre class="code"><code>' + (path.endsWith(".sql") ? highlightSql(raw) : escapeHtml(raw)) + "</code></pre>";
    content.innerHTML = fileHint(path) + explainedHtml(path) + html + pager(path);
    if (path.endsWith(".md")) tocHtml();
  } catch (err) {
    content.innerHTML = fileHint(path) +
      '<div class="card"><h3>Could not load <code>' + escapeHtml(path) + "</code></h3><p>" +
      escapeHtml(err.message) + " — the file may not exist yet.</p></div>" +
      (location.protocol === "file:" && !EMBEDDED ? fileProtocolWarning() : "") + pager(path);
  }
  scrollToAnchor(anchor);
  document.body.classList.remove("nav-open");
}
window.addEventListener("hashchange", () => {
  const { path, anchor } = splitHash();
  if (path) show(path, anchor);
  else { shownPath = null; content.innerHTML = welcomeHtml(); renderSidebar(""); }
});
/* internal md/sql links navigate in-app */
content.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href");
  if (!href || /^https?:|^#\//.test(href)) return;
  if (/^#(?!\/)/.test(href)) {                 // same-page section link
    e.preventDefault();
    history.replaceState(null, "", "#/" + currentPath() + href);
    scrollToAnchor(href.slice(1), true);
    return;
  }
  const m = href.match(/^([^#]+\.(?:md|sql|txt|py|example))(#.*)?$/);
  if (m) {
    e.preventDefault();
    location.hash = "/" + resolvePath(currentPath(), m[1]) + (m[2] || "");
  }
});
function currentPath() { return splitHash().path || "README.md"; }

/* ================= full-text search ================= */
const searchEl = document.getElementById("search");
let searchTimer = null;
function titleOf(path) { const it = FLAT.find(x => x.path === path); return it ? it.title : path; }
function anchorId(text) { return "h-" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function markHit(line, q) {
  const i = line.toLowerCase().indexOf(q);
  const start = Math.max(0, i - 60), s = line.slice(start, i + q.length + 80);
  const j = i - start;
  return (start > 0 ? "…" : "") + escapeHtml(s.slice(0, j)) + "<mark>" + escapeHtml(s.slice(j, j + q.length)) + "</mark>" + escapeHtml(s.slice(j + q.length));
}
async function runSearch(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) { const { path, anchor } = splitHash(); shownPath = null; path ? show(path, anchor) : (content.innerHTML = welcomeHtml()); return; }
  const hits = [];
  for (const it of FLAT) {
    let raw;
    try { raw = await loadFile(it.path); } catch { continue; }
    let sec = "", secId = "", n = 0;
    for (const line of raw.split(/\r?\n/)) {
      const h = it.path.endsWith(".md") && line.match(/^#{1,6}\s+(.*)/);
      if (h) { sec = h[1]; secId = anchorId(h[1]); }
      if (line.toLowerCase().includes(q)) {
        hits.push({ path: it.path, sec, secId, line: line.trim() });
        if (++n >= 6) break;
      }
    }
  }
  shownPath = null;
  content.innerHTML = "<h1>Search: " + escapeHtml(q) + "</h1><p>" + hits.length + " match" + (hits.length === 1 ? "" : "es") +
    " (up to 6 per page). Press Esc to clear.</p>" +
    hits.slice(0, 150).map(h => '<div class="hit"><a class="doc" href="#/' + h.path + (h.secId ? "#" + h.secId : "") + '">' + titleOf(h.path) + "</a>" +
      (h.sec ? '<div class="sec">§ ' + escapeHtml(h.sec) + "</div>" : "") + '<div class="line">' + markHit(h.line, q) + "</div></div>").join("");
  window.scrollTo(0, 0);
}
searchEl.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => runSearch(searchEl.value), 200); });
searchEl.addEventListener("keydown", e => { if (e.key === "Escape") { searchEl.value = ""; runSearch(""); } });
content.addEventListener("click", e => { if (e.target.closest(".hit a")) searchEl.value = ""; });
/* theme + menu */
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("hc-theme", next); } catch {}
};
try { const t = localStorage.getItem("hc-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
document.getElementById("menuBtn").onclick = () => document.body.classList.toggle("nav-open");

/* boot */
const boot = splitHash();
if (boot.path) show(boot.path, boot.anchor); else { content.innerHTML = welcomeHtml(); renderSidebar(""); }
if (location.protocol === "file:" && !EMBEDDED) content.insertAdjacentHTML("afterbegin", fileProtocolWarning());
</script>
</body>
