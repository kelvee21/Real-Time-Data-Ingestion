<!--EMBED_START--><script id="embedded-data" type="application/json">{"README.md":"# real-time data ingestion: spark structured streaming -> postgres\n\nDEM05 lab 2. a script writes fake e-commerce events (views, add to cart,\npurchases) as csv files into a folder. spark structured streaming picks up\neach new file, cleans and de-duplicates the rows and loads them into\npostgres. each micro-batch is written so that running it twice never adds a\nrow twice. same repo layout as lab 1 (and my pandas tmdb lab): code in\n`src/`, tests in `tests/`, write-ups in `reports/`.\n\n- lab brief: [Real-Time-Data-Ingestion-II.md](Real-Time-Data-Ingestion-II.md)\n- study notes: [study/](study/), open `study/index.html` in a browser\n\n## run\n\nneeds java 17, python 3.10+ and postgres. on windows also winutils.exe with\nHADOOP_HOME set, spark writes its checkpoint through hadoop code (see\n[study/01-setup-postgres-and-spark.md](study/01-setup-postgres-and-spark.md)).\n\n```\npip install -r requirements.txt\npsql -U postgres -v app_password='choose-one' -f postgres_setup.sql\ncopy .env.example .env                 # PGPASSWORD = the same password\npytest\npyright\npython spark_streaming_to_postgres.py  # terminal 1, same as python -m src.main\npython data_generator.py               # terminal 2, same as python -m src.data_generator\n```\n\n`python -m src.main --once` takes every file waiting in the folder and stops,\n`--run-seconds 120` stops after two minutes (that is how the test runs were\ndone). full steps, checks and reset: [reports/user_guide.md](reports/user_guide.md).\n\n`pytest` needs spark but not postgres. 42 tests on fake rows: the generator,\nevery cleaning rule, the merge sql, the metrics and the perf report maths.\nwriting to the real db is tested by the end to end runs in\n[reports/test_cases.md](reports/test_cases.md), because `spark_app` may not\ndelete, so a test row would stay in `events` for good.\n\n`pyright` is the type check. every function has type hints and\n`pyrightconfig.json` puts it in strict mode, so vscode shows real types\ninstead of Unknown. it should say 0 errors.\n\nopen analysis.ipynb and run it top to bottom. it calls the same functions as\n`src.main`, one step per section, on its own folder (`data/notebook/`). if\npostgres is down it says so and skips only the write section.\n\n## deliverables\n\nthe brief names nine files. the two scripts it names are kept in the root\nbut only call into `src/`, so `python data_generator.py` still works.\n\n| deliverable | file |\n|---|---|\n| data generator | [data_generator.py](data_generator.py) -> [src/data_generator.py](src/data_generator.py) |\n| streaming job | [spark_streaming_to_postgres.py](spark_streaming_to_postgres.py) -> [src/main.py](src/main.py) |\n| database setup | [postgres_setup.sql](postgres_setup.sql) |\n| connection details | [postgres_connection_details.txt](postgres_connection_details.txt) |\n| project overview | [reports/project_overview.md](reports/project_overview.md) |\n| user guide | [reports/user_guide.md](reports/user_guide.md) |\n| test cases | [reports/test_cases.md](reports/test_cases.md): 9 tests, all run, TC-04 found and fixed a real bug |\n| performance metrics | [reports/performance_metrics.md](reports/performance_metrics.md): 3 measured load settings |\n| architecture diagram | [reports/system_architecture.png](reports/system_architecture.png), drawn by `python -m src.diagram` |\n\n## files\n\n- src/ - all source lives here\n- src/config.py - every setting from env vars / .env, folders resolved from the lab root\n- src/spark_session.py - the one SparkSession everything uses (jdbc driver, utc, few shuffle partitions)\n- src/data_generator.py - part 1: fake events, one csv every few seconds, some rows spoiled on purpose\n- src/cleaning.py - part 2: raw schema, read_stream, cast_types, drop_bad_rows, drop_duplicates\n- src/postgres_sink.py - part 3: jdbc into events_staging, then one merge into events\n- src/metrics.py - per batch log + spark's progress listener, both to metrics/*.jsonl\n- src/main.py - glue: starts the query, --once / --run-seconds\n- src/perf_report.py - latency + throughput summary of one run (`python -m src.perf_report --since ...`)\n- src/diagram.py - draws reports/system_architecture.png\n- tests/ - 42 pytest tests on fake rows, no postgres needed\n- data_generator.py, spark_streaming_to_postgres.py - the file names the brief asks for\n- postgres_setup.sql - database, role, tables, grants (run once with psql)\n- pyrightconfig.json - strict type check settings, vscode / pylance read it too\n- data/ - incoming csv files (not committed, see data/README.md)\n- checkpoint/ - spark's memory of which files are done (not committed)\n- metrics/ - batches.jsonl and progress.jsonl, written by the job\n- reports/ - the write-ups, the diagram, and logs/ with the console output of every test and performance run\n- study/ - my study notes for this lab\n- analysis.ipynb - all steps, runs top to bottom\n\n## streaming choices\n\n- **schema up front, everything as text.** a streaming source can not infer\n  a schema, and reading text means a bad value becomes a null at the cast\n  instead of failing the whole file.\n- **try_cast / try_to_timestamp.** spark 4 runs in ansi mode, a plain cast\n  of `\"unknown\"` would kill the batch.\n- **the db rules checked in spark first.** `is_valid()` repeats the CHECK\n  constraints of `events`, so a bad row is dropped in spark and the merge\n  never fails on it.\n- **watermark + dropDuplicates.** same event_id within 10 minutes is kept\n  once, and the watermark lets spark forget old ids so the state stays small.\n- **staging table + `ON CONFLICT DO NOTHING`.** jdbc can only append. if a\n  batch is replayed after a crash the merge skips ids already there, so the\n  sink is idempotent and the pipeline is effectively exactly once.\n- **checkpoint.** which files are done + the dedup state survive a restart.\n- **maxFilesPerTrigger.** caps how much one micro-batch takes, so a backlog\n  is worked off in steady batches instead of one huge one.\n- **atomic rename in the generator.** spark never sees half a file.\n- **config from env.** password, folders, trigger and spark settings come\n  from .env, nothing secret in code.\n- **spark.stop() in finally.** the jvm is released even when a batch fails.\n","Real-Time-Data-Ingestion-II.md":"# Real-Time Data Ingestion Using Spark Structured Streaming & PostgreSQL\n\n## Project Overview\n\nIn this project, you'll build a real-time data pipeline that simulates an e-commerce platform tracking user activity. You'll generate fake user events (like product views and purchases), stream them using Apache Spark Structured Streaming, and store the processed data in a PostgreSQL database.\n\nYou'll gain practical experience with:\n\n- Real-time data streaming\n- Data transformation using Spark\n- Writing to a relational database\n- Handling continuously arriving data\n\n---\n\n## Project Objectives\n\nBy the end of this project, you will be able to:\n\n- Simulate and ingest streaming data\n- Use Spark Structured Streaming to process data in real time\n- Store and verify processed data in a PostgreSQL database\n- Understand the architecture of a real-time data pipeline\n- Measure and evaluate system performance\n\n---\n\n## Tools & Technologies\n\n- Apache Spark Structured Streaming\n- PostgreSQL\n- Python (for data generation)\n- SQL (for database setup)\n\n---\n\n## Project Structure\n\n### Part 1: Simulate Data\n\n- Write a script that creates fake e-commerce events (CSV files).\n- These events include user actions like `\"view\"` or `\"purchase\"`, along with product info and timestamps.\n\n### Part 2: Stream with Spark\n\n- Use Spark Structured Streaming to monitor the folder where CSVs are saved.\n- Read and process new CSV files as they appear.\n- Apply any needed transformations (e.g., data cleaning, type conversion).\n\n### Part 3: Store in PostgreSQL\n\n- Set up a PostgreSQL database and create a table to store incoming events.\n- Connect Spark to the database.\n- Insert processed data into the table in real time.\n\n---\n\n## Project Deliverables\n\n| Deliverable | Description |\n|---|---|\n| `data_generator.py` | Python script to generate CSV event data |\n| `spark_streaming_to_postgres.py` | Spark Structured Streaming job to process and write data |\n| `postgres_setup.sql` | SQL script to create database and table |\n| `postgres_connection_details.txt` | Text file with host, port, user, and password |\n| `project_overview.md` | Short write-up explaining your system's components and flow |\n| `user_guide.md` | Step-by-step instructions on how to run your project |\n| `test_cases.md` | Manual test plan with expected vs actual outcomes |\n| `performance_metrics.md` | Report with system performance data (latency, throughput, etc.) |\n| `system_architecture.png` | Diagram showing data flow and components |\n\n---\n\n## What to Test\n\n- Are the CSV files being generated correctly?\n- Is Spark detecting and processing new files?\n- Are the data transformations correct?\n- Is data being written into PostgreSQL without errors?\n- Are performance metrics (like processing speed) within expected limits?\n","study/01-setup-postgres-and-spark.md":"# 01 — Setup: PostgreSQL, Spark and Everything Between\n\nWhat has to be installed and running before the pipeline works, how to check\neach piece, how to reset to a clean slate, and what the real errors from this\nlab mean.\n\n> **Help:** if you have never seen streaming before, read [02 · Batch vs streaming](02-batch-vs-streaming.md) next. This page is only about getting the machine ready.\n\n## The pieces and what each one does\n\nThe pipeline has three programs and one folder between them:\n\n```\ndata_generator.py ──CSV files──> data/incoming/ ──> spark_streaming_to_postgres.py ──> PostgreSQL (ecommerce)\n                                                         │\n                                                         └──> checkpoint/events/  (Spark's memory)\n```\n\n| Piece | What it is | Why this lab needs it |\n|---|---|---|\n| **Python 3.13** | the language both scripts are written in | runs the generator and drives Spark |\n| **Java 17** | the runtime Spark itself is written for (Spark runs on the JVM, the Java Virtual Machine) | PySpark is only a Python remote control; the real engine is a Java process |\n| **PySpark 4.3** | the Python package for Apache Spark, an engine that processes data in parallel | reads the CSV files as a stream, cleans them, hands each batch to our write code |\n| **`local[*]`** | Spark's \"run everything on this one machine, one worker thread per CPU core\" mode | no cluster needed for the lab |\n| **winutils + `HADOOP_HOME`** | two small Windows helper files from the Hadoop project | Spark writes its checkpoint through Hadoop's file-system code, which needs them on Windows |\n| **PostgreSQL 18** | a relational database server, here a Windows service on `localhost:5432` | the place the cleaned events end up |\n| **psql** | PostgreSQL's command-line client | runs `postgres_setup.sql` and lets you check results |\n| **JDBC driver** `org.postgresql:postgresql:42.7.4` | a Java library that lets a Java program (Spark) talk to PostgreSQL | Spark's bulk write into the staging table |\n| **psycopg2** | a Python library that talks to PostgreSQL | the small SQL steps after each batch (truncate, merge) |\n| **python-dotenv** | reads a `.env` file into environment variables | keeps the password out of the code |\n\n## 1. Java 17\n\nSpark 4 needs Java 17 or newer. Check what you have:\n\n```powershell\njava -version\necho $env:JAVA_HOME\n```\n\nYou want a line like `openjdk version \"17...\"`. If `java` is not found,\ninstall a JDK 17 (for example Eclipse Temurin), set `JAVA_HOME` to its folder\nand open a **new** terminal.\n\n## 2. Python packages\n\n```powershell\npip install -r requirements.txt\n```\n\n`requirements.txt` holds four packages, each with a comment saying why:\n\n```text\npyspark>=3.5            # tested with 4.3 on Python 3.13; needs Java 17\npsycopg2-binary>=2.9    # the merge step (staging -> events) after each micro-batch\npython-dotenv>=1.0      # reads connection settings from .env\nmatplotlib>=3.8         # only for src/diagram.py\n```\n\nCheck that PySpark imports and which version you got:\n\n```powershell\npython -c \"import pyspark; print(pyspark.__version__)\"\n```\n\nOn PySpark 4 a FutureWarning about pandas 3 appears at start-up in every log\n(`PySpark does not yet fully support pandas >= 3.0.0`). The job does not use\npandas, so it is harmless.\n\n## 3. winutils and HADOOP_HOME (Windows only)\n\n**Why.** Spark saves its progress (the *checkpoint*, see\n[06](06-reliability-checkpoints-exactly-once.md)) through Hadoop's local\nfile-system code. On Windows that code calls two native helpers,\n`winutils.exe` and `hadoop.dll`. Without them, writes fail with\n`UnsatisfiedLinkError ... NativeIO$Windows`. With `spark.jars.packages` set,\nthe session may not even start.\n\n**Steps** (done once):\n\n1. Get `winutils.exe` and `hadoop.dll` (the `cdarlint/winutils` repo, folder\n   `hadoop-3.3.6/bin`) and put them in `C:\\Users\\User\\hadoop\\bin`.\n2. Set the variables for your user:\n\n```powershell\n[Environment]::SetEnvironmentVariable('HADOOP_HOME', \"$env:USERPROFILE\\hadoop\", 'User')\n[Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path','User') + \";$env:USERPROFILE\\hadoop\\bin\", 'User')\n```\n\n3. Open a **new** terminal (or restart VS Code) and check:\n\n```powershell\necho $env:HADOOP_HOME          # C:\\Users\\User\\hadoop\nTest-Path \"$env:HADOOP_HOME\\bin\\winutils.exe\"   # True\n```\n\n## 4. PostgreSQL and psql\n\nPostgreSQL 18 runs as a **Windows service**, so it starts with the machine.\nCheck it is up:\n\n```powershell\nGet-Service postgresql*                      # Status should be Running\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -p 5432 -U postgres -c \"SELECT version();\"\n```\n\n`psql` is usually not on the PATH, so this page always uses the full path.\nIn PowerShell the `&` in front is the *call operator*: it runs a program whose\npath is in quotes. In Git Bash the same command is\n`\"/c/Program Files/PostgreSQL/18/bin/psql.exe\" ...`.\n\n## 5. Create the database, role and tables\n\nRun `postgres_setup.sql` once, as the superuser `postgres`:\n\n```powershell\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -p 5432 -U postgres `\n    -v app_password='pick-a-password' -f postgres_setup.sql\n```\n\n| Flag | Meaning |\n|---|---|\n| `-h localhost -p 5432` | which server: host and port |\n| `-U postgres` | log in as the superuser (only a superuser may create a database and a role) |\n| `-v app_password='...'` | define a **psql variable** named `app_password`. Inside the script, `:'app_password'` is replaced by that value, already wrapped in single quotes as a SQL string |\n| `-f postgres_setup.sql` | run the file |\n\nSo the password is typed once on the command line and never stored in the\nrepository. The script uses it to create the login role `spark_app` (the\nuser Spark connects as). It creates database `ecommerce`, tables `events` and\n`events_staging`, two indexes, and the grants. It is **safe to re-run**: every\nstep checks first. Every line is explained in\n[05 · PostgreSQL, JDBC and the merge](05-postgres-jdbc-and-the-merge.md#h-2-creating-the-database-the-gexec-trick).\n\nCheck it worked:\n\n```powershell\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -U spark_app -d ecommerce -c \"\\dt\"\n```\n\nYou should see `events` and `events_staging`, owned by `postgres`.\n\n## 6. Create .env from .env.example\n\nThe code reads its settings from environment variables. `python-dotenv` loads\nthem from a file called `.env`. The repository ships a template:\n\n```text\n# Copy to .env and fill in. .env is gitignored, never commit it.\nPGHOST=localhost\nPGPORT=5432\nPGDATABASE=ecommerce\nPGUSER=spark_app\nPGPASSWORD=\n\n# Streaming job knobs (see reports/performance_metrics.md)\nINPUT_DIR=data/incoming\nCHECKPOINT_DIR=checkpoint/events\nTRIGGER=5 seconds\nMAX_FILES=1\n```\n\n```powershell\nCopy-Item .env.example .env\nnotepad .env        # put the same password you gave -v app_password after PGPASSWORD=\n```\n\n`.gitignore` lists `.env` on its first line, so git never picks it up. It also\nignores `data/`, `checkpoint/`, `metrics/*.jsonl` and `reports/logs/`: those are\nproduced by running the pipeline, not source code.\n\nIf `PGPASSWORD` is empty, the job prints\n`note: PGPASSWORD is empty; this only works if the server trusts local logins`\nand carries on. It will fail at the first batch unless the server allows\npassword-less local logins.\n\n## 7. First run\n\nAlways run from the project folder: `INPUT_DIR` and `CHECKPOINT_DIR` are\nrelative paths. Two terminals:\n\n```powershell\n# terminal 1: the streaming job\npython spark_streaming_to_postgres.py\n\n# terminal 2: the generator (20 files of 100 rows, one every 2 s)\npython data_generator.py --rows 100 --every 2 --batches 20\n```\n\nWhat to expect in terminal 1:\n\n1. **The JDBC driver download.** The first time ever, `spark.jars.packages`\n   fetches `org.postgresql:postgresql:42.7.4` (and its one dependency\n   `checker-qual`) from Maven Central. This needs internet **once**. After\n   that it comes from the local Ivy cache (on this machine\n   `C:\\Users\\User\\.ivy2.5.2\\jars`) and the log says\n   `0 artifacts copied, 2 already retrieved`.\n2. **Start-up takes about 25–30 seconds.** The JVM starts, the driver jar\n   loads, Spark plans the query.\n3. Two harmless warnings:\n   `spark.sql.adaptive.enabled is not supported in streaming DataFrames/Datasets and will be disabled`\n   and `Disabling AQE since AQE is not supported in stateful workloads`.\n   AQE (Adaptive Query Execution) re-plans batch queries while they run;\n   Spark turns it off for streaming queries that keep state, such as our\n   de-duplication. Nothing to fix.\n4. `query started: id=...`, then\n   `watching data/incoming every 5 seconds, up to 1 file(s) per batch`.\n5. One line per batch, for example `batch 0: 87 rows, 87 inserted, 5.9 s`.\n   The first batch is slow (6–12 s) because Spark compiles the query and\n   opens connections; later ones take about 1.2 s.\n\nStop with **Ctrl+C**. On Windows the shutdown always prints an ERROR like\n`Exception while deleting Spark temp dir ... Failed to delete: ...\\org.postgresql_postgresql-42.7.4.jar`.\nWindows will not delete a jar file the JVM still has open. It is harmless:\nthe data is already saved.\n\n## Reset to a clean slate\n\nUse this before a test that needs empty starting conditions (most of\n[07](07-testing-the-pipeline.md) does).\n\n```powershell\n# 1. Stop the job first (Ctrl+C) and wait for it to exit.\n# 2. Forget everything Spark has processed:\nRemove-Item -Recurse -Force checkpoint\\events\n# 3. Remove old input files, so they are not read again as \"new\":\nRemove-Item data\\incoming\\*.csv\n# 4. Empty the table. spark_app may not TRUNCATE events (least privilege), so use postgres:\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -U postgres -d ecommerce -c \"TRUNCATE events;\"\n# Optional: start the metrics logs fresh\nRemove-Item metrics\\*.jsonl\n```\n\nThe order matters. **Never delete the checkpoint while the job is running**,\nand never delete it without also clearing the input files and the table.\nA new checkpoint plus old files means every old file is \"new\" again. (The\nprimary key would still block duplicates in `events`, but the test counts\nwould be meaningless.)\n\n## Troubleshooting\n\nEvery error below was met for real while building this lab.\n\n| Symptom | Cause | Fix |\n|---|---|---|\n| `[PATH_NOT_FOUND] Path does not exist: file:/.../data/incoming` at start | the file source needs the input folder to exist before the query starts | the job now runs `os.makedirs(INPUT_DIR, exist_ok=True)` first; if you see it, you are running an old copy or from the wrong folder |\n| `psycopg2.OperationalError: connection to server at \"localhost\" ... port 5432 failed: Connection refused` | nothing is listening on that host and port: the service is stopped, or `PGPORT` is wrong (TC-08 caused it on purpose with port 5499) | `Get-Service postgresql*`, start it; check `PGHOST`/`PGPORT` in `.env` |\n| `FATAL: password authentication failed for user \"spark_app\"` | `PGPASSWORD` in `.env` differs from the one given to `-v app_password` | fix `.env`, or reset the password as `postgres`: `ALTER ROLE spark_app PASSWORD '...';` (re-running the setup script does **not** change an existing role) |\n| `java.lang.ClassNotFoundException: org.postgresql.Driver` | the JDBC jar is not on Spark's classpath: the first-run download failed (no internet), or a Spark session already existed without the package | check internet, look for `found org.postgresql#postgresql;42.7.4` in the log; restart Python so `getOrCreate()` builds a new session with the setting |\n| `UnsatisfiedLinkError: ... NativeIO$Windows.access0` (or `HADOOP_HOME and hadoop.home.dir are unset`) | winutils/`hadoop.dll` missing, or the terminal was opened before `HADOOP_HOME` was set | redo [step 3](#h-3-winutils-and-hadoop-home-windows-only) and open a new terminal |\n| Stream runs, prints no `batch ...` lines, table stays empty | (a) the files are in a different folder than `INPUT_DIR`, e.g. you started from another directory; (b) the checkpoint already lists those files as done; (c) the files are still named `_...` or `....` (Spark skips those); (d) every row fails the cleaning rules (then `rows == 0` and `write_batch` returns without printing) | run from the project folder; check `metrics/progress.jsonl` for `num_input_rows`; for (b) do the full reset above |\n| `Missing Python executable 'C:\\Program Files\\Python313\\python.exe' ...` and `The system cannot find the path specified.` at the top of the log | Spark's launcher script guessing where Spark is installed | harmless here: the job sets `PYSPARK_PYTHON` to the running interpreter and starts normally |\n\n> **Help:** what each log line of a normal run means is in [04 · The streaming job line by line](04-streaming-job-line-by-line.md#h-6-write-batch-the-sink).\n\n## Self-check\n\n1. Why does a Python program need Java installed? (PySpark only sends\n   instructions; the Spark engine runs in a Java process.)\n2. What does `-v app_password='x'` do, and where does `x` end up?\n   (Defines a psql variable; the script uses it as the password of role\n   `spark_app`. The same value goes in `.env` as `PGPASSWORD`.)\n3. Why does the reset need the `postgres` user for `TRUNCATE events`?\n   (`spark_app` only has `SELECT, INSERT` on `events`: least privilege.)\n4. You deleted `checkpoint/events` but not the CSV files. What happens on\n   the next start? (Spark sees every old file as new and re-reads it all.)\n5. Is the `Failed to delete ... postgresql-42.7.4.jar` error a problem?\n   (No. Windows keeps the jar locked during shutdown; data is already saved.)\n","study/02-batch-vs-streaming.md":"# 02 — Batch vs Streaming: the Ideas Behind the Job\n\nThe concepts you need before reading the code: what \"streaming\" means,\nhow Spark turns a stream into small batches, and the words (trigger, source,\nsink, output mode, event time) that appear on every later page.\n\n> **Help:** the code that uses each idea is walked through in [04 · The streaming job line by line](04-streaming-job-line-by-line.md). Short definitions of every term are in [11 · Glossary, practice, drills](11-glossary-and-practice.md).\n\n## Batch vs streaming\n\n**Batch processing** means: the data is already complete, you run a program\nover all of it once, and the program ends. Last week's ETL was batch: load\neverything from the source tables, transform, write, done.\n\n**Stream processing** means: the data never \"finishes\". New records keep\narriving, and the program runs forever, handling each new piece soon after it\narrives.\n\n| | Batch | Streaming |\n|---|---|---|\n| Input | a fixed set (a table, a folder of yesterday's files) | an endless flow (new files, messages, clicks) |\n| Program runs | once, then stops | continuously, until you stop it |\n| Answer is | final when the job ends | updated again and again |\n| Typical delay from event to result | hours (nightly job) | seconds |\n| Hard parts | volume | remembering what was already done, duplicates, late data, crashes mid-way |\n\nIn this lab the \"endless flow\" is the generator dropping a new CSV file into\n`data/incoming/` every 2 seconds. The job has to notice each new file, clean\nits rows and put them in PostgreSQL within seconds.\n\n## The unbounded table model\n\nSpark Structured Streaming's big idea: **treat the stream as a table that keeps\ngrowing**. It is called an *unbounded* table, because it has no last row.\n\n```\n data/incoming/                     the \"input table\" Spark imagines\n ─────────────                      ─────────────────────────────────\n events_..._123540.csv  ──────>     row 1    ┐\n                                    ...      │ file 1 (100 rows)\n                                    row 100  ┘\n events_..._123542.csv  ──────>     row 101  ┐\n                                    ...      │ file 2 (100 rows)\n                                    row 200  ┘\n (next file arrives)    ──────>     row 201 ... (keeps growing)\n```\n\nYou write your query **as if it were a normal query on a normal table**:\n`filter`, `withColumn`, `dropDuplicates`. Spark works out how to run it\n*incrementally*: each time new rows appear, it processes only those rows and\nadds the result to the output. That is why `clean()` in our job looks exactly\nlike batch PySpark code. The only streaming-specific words are `readStream`\nand `writeStream`.\n\n## Micro-batches and triggers\n\nSpark does not process rows one at a time. It wakes up regularly, collects\neverything new since last time, and processes that as a small batch: a\n**micro-batch**. Each micro-batch gets a number, the **batch id**: 0, 1, 2...\n\n```\ntime ──────────────────────────────────────────────────────────────>\n       │ 5 s │ 5 s │ 5 s │ 5 s │\n       ▼     ▼     ▼     ▼     ▼\n     batch0 batch1 batch2 batch3 ...\n     file 1 file 2 file 3 file 4        (MAX_FILES=1: at most one file each)\n```\n\nThe **trigger** decides when a micro-batch starts. Our job uses\n\n```python\n.trigger(processingTime=TRIGGER)      # TRIGGER = \"5 seconds\" from .env\n```\n\n`processingTime=\"5 seconds\"` means: start a new micro-batch every 5 seconds.\nIf a batch takes longer than 5 s, the next one starts as soon as it ends and\nSpark warns `Current batch is falling behind`. In run A the first batch took\n11,809 ms (start-up cost), so the warning appeared once. If there is nothing\nnew, Spark usually skips the batch.\n\nOther triggers exist: `availableNow=True` (process everything that is there,\nthen stop, handy for back-fills) and continuous mode (experimental). This lab\nonly uses `processingTime`.\n\nA second knob limits how much one batch takes:\n\n```python\n.option(\"maxFilesPerTrigger\", MAX_FILES)   # MAX_FILES = 1 from .env\n```\n\nWith `MAX_FILES=1`, one batch = one file, which makes tests easy to follow.\nIt also caps speed at one file per 5 s, which is too slow for the generator's\none file per 2 s. That is exactly why performance run P1 fell behind (see\n[08 · Performance and tuning](08-performance-and-tuning.md)).\n\n## Sources and sinks\n\nEvery streaming query reads from a **source** and writes to a **sink**.\n\n| | Built-in examples | In this lab |\n|---|---|---|\n| **Source** (where rows come from) | files in a folder (CSV, JSON, Parquet), Kafka, a socket, a test \"rate\" source | **files**: `spark.readStream.csv(\"data/incoming\")` |\n| **Sink** (where results go) | files, Kafka, console, memory, `foreach`, `foreachBatch` | **`foreachBatch`**: our own function writes each batch to PostgreSQL |\n\nA source must be able to say \"here is what is new since position X\", so\nSpark can record positions and replay after a crash. The file source does this\nby keeping a list of every file it has already handed out (see\n[06](06-reliability-checkpoints-exactly-once.md)).\n\n## Why a folder of files is the source\n\nReal systems usually stream from a message broker such as **Kafka** (a server\nthat stores an ordered log of messages and lets readers resume from a\nposition). The lab spec asks for CSV files instead. That is a reasonable\nstand-in:\n\n- No extra server to install. A folder works on any laptop.\n- You can open the input in a text editor and count rows by hand. That is how\n  the exact expected counts in [07](07-testing-the-pipeline.md) are known.\n- Replays are easy to set up: copy a file, delete a checkpoint entry.\n\nThe file source has rules you must follow, and the code follows them:\n\n1. **Files must appear complete.** Spark may list the folder while a file is\n   half written. The generator writes to a name starting with `_` and then\n   renames it in one step. Spark ignores names starting with `_` or `.`.\n   ([03](03-generator-line-by-line.md#h-4-write-file-write-to-tmp-then-rename))\n2. **Files are never changed after they appear.** Spark tracks files by\n   path. If you append to an already-read file, the new rows are never seen.\n3. **The schema must be given up front.** A stream cannot scan \"all the data\"\n   to guess column types, because all the data does not exist yet.\n\n## Output modes, and why this job uses foreachBatch\n\nThe **output mode** says what each micro-batch sends to the sink:\n\n| Mode | What goes to the sink each batch | Typical use |\n|---|---|---|\n| **append** (the default) | only rows that are new and final | row-by-row pipelines like ours: each event is written once |\n| **update** | only result rows that changed since the last batch | running counts per key |\n| **complete** | the whole result table, every time | small aggregate tables (e.g. totals per category) |\n\nOur query does no aggregation (no `groupBy`), so **append** is right: each\nclean event is emitted once, in the batch where it arrived.\n\nWhy not a ready-made \"PostgreSQL sink\"? Spark has **no built-in streaming\nJDBC sink**. `foreachBatch` solves that: it calls your Python function once per\nmicro-batch, passing the batch as an ordinary (non-streaming) DataFrame plus\nits batch id:\n\n```python\n.foreachBatch(write_batch)      # write_batch(batch_df, batch_id)\n```\n\nInside, you can use anything that works on a normal DataFrame, including\nSpark's batch JDBC writer, and you can run extra SQL before and after. Our\n`write_batch` uses that freedom for a two-step write: bulk-insert into a\nstaging table, then a SQL merge that skips duplicates. The why is in\n[05](05-postgres-jdbc-and-the-merge.md#h-12-why-staging-merge-not-a-plain-append).\n\n## Event time vs processing time\n\nTwo different clocks matter in streaming:\n\n| Clock | Meaning | In this lab |\n|---|---|---|\n| **Event time** | when the thing actually happened in the real world | `event_time` column, written by the generator in UTC, e.g. `2026-11-04 10:35:40.222` |\n| **Processing time** | when the pipeline handled it | the trigger clock; and `ingested_at` (`DEFAULT now()` when the row lands in PostgreSQL) |\n\nThey differ because of delay. In a real system an event can travel through\nphones, networks and queues and arrive minutes late, or out of order.\n\nOne file shows the two clocks side by side. The generator's first file in\nrun A is called `events_20261104_123540_223838.csv` (file name from the\nlaptop's **local** clock, UTC+2) and its first row has\n`event_time = 2026-11-04 10:35:40.222` (**UTC**). Same moment, two clocks.\nThat is why the job sets `spark.sql.session.timeZone` to `UTC` and the table\nuses `TIMESTAMPTZ`\n([05](05-postgres-jdbc-and-the-merge.md#h-6-timestamptz-vs-timestamp-the-2-hour-story)).\n\nEvent time is what you use for **business logic**: de-duplication with a\nwatermark (\"how late may a duplicate still arrive?\") is defined on\n`event_time`, not on when Spark saw the row. The difference between the two\nclocks is the **latency**: `ingested_at - event_time`.\n\n## Latency vs throughput (first look)\n\n- **Latency**: how long one event waits from happening to being stored.\n  Measured as `ingested_at - event_time`.\n- **Throughput**: how many rows per second the pipeline handles.\n\nThey pull against each other. A micro-batch has a fixed cost (planning,\nopening a database connection, a transaction) of roughly 3 s here, whether it\nholds 100 rows or 10,000. So:\n\n| Run | Input | Trigger / files per batch | Landed rows/s | Latency p50 |\n|---|---|---|---|---|\n| P2 | 50 rows/s | 5 s / 5 | 53.3 | 5.4 s |\n| P3 | 1,000 rows/s | 10 s / 10 | 902.1 | 16.6 s |\n\nBigger, less frequent batches: more rows per second, but each event waits\nlonger. A pipeline that cannot keep up at all (P1) has *growing* latency,\nbecause the queue of waiting files only gets longer. The full analysis is in\n[08 · Performance and tuning](08-performance-and-tuning.md).\n\n## Self-check\n\n1. In one sentence, what is a micro-batch? (The set of new input rows Spark\n   collects and processes together at one trigger.)\n2. Why must the schema be given to `readStream`? (The data does not exist\n   yet, so Spark cannot scan it to infer types.)\n3. Why does this job use `foreachBatch` instead of a built-in sink? (There is\n   no streaming JDBC sink; `foreachBatch` gives a normal DataFrame so we can\n   use the batch JDBC writer plus our own SQL.)\n4. Which clock is `event_time`, and which is `ingested_at`? (Event time;\n   processing/landing time. Their difference is the latency.)\n5. With `MAX_FILES=1`, a 5 s trigger and a new file every 2 s, what happens?\n   (Files arrive faster than they are taken; the backlog and latency grow.)\n","study/03-generator-line-by-line.md":"# 03 — data_generator.py, Line by Line\n\nThe generator is Part 1 of the lab: it fakes an e-commerce site's click\nstream by writing CSV files into a folder. This page explains every line,\nand why it is built so that test results can be predicted exactly.\n\n> **Where the code lives now.** The generator is `src/data_generator.py`. The\n> root `data_generator.py` only calls its `main()`, because the brief names that\n> file, so every command here still works. `tests/test_data_generator.py`\n> checks the rules this page explains (ranges, quantity 0 for views, the\n> atomic rename).\n\n> **Help:** why a folder of files works as a stream source is in [02 · Batch vs streaming](02-batch-vs-streaming.md#h-why-a-folder-of-files-is-the-source).\n\n## What the script does\n\n```\nevery --every seconds, until --batches files are written:\n    make --rows fake events\n    spoil about --bad-rate of them (break one field each)\n    write them to data/incoming/_events_\u003ctime>.csv\n    rename to data/incoming/events_\u003ctime>.csv      \u003c- Spark can see it now\n    print \"events_\u003ctime>.csv: 100 rows (13 spoiled)\"\n```\n\nThe header of the file shows the three ways to run it:\n\n```python\npython data_generator.py                          # 100 rows every 2 s, forever (Ctrl+C to stop)\npython data_generator.py --rows 500 --every 1 --batches 60\npython data_generator.py --bad-rate 0.2           # 20% of rows get a broken field\n```\n\n## 1. The event shape\n\n```python\nFIELDS = [\"event_id\", \"event_time\", \"user_id\", \"session_id\", \"event_type\",\n          \"product_id\", \"category\", \"price\", \"quantity\"]\n```\n\nThese nine names are the CSV header, in this order. The Spark job lists the\nsame nine names in `COLS`, and the `events` table has the same nine columns\nplus `ingested_at`. A real row from run A:\n\n```text\nevent_id,event_time,user_id,session_id,event_type,product_id,category,price,quantity\n07c0a1ea-3bd2-419b-a83c-997b20edc2e8,2026-11-04 10:35:40.222,141,ccc1c2832361,view,1250,electronics,373.66,0\n```\n\n| Column | Example | Meaning |\n|---|---|---|\n| `event_id` | `07c0a1ea-...` | unique id of this event (a UUID, see below). The key used against duplicates |\n| `event_time` | `2026-11-04 10:35:40.222` | when it happened, UTC, with milliseconds |\n| `user_id` | `141` | who (1 to 500) |\n| `session_id` | `ccc1c2832361` | the visit (12 hex characters) |\n| `event_type` | `view` | `view`, `add_to_cart` or `purchase` |\n| `product_id` | `1250` | which product (1000 to 1999) |\n| `category` | `electronics` | product group |\n| `price` | `373.66` | unit price, inside the category's range |\n| `quantity` | `0` | 0 for a view, 1 to 3 otherwise |\n\n## 2. make_event(): one fake event\n\n```python\nCATEGORIES = {\"electronics\": (50, 1500), \"books\": (5, 60), \"fashion\": (10, 250),\n              \"home\": (15, 400), \"sports\": (10, 600)}\nEVENT_TYPES = [\"view\", \"add_to_cart\", \"purchase\"]\nEVENT_WEIGHTS = [75, 17, 8]          # most visits are views; few end in a purchase\n```\n\n`CATEGORIES` is a dictionary: category name → (lowest price, highest price).\nSo a book never costs 900. Realistic ranges make later analysis queries\nbelievable.\n\n`EVENT_WEIGHTS` makes the types uneven, like a real shop: out of 100 events,\nabout 75 views, 17 add-to-carts and 8 purchases.\n\n```python\ndef make_event() -> Event:\n    category = random.choice(list(CATEGORIES))\n    low, high = CATEGORIES[category]\n    event_type = random.choices(EVENT_TYPES, weights=EVENT_WEIGHTS)[0]\n```\n\n| Call | What it does |\n|---|---|\n| `random.choice(list(CATEGORIES))` | pick one category, all equally likely |\n| `low, high = CATEGORIES[category]` | unpack the price range |\n| `random.choices(EVENT_TYPES, weights=EVENT_WEIGHTS)` | pick with the given weights. `choices` returns a **list** (it can pick several), so `[0]` takes the one item |\n\n```python\n    return {\n        \"event_id\": str(uuid.uuid4()),\n        # UTC with milliseconds, e.g. 2026-11-04 09:42:17.123\n        \"event_time\": datetime.now(timezone.utc).strftime(\"%Y-%m-%d %H:%M:%S.%f\")[:-3],\n        \"user_id\": random.randint(1, 500),\n        \"session_id\": uuid.uuid4().hex[:12],\n        \"event_type\": event_type,\n        \"product_id\": random.randint(1000, 1999),\n        \"category\": category,\n        \"price\": round(random.uniform(low, high), 2),\n        \"quantity\": 0 if event_type == \"view\" else random.randint(1, 3),\n    }\n```\n\n- **`uuid.uuid4()`** makes a *UUID*, a 128-bit random identifier such as\n  `07c0a1ea-3bd2-419b-a83c-997b20edc2e8`. The chance of two being equal is\n  practically zero, so the id can be created here, at the source, with no\n  central counter. That matters: because the id is born with the event, a\n  re-sent copy of the event carries the **same** id, and the database can\n  recognise it as a duplicate. This is called a **natural key**.\n- **`datetime.now(timezone.utc)`** asks for the current time **in UTC**,\n  not the laptop's local time (UTC+2). `%f` prints microseconds (6 digits);\n  `[:-3]` cuts the last 3, leaving milliseconds. The Spark job parses\n  exactly this pattern: `'yyyy-MM-dd HH:mm:ss.SSS'`.\n- **`random.randint(1, 500)`** includes both ends: 1 and 500 are possible.\n- **`random.uniform(low, high)`** gives a decimal number in the range;\n  `round(..., 2)` keeps cents.\n- **`quantity`**: a view has no quantity, so 0; a cart or purchase gets 1–3.\n\n## 3. spoil(): bad data on purpose\n\nReal input is dirty. To prove the job's cleaning rules work, the generator\nbreaks some rows itself.\n\n```python\nBAD_VALUES = [\"\", \"-5\", \"unknown\", \"NaN\"]\n\ndef spoil(event: Event) -> Event:\n    \"\"\"Break one field, so the Spark job's cleaning rules have something to catch.\"\"\"\n    field = random.choice([\"price\", \"event_type\", \"user_id\", \"event_time\"])\n    event[field] = random.choice(BAD_VALUES)\n    return event\n```\n\nOne spoiled row = one of four fields replaced by one of four bad values. The\nkey design point: **every one of the 16 combinations breaks a rule in the\njob**. Here is the proof, using the rules from `clean()`\n([04](04-streaming-job-line-by-line.md#h-4-clean-types-and-rules)):\n\n| Field \\ value | `\"\"` (empty) | `\"-5\"` | `\"unknown\"` | `\"NaN\"` |\n|---|---|---|---|---|\n| `price` | read as null → fails `price >= 0` | casts to -5.00 → fails `price >= 0` | `try_cast` gives null → fails | null (a DECIMAL has no NaN) → fails |\n| `event_type` | null → fails `isin(...)` | `\"-5\"` not in the list → fails | not in list → fails | lower-cased `\"nan\"`, not in list → fails |\n| `user_id` | null → fails `user_id > 0` | **casts to -5 → fails `user_id > 0`** | null → fails | null → fails |\n| `event_time` | null → fails `isNotNull` | `try_to_timestamp` gives null → fails | null → fails | null → fails |\n\nReal spoiled rows from the first file of run A:\n\n```text\n31f4ae09-...,2026-11-04 10:35:40.223,-5,74e114ea1782,view,1223,home,104.57,0\nd8144642-...,2026-11-04 10:35:40.223,326,f3928ceabeed,view,1854,home,unknown,0\n7e1f0460-...,2026-11-04 10:35:40.223,72,c382114d781f,view,1252,home,,0\n5e0c70f7-...,-5,198,99f74782a30e,view,1390,home,244.42,0\n```\n\nBecause every spoil is fatal to the row, the expected output is exact:\n\n> **rows reaching PostgreSQL = rows generated − rows spoiled**\n\nThe generator prints the spoiled count per file, so you can add them up. In\nrun A (20 files, `--bad-rate 0.2`): 2,000 rows, 385 spoiled, so exactly\n**1,615** rows must land. They did, after a bug fix: the `user_id = \"-5\"` cell\nin bold above is the case the first version of the job missed. That story is\nin [07](07-testing-the-pipeline.md#h-tc-04-the-test-that-found-a-real-bug).\n\nIf a spoil could produce a row that is still valid (say, a random new price),\nyou could no longer predict the count, and the test would only be \"roughly\nright\". Making every spoil break a rule is what turns the test into a yes/no\ncheck.\n\nThe counting loop in `write_file`:\n\n```python\n    events = [make_event() for _ in range(rows)]\n    bad = 0\n    for e in events:\n        if random.random() \u003c bad_rate:\n            spoil(e)\n            bad += 1\n```\n\n`random.random()` returns a number in [0, 1). It is below 0.2 about 20% of\nthe time, so about 20% of rows are spoiled. Each row is spoiled at most once,\nso `bad` counts rows, not fields. The default `--bad-rate` is 0.02 (2%),\nwhich the performance runs used.\n\n## 4. write_file(): write to _tmp, then rename\n\n```python\n    name = f\"events_{datetime.now():%Y%m%d_%H%M%S_%f}.csv\"\n    tmp_path = os.path.join(out_dir, \"_\" + name)\n    with open(tmp_path, \"w\", newline=\"\", encoding=\"utf-8\") as f:\n        writer = csv.DictWriter(f, fieldnames=FIELDS)\n        writer.writeheader()\n        writer.writerows(events)\n    os.replace(tmp_path, os.path.join(out_dir, name))     # atomic rename\n    return name, bad\n```\n\nLine by line:\n\n| Line | Meaning |\n|---|---|\n| `datetime.now():%Y%m%d_%H%M%S_%f` | file name from the **local** clock down to microseconds, e.g. `events_20261104_123540_223838.csv`. Unique, and sorts in time order |\n| `\"_\" + name` | the temporary name starts with `_` |\n| `newline=\"\"` | required by Python's `csv` module, otherwise Windows gets blank lines between rows |\n| `csv.DictWriter(..., fieldnames=FIELDS)` | writes dictionaries as CSV rows, columns in `FIELDS` order |\n| `writeheader()` | the first line is the column names; the job reads with `header=True` |\n| `os.replace(tmp, final)` | rename the finished file to its real name |\n\n**Why the two steps?** Spark lists the folder every trigger. Writing a file\ntakes a moment. Without the trick, Spark could list the file when only half of\nit is on disk, read 37 rows, mark the file as done, and never look at it again.\n63 rows lost.\n\nThe trick relies on two facts:\n\n1. **Spark's file source ignores files whose names start with `_` or `.`.**\n   (Hadoop treats them as hidden.) So the half-written `_events_...csv` is\n   invisible.\n2. **A rename within one folder is atomic**: it happens in one step. Other\n   programs see the old name or the new name, never something in between. So\n   when `events_...csv` appears, it is already complete.\n\n`os.replace` is used rather than `os.rename` because on Windows `os.rename`\nfails if the target exists, while `os.replace` overwrites. TC-01 checked the\nresult: 20 files, each with a header and 100 rows, and 0 files starting with\n`_` left behind.\n\nTC-07 used the same trick by hand to inject a duplicate file: copy to a\n`_` name, then rename.\n\n## 5. Command-line flags\n\n```python\n    ap.add_argument(\"--out\", default=os.getenv(\"INPUT_DIR\", \"data/incoming\"))\n    ap.add_argument(\"--rows\", type=int, default=100, help=\"rows per file\")\n    ap.add_argument(\"--every\", type=float, default=2.0, help=\"seconds between files\")\n    ap.add_argument(\"--batches\", type=int, default=0, help=\"files to write; 0 = forever\")\n    ap.add_argument(\"--bad-rate\", type=float, default=0.02, help=\"share of rows to spoil\")\n    ap.add_argument(\"--seed\", type=int, help=\"fix the random numbers, for repeatable tests\")\n```\n\n`argparse` turns command-line words into `args.rows`, `args.every` and so on\n(`--bad-rate` becomes `args.bad_rate`). `load_dotenv()` runs first, so\n`--out` defaults to the same `INPUT_DIR` the Spark job reads. The two\nprograms cannot point at different folders by accident.\n\n| Flag | Default | Used in tests as |\n|---|---|---|\n| `--rows` | 100 | 100 (functional), 1,000 (P3) |\n| `--every` | 2.0 s | 2 (functional, P1, P2), 1 (P3) |\n| `--batches` | 0 = forever | 20 (TC-01/04), 5 (TC-06), 15 (hard kill), 3 (TC-08) |\n| `--bad-rate` | 0.02 | 0.2 for functional tests (more to catch), 0.02 for performance |\n| `--seed` | none | 42 |\n\nInput rate = `--rows` ÷ `--every`: 100 ÷ 2 = 50 rows/s; 1,000 ÷ 1 = 1,000 rows/s.\n\nThe main loop:\n\n```python\n    os.makedirs(args.out, exist_ok=True)\n    written = 0\n    try:\n        while args.batches == 0 or written \u003c args.batches:\n            name, bad = write_file(args.out, args.rows, args.bad_rate)\n            written += 1\n            print(f\"{name}: {args.rows} rows ({bad} spoiled)\", flush=True)\n            time.sleep(args.every)\n    except KeyboardInterrupt:\n        pass\n    print(f\"done: {written} files, {written * args.rows} rows\")\n```\n\n- `while args.batches == 0 or written \u003c args.batches`: forever when 0,\n  otherwise stop after N files.\n- `flush=True` prints immediately, even when output is redirected to a log\n  file (the `reports/logs/run*_gen.log` files were made that way).\n- `except KeyboardInterrupt: pass`: Ctrl+C ends the loop quietly and still\n  prints the `done:` summary. Because each file appears by rename, stopping\n  mid-way never leaves a broken visible file.\n\n## 6. --seed: repeatable tests\n\n```python\n    if args.seed is not None:\n        random.seed(args.seed)\n```\n\n`random` is a *pseudo*-random generator: a formula that produces a sequence\nthat looks random. The **seed** is its starting point. Same seed, same\nsequence. With `--seed 42`, the 20 files have the same categories, prices,\nevent types, and, most importantly, **the same rows spoiled in the same\nway**.\n\nProof from this lab: the buggy run (`reports/logs/bug_run/runA_gen.log`) and the\nfixed run (`reports/logs/runA_gen.log`) printed identical spoiled counts, file by\nfile (13, 19, 20, 18, 26, ...; total 385). So the only thing that changed\nbetween 1,642 rows and 1,615 rows was the job's code. That is what makes a\nbefore/after comparison fair.\n\nWhat the seed does **not** fix:\n\n- `event_id` and `session_id` come from `uuid.uuid4()`, which uses the\n  operating system's randomness, not `random`. They differ every run.\n- `event_time` and the file names come from the clock.\n\nThat is fine: the tests count rows and check rules; they never look up a\nspecific id.\n\n## Self-check\n\n1. Why does every one of the 16 spoil combinations have to break a rule?\n   (So the expected count is exactly generated − spoiled; otherwise the test\n   cannot give a yes/no answer.)\n2. Which spoil combination did the first job version miss, and why?\n   (`user_id = \"-5\"`: it casts to a valid INT, and the filter only checked\n   for null.)\n3. What would go wrong if the generator wrote `events_x.csv` directly?\n   (Spark could read a half-written file, mark it done, and lose the rest.)\n4. Why is `event_id` created in the generator rather than by the database?\n   (A resent copy then has the same id, so duplicates can be detected.)\n5. With `--seed 42`, are the `event_id`s the same in two runs? (No; they\n   come from `uuid4`, not `random`. The spoiled rows and counts are the same.)\n","study/04-streaming-job-line-by-line.md":"# 04 — spark_streaming_to_postgres.py, Line by Line\n\nThe streaming job is Parts 2 and 3 of the lab: it watches the folder, cleans\neach new file and writes the rows to PostgreSQL. This page goes through all\n202 lines in the order they run.\n\n> **Where the code lives now.** The lab was split into modules like Lab 1\n> (`src/`, `tests/`, `analysis.ipynb`). The code below is unchanged in what it\n> does, only where it is: `src/config.py` reads `.env`, `src/spark_session.py`\n> builds Spark, `src/cleaning.py` has the schema, `read_stream()` and\n> `clean()` (now split into `cast_types()`, `drop_bad_rows()` and\n> `drop_duplicates()`), `src/postgres_sink.py` has `MERGE_SQL` and\n> `write_batch()`, `src/metrics.py` has `ProgressLogger`, and `src/main.py`\n> starts the query (`start_query()`, plus a `--once` flag). The root file\n> `spark_streaming_to_postgres.py` only calls `src.main.main()`, so every\n> command on this page still works. Line numbers below are from the old\n> single file.\n\n> **Help:** the ideas behind the words used here (micro-batch, trigger, sink, watermark) are in [02 · Batch vs streaming](02-batch-vs-streaming.md). Every Spark function used is also listed A–Z in [12 · Streaming API and SQL reference](12-streaming-and-sql-reference.md).\n\n## The shape of the file\n\nThe module docstring gives the whole flow in three lines:\n\n```text\nnew CSV files -> read as strings -> cast + validate -> drop duplicates\n  -> foreachBatch: JDBC insert into events_staging -> SQL merge into events\n```\n\n| Part | Lines | Job |\n|---|---|---|\n| settings | 24–52 | read `.env`, build the JDBC URL, define the schema and the merge SQL |\n| `build_spark()` | 55–65 | start Spark with the right settings |\n| `read_stream()` | 68–74 | the source: the CSV folder |\n| `clean()` | 77–99 | cast, validate, de-duplicate |\n| `write_batch()` | 108–147 | the sink: runs once per micro-batch |\n| `ProgressLogger` | 150–170 | saves Spark's progress report per batch |\n| `main()` | 173–198 | wires it together, starts and stops the query |\n\n## 1. Configuration from .env\n\n```python\nload_dotenv()\n\nPG: dict[str, Any] = {\n    \"host\": os.getenv(\"PGHOST\", \"localhost\"),\n    \"port\": int(os.getenv(\"PGPORT\", \"5432\")),\n    \"dbname\": os.getenv(\"PGDATABASE\", \"ecommerce\"),\n    \"user\": os.getenv(\"PGUSER\", \"spark_app\"),\n    \"password\": os.getenv(\"PGPASSWORD\", \"\"),\n}\nJDBC_URL = f\"jdbc:postgresql://{PG['host']}:{PG['port']}/{PG['dbname']}\"\nINPUT_DIR = os.getenv(\"INPUT_DIR\", \"data/incoming\")\nCHECKPOINT_DIR = os.getenv(\"CHECKPOINT_DIR\", \"checkpoint/events\")\nTRIGGER = os.getenv(\"TRIGGER\", \"5 seconds\")\nMAX_FILES = int(os.getenv(\"MAX_FILES\", \"1\"))\nMETRICS_DIR = Path(\"metrics\")\n```\n\n- `load_dotenv()` copies each `NAME=value` line of `.env` into the process\n  environment. It does **not** overwrite a variable that is already set. That\n  is how TC-08 could run `PGPORT=5499 python spark_streaming_to_postgres.py`:\n  the command-line value wins over `.env`.\n- `os.getenv(name, default)` reads a variable or falls back to the default.\n  Environment values are always text, hence `int(...)` for the port and\n  `MAX_FILES`.\n- `PG` is one dictionary used twice: `psycopg2.connect(**PG)` unpacks it into\n  keyword arguments (`host=..., port=...`), and its parts build `JDBC_URL`,\n  e.g. `jdbc:postgresql://localhost:5432/ecommerce`.\n- The defaults equal `.env.example`, so the job behaves the same with or\n  without those lines. Only the password has no useful default.\n\n```python\nCOLS = [\"event_id\", \"event_time\", \"user_id\", \"session_id\", \"event_type\",\n        \"product_id\", \"category\", \"price\", \"quantity\"]\nEVENT_TYPES = [\"view\", \"add_to_cart\", \"purchase\"]\n\nRAW_SCHEMA = StructType([StructField(c, StringType()) for c in COLS])\n```\n\nA **schema** is the list of column names and types. `RAW_SCHEMA` says: nine\ncolumns, **all strings**. The comment in the code explains why:\n*a bad value then becomes null at the cast step instead of failing the whole\nfile at read time.* If `price` were declared as a decimal here, the CSV reader\nwould have to decide what to do with `unknown` in the middle of reading.\nReading text first and converting later puts that decision in our hands, row\nby row.\n\n```python\nMERGE_SQL = f\"\"\"\n    INSERT INTO events ({\", \".join(COLS)})\n    SELECT {\", \".join(COLS)} FROM events_staging\n    ON CONFLICT (event_id) DO NOTHING\n\"\"\"\n```\n\nThe f-string fills in the nine column names, so the merge can never list\ncolumns in a different order from `COLS`. What the SQL does is explained in\n[05](05-postgres-jdbc-and-the-merge.md#h-12-why-staging-merge-not-a-plain-append).\n\n## 2. build_spark(): the SparkSession\n\n```python\ndef build_spark() -> SparkSession:\n    os.environ.setdefault(\"PYSPARK_PYTHON\", sys.executable)\n    spark = (SparkSession.builder\n             .appName(\"ecommerce-events-to-postgres\")\n             .master(\"local[*]\")\n             .config(\"spark.jars.packages\", \"org.postgresql:postgresql:42.7.4\")  # JDBC driver\n             .config(\"spark.sql.shuffle.partitions\", \"4\")     # default 200 is too many for small batches\n             .config(\"spark.sql.session.timeZone\", \"UTC\")     # the generator writes UTC times\n             .getOrCreate())\n    spark.sparkContext.setLogLevel(\"WARN\")\n    return spark\n```\n\nA **SparkSession** is your connection to the Spark engine. Every DataFrame\nis made through it.\n\n| Setting | What it does | Why here |\n|---|---|---|\n| `PYSPARK_PYTHON = sys.executable` | tells Spark which Python to start for its worker processes | the same interpreter that runs this script, so the same packages. `setdefault` keeps any value you already set |\n| `appName(...)` | a label shown in logs and the Spark UI (`http://localhost:4040` while it runs) | easy to recognise |\n| `master(\"local[*]\")` | run on this machine, one worker thread per CPU core | no cluster in this lab |\n| `spark.jars.packages` | download this Java library from Maven Central and put it on Spark's classpath | the PostgreSQL JDBC driver. First run needs internet; then it is cached |\n| `spark.sql.shuffle.partitions = 4` | how many pieces Spark splits data into after a *shuffle* (moving rows between workers by key) | `dropDuplicates` shuffles by `event_id`. The default 200 would mean 200 tiny tasks per 100-row batch, and 200 state-store folders. 4 is enough; the checkpoint shows `state/0/0` to `state/0/3` |\n| `spark.sql.session.timeZone = UTC` | the time zone Spark uses to read and show timestamps that have no zone | the CSV says `10:35:40.222` with no zone. With this setting Spark reads it as UTC, which is what the generator meant |\n| `setLogLevel(\"WARN\")` | hide Spark's INFO chatter | the console shows our `batch ...` lines and real warnings only |\n\n`getOrCreate()` returns the existing session if one is already running in\nthis Python process. That is a trap in notebooks: settings like\n`spark.jars.packages` only apply when the session is first created.\n\n## 3. read_stream(): the source\n\n```python\ndef read_stream(spark: SparkSession) -> DataFrame:\n    os.makedirs(INPUT_DIR, exist_ok=True)             # the file source fails on a missing folder\n    return (spark.readStream\n            .schema(RAW_SCHEMA)                       # streaming sources need the schema up front\n            .option(\"header\", True)\n            .option(\"maxFilesPerTrigger\", MAX_FILES)  # cap on files per micro-batch\n            .csv(INPUT_DIR))\n```\n\n| Line | Meaning |\n|---|---|\n| `os.makedirs(..., exist_ok=True)` | create the folder if missing. Without it, a fresh checkout failed with `PATH_NOT_FOUND` before the generator had made the folder |\n| `spark.readStream` | like `spark.read`, but returns a **streaming** DataFrame: a description of an endless input, not data |\n| `.schema(RAW_SCHEMA)` | streaming sources cannot infer a schema; you must give it |\n| `.option(\"header\", True)` | the first line of each file is column names, not data |\n| `.option(\"maxFilesPerTrigger\", MAX_FILES)` | at most this many new files per micro-batch. With 1, one file = one batch |\n| `.csv(INPUT_DIR)` | watch this folder for new CSV files |\n\nNothing is read yet. A streaming DataFrame is a plan; it only runs after\n`writeStream...start()`.\n\n## 4. clean(): types and rules\n\n### Casting\n\n```python\n    typed = (raw\n        .withColumn(\"event_time\", F.expr(\"try_to_timestamp(event_time, 'yyyy-MM-dd HH:mm:ss.SSS')\"))\n        .withColumn(\"user_id\", F.expr(\"try_cast(user_id AS INT)\"))\n        .withColumn(\"product_id\", F.expr(\"try_cast(product_id AS INT)\"))\n        .withColumn(\"price\", F.expr(\"try_cast(price AS DECIMAL(10,2))\"))\n        .withColumn(\"quantity\", F.expr(\"try_cast(quantity AS INT)\"))\n        .withColumn(\"event_type\", F.lower(F.trim(\"event_type\")))\n        .withColumn(\"category\", F.lower(F.trim(\"category\"))))\n```\n\n- `withColumn(name, expr)` replaces the column with a new value.\n- `F.expr(\"...\")` lets you write a Spark SQL expression as a string.\n- **`try_cast(x AS INT)`** converts text to a number, and returns **null**\n  if it cannot. A plain `CAST` behaves differently in Spark 4: *ANSI mode*\n  (strict SQL-standard behaviour) is on by default, so `CAST('unknown' AS INT)`\n  **raises an error** and would stop the whole query. `try_cast` turns a bad\n  value into null so the row can be filtered out instead.\n- **`try_to_timestamp(text, pattern)`** is the same idea for dates. The\n  pattern `yyyy-MM-dd HH:mm:ss.SSS` matches the generator's format exactly\n  (`SSS` = milliseconds). `-5` or `unknown` give null.\n- `DECIMAL(10,2)`: up to 10 digits, 2 after the point. Exact money, no\n  floating-point rounding. Matches `NUMERIC(10,2)` in PostgreSQL.\n- `F.lower(F.trim(...))`: strip spaces and lower-case, so ` View ` would\n  still count as `view`.\n\n### The rules\n\n```python\n    valid = typed.filter(\n        F.col(\"event_id\").isNotNull()\n        & F.col(\"event_time\").isNotNull()\n        & (F.col(\"user_id\") > 0)                      # \"> 0\" also rejects null; \"-5\" casts to a valid INT\n        & (F.col(\"product_id\") > 0)\n        & F.col(\"event_type\").isin(EVENT_TYPES)\n        & (F.col(\"price\") >= 0)                       # null price fails this too\n        & (F.col(\"quantity\").isNull() | (F.col(\"quantity\") >= 0)))\n```\n\n`filter` keeps rows where the condition is true. `&` is AND, `|` is OR. In\nPySpark each comparison must be in brackets, because `&` binds tighter than\n`>` in Python.\n\n| Rule | Rejects |\n|---|---|\n| `event_id` not null | rows with no id (cannot de-duplicate) |\n| `event_time` not null | empty or unparseable times |\n| `user_id > 0` | null **and** negative ids. A comparison with null is *unknown*, and `filter` drops unknown, so `> 0` covers both |\n| `product_id > 0` | same for products |\n| `event_type` in the list | empty, misspelled, `nan` |\n| `price >= 0` | null and negative prices |\n| `quantity` null or `>= 0` | negative quantities; a missing quantity is allowed |\n\nThe comment on the `user_id` line is the scar from TC-04. The first version\nsaid `F.col(\"user_id\").isNotNull()`. The spoiled value `\"-5\"` casts to the\nvalid integer -5, is not null, and passed: 27 bad rows reached the table. The\nsame rules now also exist as `CHECK` constraints in PostgreSQL. Full story in\n[07](07-testing-the-pipeline.md#h-tc-04-the-test-that-found-a-real-bug).\n\n## 5. Watermark and dropDuplicates\n\n```python\n    # Same event_id seen twice within 10 minutes of event time -> keep one.\n    # The watermark tells Spark when it may forget old ids, so memory stays bounded.\n    return (valid\n        .withWatermark(\"event_time\", \"10 minutes\")\n        .dropDuplicates([\"event_id\", \"event_time\"]))\n```\n\n**`dropDuplicates`** on a stream must remember every key it has seen, across\nbatches, to know if a new row is a repeat. That memory is **state**, and Spark\nsaves it in the checkpoint (`checkpoint/events/state/`).\n\nWithout a limit, state grows forever. The **watermark** is the limit:\n\n> watermark = (latest `event_time` seen so far) − 10 minutes\n\nSpark assumes no row older than the watermark will still arrive, and it\ndeletes remembered keys older than that. Because `event_time` is part of the\nde-duplication key, Spark can tell which stored keys are old enough to drop.\n\nSo the job removes duplicates **that arrive within about 10 minutes of each\nother** (in event time). TC-07 proved it: a copied file with 98 valid rows\ngave 0 new rows. A copy arriving later would get past this step, and then the\ndatabase's primary key stops it. More on bounded state in\n[06](06-reliability-checkpoints-exactly-once.md#h-watermark-bounded-state).\n\n(Spark 3.5+ also has `dropDuplicatesWithinWatermark([\"event_id\"])`, which\nkeys on the id alone. This job uses the classic form.)\n\n## 6. write_batch(): the sink\n\n`foreachBatch` calls this function once per micro-batch. It runs on the\n**driver** (the main Python process) and gets the batch as an ordinary\nDataFrame, plus the batch id.\n\n```python\n    started = time.time()\n    batch_df = batch_df.select(*COLS).persist()      # used twice: count + write\n    rows = batch_df.count()\n    if rows == 0:\n        batch_df.unpersist()\n        return\n```\n\n- `select(*COLS)`: the nine columns, in table order.\n- **`persist()`**: keep the computed rows in memory after their first use.\n  The batch is used twice (count, then write). Without `persist`, Spark would\n  re-read the CSV and redo all the casting for the second use.\n- `count()` is the number of clean rows in this batch.\n- Empty batch: nothing to do. This happens when every row was a duplicate\n  (TC-07's batch 21) or for Spark's own no-data batches. No line is printed\n  and nothing goes to `batches.jsonl`.\n\n```python\n    with psycopg2.connect(**PG) as conn, conn.cursor() as cur:\n        cur.execute(\"TRUNCATE events_staging\")       # clear leftovers from a failed earlier try\n    (batch_df.write.format(\"jdbc\")\n        .option(\"url\", JDBC_URL)\n        .option(\"dbtable\", \"events_staging\")\n        .option(\"user\", PG[\"user\"])\n        .option(\"password\", PG[\"password\"])\n        .option(\"driver\", \"org.postgresql.Driver\")\n        .mode(\"append\")\n        .save())\n    staged = time.time()\n```\n\n1. Empty the staging table. If an earlier attempt died after loading staging\n   but before the merge, its rows are still there; this clears them.\n2. Bulk-write the batch into `events_staging` through JDBC. `mode(\"append\")`\n   adds rows, never drops the table. `driver` names the Java class inside the\n   jar that `spark.jars.packages` downloaded.\n\nTC-08 failed on exactly this first `psycopg2.connect` (the traceback\npoints into `write_batch` at this line): `port 5499 failed: Connection refused`. An exception here stops\nthe query **before** the batch is recorded as done, which is what makes the\nretry safe.\n\n```python\n    with psycopg2.connect(**PG) as conn, conn.cursor() as cur:   # one transaction\n        cur.execute(MERGE_SQL)\n        inserted = cur.rowcount\n        cur.execute(\"TRUNCATE events_staging\")\n    batch_df.unpersist()\n```\n\n- `with conn:` in psycopg2 means **one transaction**: everything inside is\n  committed together at the end of the block, or rolled back together if an\n  exception is raised. (It does not close the connection; that happens when\n  the function returns.)\n- `cur.rowcount` after `INSERT ... SELECT` is the number of rows actually\n  inserted. Rows skipped by `ON CONFLICT DO NOTHING` are not counted. That is\n  how the log can say `83 rows, 0 inserted`.\n- `unpersist()` frees the cached batch.\n\n```python\n    done = time.time()\n    log_jsonl(\"batches.jsonl\", {\n        \"batch_id\": batch_id, \"rows\": rows, \"inserted\": inserted,\n        \"skipped_duplicates\": rows - inserted,\n        \"jdbc_ms\": round((staged - started) * 1000), \"merge_ms\": round((done - staged) * 1000),\n        \"at\": time.strftime(\"%Y-%m-%dT%H:%M:%S\")})\n    print(f\"batch {batch_id}: {rows} rows, {inserted} inserted, \"\n          f\"{round(done - started, 1)} s\", flush=True)\n```\n\nOne JSON line per non-empty batch in `metrics/batches.jsonl`, for example the\nnormal and the replayed batch 42:\n\n```json\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 83, \"skipped_duplicates\": 0, \"jdbc_ms\": 1188, \"merge_ms\": 57, \"at\": \"2026-11-04T12:43:27\"}\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83, \"jdbc_ms\": 5875, \"merge_ms\": 125, \"at\": \"2026-11-04T12:45:50\"}\n```\n\n`jdbc_ms` covers count + truncate + JDBC write (about 1.2 s normally, about\n6 s on the first batch after start-up); `merge_ms` is the merge transaction\n(about 55 ms). `log_jsonl` opens the file in append mode (`\"a\"`) and creates\n`metrics/` if needed. **JSON Lines** = one JSON object per line, easy to append\nto and to read back line by line.\n\n## 7. ProgressLogger: Spark's own report\n\n```python\nclass ProgressLogger(StreamingQueryListener):\n    def onQueryStarted(self, event: QueryStartedEvent) -> None:\n        print(f\"query started: id={event.id}\", flush=True)\n\n    def onQueryProgress(self, event: QueryProgressEvent) -> None:\n        p = json.loads(event.progress.json)\n        log_jsonl(\"progress.jsonl\", {\n            \"batch_id\": p[\"batchId\"], \"timestamp\": p[\"timestamp\"],\n            \"num_input_rows\": p[\"numInputRows\"],\n            \"input_rows_per_s\": p.get(\"inputRowsPerSecond\"),\n            \"processed_rows_per_s\": p.get(\"processedRowsPerSecond\"),\n            \"trigger_ms\": p[\"durationMs\"].get(\"triggerExecution\"),\n            \"add_batch_ms\": p[\"durationMs\"].get(\"addBatch\")})\n\n    def onQueryIdle(self, event: QueryIdleEvent) -> None:\n        pass\n\n    def onQueryTerminated(self, event: QueryTerminatedEvent) -> None:\n        print(f\"query stopped: exception={event.exception}\", flush=True)\n```\n\nA **listener** is an object Spark calls when something happens to a query.\n`spark.streams.addListener(ProgressLogger())` in `main()` registers it.\n`onQueryIdle` (called when a trigger finds no new data) does nothing here;\nit is written out so all four events are visible.\n\nAfter each micro-batch Spark builds a **progress report** (the same JSON you\nsee as `query.lastProgress`). We keep six fields:\n\n| Field | Meaning |\n|---|---|\n| `numInputRows` | rows the source handed to this batch |\n| `inputRowsPerSecond` | rows arriving per second since the last batch |\n| `processedRowsPerSecond` | rows ÷ this batch's duration |\n| `durationMs.triggerExecution` | whole batch time, start to end |\n| `durationMs.addBatch` | time spent in the sink, i.e. our `write_batch` |\n\nNote: `numInputRows` is a bit below the rows in the file: 98 for batch 0 of\nrun A, not 100. Spark pushes the `IS NOT NULL` checks down into the CSV\nreader, so rows with an empty `event_time` or `user_id` are dropped before\nbeing counted. These two logs feed `src/perf_report.py` and\n[08 · Performance and tuning](08-performance-and-tuning.md).\n\n`event.id` is the query's permanent id, stored in `checkpoint/events/metadata`.\nEvery restart of this lab printed the same `id=2887773f-...`: same checkpoint,\nsame query.\n\n## 8. main(): starting and stopping the query\n\n```python\n    spark = build_spark()\n    spark.streams.addListener(ProgressLogger())\n    query = (clean(read_stream(spark))\n             .writeStream\n             .queryName(\"events_to_postgres\")\n             .foreachBatch(write_batch)\n             .option(\"checkpointLocation\", CHECKPOINT_DIR)   # which files are done + dedup state\n             .trigger(processingTime=TRIGGER)\n             .start())\n```\n\n| Call | Meaning |\n|---|---|\n| `clean(read_stream(spark))` | source → cleaning plan |\n| `.writeStream` | start describing the output side |\n| `.queryName(...)` | a name, visible in the Spark UI |\n| `.foreachBatch(write_batch)` | the sink is our function |\n| `.option(\"checkpointLocation\", ...)` | where Spark saves progress and state. **This one line is what makes restarts safe** ([06](06-reliability-checkpoints-exactly-once.md)) |\n| `.trigger(processingTime=\"5 seconds\")` | a micro-batch every 5 s |\n| `.start()` | actually start; returns a `StreamingQuery` handle and runs in the background |\n\nOutput mode is not set, so it is the default, **append**.\n\n```python\n    try:\n        if args.run_seconds:\n            query.awaitTermination(args.run_seconds)\n            query.stop()                                     # clean stop: finishes the current batch\n        else:\n            query.awaitTermination()\n    except KeyboardInterrupt:\n        query.stop()\n    spark.stop()\n```\n\n- `awaitTermination()` blocks the main thread while the query runs in the\n  background. With a number, it waits at most that many seconds.\n- `--run-seconds 120` was used in tests so a run ends by itself at a known\n  point. Then `query.stop()` and `spark.stop()` shut down cleanly; the log\n  shows `query stopped: exception=None`.\n- Ctrl+C raises `KeyboardInterrupt`, handled the same way.\n- If a batch is cut short by a stop or a crash, it has no commit file, so\n  it runs again on the next start. Nothing is lost\n  ([06](06-reliability-checkpoints-exactly-once.md#h-crash-before-or-after-the-commit)).\n- On stop, Spark may log `Failed to cancel job group ... Cannot find active\n  jobs for it`. It means there was no running job to cancel. Harmless.\n\n## Self-check\n\n1. Why is every column read as a string first? (So a bad value becomes null\n   at the `try_cast` step, row by row, instead of failing the read.)\n2. Why `try_cast` and not `CAST` on Spark 4? (ANSI mode makes `CAST` raise an\n   error on bad input and stop the query; `try_cast` returns null.)\n3. Why is `event_time` in the `dropDuplicates` key? (With the watermark, it\n   lets Spark tell which stored ids are old enough to forget, so state stays\n   bounded.)\n4. What does `persist()` save in `write_batch`? (Re-reading and re-cleaning\n   the batch for the second action: count, then write.)\n5. How can `batches.jsonl` show `\"rows\": 83, \"inserted\": 0`? (A replayed\n   batch: all 83 `event_id`s were already in `events`, so `ON CONFLICT DO\n   NOTHING` skipped them and `rowcount` was 0.)\n","study/05-postgres-jdbc-and-the-merge.md":"# 05 — PostgreSQL, JDBC and the Merge\n\nThe database side of the pipeline: `postgres_setup.sql` block by block, what\nJDBC is, and why each micro-batch is written in two steps (staging table, then\n`INSERT ... ON CONFLICT DO NOTHING`) instead of one.\n\n> **Help:** how to run the script and fill `.env` is in [01 · Setup](01-setup-postgres-and-spark.md#h-5-create-the-database-role-and-tables). The Python side of the write is in [04 · The streaming job line by line](04-streaming-job-line-by-line.md#h-6-write-batch-the-sink).\n\n## 1. How the script is run\n\n```sql\n-- Run once as a superuser with psql (it uses psql features: -v variables, \\gexec, \\connect):\n--   psql -h localhost -p 5432 -U postgres -v app_password='pick-a-password' -f postgres_setup.sql\n-- Put the same password in .env as PGPASSWORD. Safe to re-run: every step checks first.\n\n\\set ON_ERROR_STOP on\n```\n\nThe file mixes two languages:\n\n- **SQL**, which the server runs (`CREATE TABLE`, `GRANT`...).\n- **psql meta-commands**, which start with a backslash and are handled by the\n  `psql` client itself (`\\set`, `\\gexec`, `\\connect`). They do not work in\n  pgAdmin's Query Tool.\n\n`\\set ON_ERROR_STOP on` makes psql stop at the first error. Without it, psql\nprints the error and carries on with the next statement, which can leave half\na setup behind.\n\n## 2. Creating the database: the \\gexec trick\n\n```sql\nSELECT 'CREATE DATABASE ecommerce'\nWHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'ecommerce')\\gexec\n```\n\n**The problem:** `CREATE TABLE` has `IF NOT EXISTS`, but `CREATE DATABASE`\ndoes not. And `CREATE DATABASE` cannot run inside a function or a `DO` block,\nso the usual \"IF ... THEN CREATE\" code is not possible.\n\n**The trick, read from the inside out:**\n\n1. `pg_database` is a system catalog: a table listing every database.\n2. The `SELECT` returns the **text** `'CREATE DATABASE ecommerce'` as one row,\n   but only if no database of that name exists. Otherwise it returns zero rows.\n3. `\\gexec` (instead of `;`) tells psql: run the query, then **execute each\n   value in the result as an SQL statement**.\n\nSo: database missing → one row → psql runs `CREATE DATABASE ecommerce`.\nDatabase present → no rows → nothing runs. Re-running the script is safe.\n\n## 3. The application role and %L quoting\n\n```sql\nSELECT format('CREATE ROLE spark_app LOGIN PASSWORD %L', :'app_password')\nWHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'spark_app')\\gexec\n```\n\nA **role** is PostgreSQL's word for a user or group. `LOGIN` means it can\nconnect. The pipeline gets its own role so Spark never runs as the\nsuperuser `postgres` (see [§10](#h-10-grants-and-least-privilege)).\n\nSame `\\gexec` pattern, plus two kinds of quoting:\n\n| Piece | Who handles it | Result |\n|---|---|---|\n| `:'app_password'` | **psql**, before sending | replaced by the `-v app_password=...` value as a quoted SQL string: `'pick-a-password'` |\n| `format('... %L', value)` | **the server** | `%L` inserts the value as a correctly quoted *literal*. A password like `it's` becomes `'it''s'` (the inner quote doubled) |\n\n`CREATE ROLE ... PASSWORD` does not accept a query parameter, so the password\nhas to be pasted into the command text. `%L` makes that safe: whatever the\npassword contains, it cannot break out of the string and run other SQL (that\nattack is called *SQL injection*).\n\nBecause of `WHERE NOT EXISTS`, re-running the script with a different password\ndoes **not** change the existing role's password. Use\n`ALTER ROLE spark_app PASSWORD '...';` for that.\n\n## 4. \\connect\n\n```sql\n\\connect ecommerce\n```\n\nEverything so far ran in the default `postgres` database. `\\connect` makes\npsql switch to `ecommerce`, so the tables below are created there. (In\nPostgreSQL a connection belongs to one database; you cannot `USE` another\nlike in MySQL.)\n\n## 5. The events table\n\n```sql\nCREATE TABLE IF NOT EXISTS events (\n    event_id     TEXT PRIMARY KEY,           -- natural key from the generator: makes re-delivery harmless\n    event_time   TIMESTAMPTZ NOT NULL,       -- when the user acted (TIMESTAMPTZ = an absolute instant)\n    user_id      INT NOT NULL CHECK (user_id > 0),\n    session_id   TEXT,\n    event_type   TEXT NOT NULL CHECK (event_type IN ('view', 'add_to_cart', 'purchase')),\n    product_id   INT NOT NULL CHECK (product_id > 0),\n    category     TEXT,\n    price        NUMERIC(10,2) NOT NULL CHECK (price >= 0),\n    quantity     INT CHECK (quantity >= 0),\n    ingested_at  TIMESTAMPTZ NOT NULL DEFAULT now()   -- when the row landed: latency = ingested_at - event_time\n);\n```\n\n| Column | Type | Why this type |\n|---|---|---|\n| `event_id` | `TEXT PRIMARY KEY` | the UUID from the generator. **PRIMARY KEY** = unique and not null, backed by an index. This one line is what makes duplicates impossible |\n| `event_time` | `TIMESTAMPTZ` | an absolute moment ([§6](#h-6-timestamptz-vs-timestamp-the-2-hour-story)) |\n| `user_id`, `product_id`, `quantity` | `INT` | whole numbers, matching Spark's `INT` |\n| `session_id`, `event_type`, `category` | `TEXT` | strings of any length. In PostgreSQL `TEXT` is as fast as `VARCHAR(n)` |\n| `price` | `NUMERIC(10,2)` | exact decimal for money, matching Spark's `DECIMAL(10,2)`. Never use `REAL`/`FLOAT` for money: 0.1 + 0.2 is not exactly 0.3 in floating point |\n| `ingested_at` | `TIMESTAMPTZ DEFAULT now()` | filled by the database when the row is inserted. The merge does not list it, so the default applies |\n\n`now()` is the start time of the current transaction. All rows of one merge\nshare the same `ingested_at`, which is fine: they landed together.\n`ingested_at - event_time` is the end-to-end **latency** used in\n[08 · Performance and tuning](08-performance-and-tuning.md).\n\n## 6. TIMESTAMPTZ vs TIMESTAMP: the +2 hour story\n\nPostgreSQL has two timestamp types:\n\n| Type | Stores | Shown as |\n|---|---|---|\n| `TIMESTAMP` (without time zone) | a wall-clock reading, like a photo of a clock with no idea which city it was in | exactly as stored |\n| `TIMESTAMPTZ` (with time zone) | an **absolute instant** (internally in UTC) | converted to the session's `timezone` setting |\n\n**What happened earlier in the week.** The first version of the table used\nplain `TIMESTAMP`. The generator wrote `10:35:40` UTC; Spark read it as UTC\n(session time zone set to UTC). But the rows in PostgreSQL said `12:35:40`:\ntwo hours later.\n\n**Why.** For a plain `TIMESTAMP` column, the PostgreSQL JDBC driver sends the\nvalue as the wall-clock time **in the JVM's local time zone**. This laptop's\nJVM runs in South Africa time, UTC+2. The instant \"10:35:40 UTC\" is\n\"12:35:40\" on a South African clock, so that is what was stored, with nothing\nto say it was local time. Every latency measured from it would have been\noff by 2 hours.\n\n**The fix.** Make the column `TIMESTAMPTZ`. Now the driver sends an instant\nwith its offset, and PostgreSQL stores the true moment. TC-03 checked it:\n\n```sql\nSET timezone = 'UTC';\nSELECT event_time, price FROM events LIMIT 3;\n-- event_time matches the CSV strings exactly, no 2-hour shift\n```\n\nWithout the `SET`, psql shows the same instants in the server's zone, e.g.\n`2026-11-04 12:35:40.222+02`. The `+02` tells you it is the same moment, just\ndisplayed differently.\n\n**Rule of thumb:** store event times as `TIMESTAMPTZ`, generate them in UTC,\nand set Spark's session time zone to UTC.\n\n## 7. CHECK constraints\n\nA `CHECK (condition)` makes the database refuse any row for which the\ncondition is false. The table repeats the Spark job's rules:\n\n| Spark filter | PostgreSQL constraint |\n|---|---|\n| `user_id > 0` | `user_id INT NOT NULL CHECK (user_id > 0)` |\n| `product_id > 0` | `product_id INT NOT NULL CHECK (product_id > 0)` |\n| `event_type.isin(...)` | `CHECK (event_type IN ('view', 'add_to_cart', 'purchase'))` |\n| `price >= 0` | `price ... NOT NULL CHECK (price >= 0)` |\n| `quantity` null or `>= 0` | `quantity INT CHECK (quantity >= 0)` (a CHECK on null passes) |\n\nWhy say it twice? **Defence in depth.** TC-04 found that the Spark filter let\n27 rows with `user_id = -5` through. The `user_id > 0` and `product_id > 0`\nCHECKs were added in the same fix, so even if a future code change weakens\nthe filter, the database still refuses bad rows. The filter keeps bad rows\nout quietly; the CHECK is the last line that cannot be bypassed.\n\nNote: a CHECK vi
