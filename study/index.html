olation in the merge would fail the whole `INSERT ... SELECT`,\nthe batch would fail, and the job would stop. That is loud, which is right\nfor \"the code has a bug\". The Spark filter is there so this never happens\nin normal running.\n\n## 8. The staging table\n\n```sql\nCREATE TABLE IF NOT EXISTS events_staging (LIKE events INCLUDING DEFAULTS EXCLUDING CONSTRAINTS);\n```\n\n`LIKE events` copies the column names and types. `INCLUDING DEFAULTS` copies\n`DEFAULT now()`. `EXCLUDING CONSTRAINTS` leaves out the CHECKs. No indexes are\ncopied either (that would need `INCLUDING INDEXES`), so there is **no primary\nkey**: the same `event_id` may appear twice in staging. (PostgreSQL always\ncopies `NOT NULL` with `LIKE`; that is harmless because Spark never sends nulls\nin those columns.)\n\nThe comment in the script states the purpose: *so the bulk JDBC insert never\nfails half way; the merge into events applies the rules.* Section 12 explains\nwhy that matters.\n\n## 9. Indexes\n\n```sql\nCREATE INDEX IF NOT EXISTS idx_events_time ON events (event_time);\nCREATE INDEX IF NOT EXISTS idx_events_type ON events (event_type);\n```\n\nAn **index** is a sorted lookup structure that lets PostgreSQL find rows\nwithout reading the whole table. `events` has three:\n\n| Index | Made by | Used for |\n|---|---|---|\n| `events_pkey` on `event_id` | `PRIMARY KEY`, automatically | uniqueness, and the `ON CONFLICT (event_id)` check (it needs a unique index on that column) |\n| `idx_events_time` | the script | reports by time range, `ORDER BY event_time` |\n| `idx_events_type` | the script | reports filtering by `event_type` |\n\nThe cost: every insert also updates three indexes. With merges of 100–10,000\nrows taking 56–145 ms, that cost is small here.\n\n## 10. GRANTs and least privilege\n\n```sql\nGRANT CONNECT ON DATABASE ecommerce TO spark_app;\nGRANT USAGE ON SCHEMA public TO spark_app;\nGRANT SELECT, INSERT ON events TO spark_app;\nGRANT SELECT, INSERT, TRUNCATE ON events_staging TO spark_app;\n```\n\n**Least privilege** = give a program only the rights its job needs.\n\n| Grant | Why `spark_app` needs it |\n|---|---|\n| `CONNECT` on the database | to log in to `ecommerce` |\n| `USAGE` on schema `public` | to see objects inside the schema |\n| `SELECT, INSERT` on `events` | insert via the merge; select for checks and `perf_report.py` |\n| `SELECT, INSERT, TRUNCATE` on `events_staging` | JDBC inserts, the merge reads it, `write_batch` empties it |\n\nWhat it does **not** get: `UPDATE`, `DELETE` or `TRUNCATE` on `events`, and no\nright to create or drop tables. A bug in the job cannot wipe or change stored\nevents. The tables are owned by `postgres`. A side effect: resetting the lab\n(`TRUNCATE events`) must be done as `postgres`\n([01](01-setup-postgres-and-spark.md#h-reset-to-a-clean-slate)).\n\n## 11. What JDBC is\n\n**JDBC** (Java Database Connectivity) is Java's standard way to talk to a\ndatabase. Every database vendor ships a **JDBC driver**: a jar file that\nspeaks that database's network protocol. Spark runs on Java, so its built-in\ndatabase reader and writer use JDBC.\n\nThe pieces in this job:\n\n| Piece | Value |\n|---|---|\n| driver jar | `org.postgresql:postgresql:42.7.4`, fetched by `spark.jars.packages` |\n| driver class | `org.postgresql.Driver` (the `driver` option) |\n| URL | `jdbc:postgresql://localhost:5432/ecommerce` |\n| target | `dbtable = events_staging`, `mode(\"append\")` |\n\nWhen Spark writes a DataFrame through JDBC, each **partition** (piece of the\nDataFrame) opens its own connection and inserts its rows in batches, in its\nown transaction. That is fast, but it is **not all-or-nothing**: if one\npartition fails, others may already have committed.\n\nThe Python side (truncate, merge) uses **psycopg2** instead. It is simpler for\nrunning a few SQL statements from the driver process.\n\n## 12. Why staging + merge, not a plain append\n\nThe simplest sink would be: JDBC-append each batch straight into `events`.\nHere is why that is not good enough.\n\n**Problem 1: replays.** Spark promises *at-least-once* delivery to\n`foreachBatch`: after a crash it may run the same batch again\n([06](06-reliability-checkpoints-exactly-once.md)). A plain append of a\nreplayed batch into `events` hits the primary key: `duplicate key value\nviolates unique constraint \"events_pkey\"`. The batch fails, the query stops,\nthe restart replays the same batch, it fails again. **Stuck for ever.**\nWithout the primary key it would not get stuck; it would silently store\nduplicates. Spark's JDBC writer has no \"skip duplicates\" option.\n\n**Problem 2: partial writes.** As above, a JDBC append is several separate\ntransactions. A failure halfway leaves some of the batch written.\n\n**The two-step design solves both:**\n\n```\nbatch_df ──JDBC append──> events_staging      (no PK, no CHECKs: never fails on content)\n                               │\n                               │  one transaction:\n                               │    INSERT INTO events (...) SELECT ... FROM events_staging\n                               │      ON CONFLICT (event_id) DO NOTHING;\n                               │    TRUNCATE events_staging;\n                               ▼\n                            events             (PK + CHECKs)\n```\n\n```sql\nINSERT INTO events (event_id, event_time, user_id, session_id, event_type, product_id, category, price, quantity)\nSELECT event_id, event_time, user_id, session_id, event_type, product_id, category, price, quantity FROM events_staging\nON CONFLICT (event_id) DO NOTHING\n```\n\n- **`INSERT ... SELECT`** copies rows from one table to another inside the\n  database, in one statement.\n- **`ON CONFLICT (event_id) DO NOTHING`**: for each row, if a row with that\n  `event_id` already exists in `events`, skip it silently instead of\n  raising an error. This is called an **idempotent** write: running it twice\n  has the same effect as running it once.\n- A partial JDBC write only ever reaches staging, and the next attempt starts\n  with `TRUNCATE events_staging`, so leftovers are cleared.\n\nThe proof is TC-05: batch 42 was forced to run twice.\n\n```json\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 83, \"skipped_duplicates\": 0, ...}\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83, ...}\n```\n\nTotal stayed 3,190 and distinct ids stayed 3,190.\n\n## 13. Transactions in write_batch\n\nA **transaction** is a group of statements that succeed or fail as one unit:\neither all of their changes are saved (**commit**) or none are\n(**rollback**). In psycopg2, `with psycopg2.connect(...) as conn:` opens a\ntransaction and commits it at the end of the block, or rolls back if an\nexception escapes.\n\n`write_batch` has two such blocks:\n\n| Block | Statements | Why grouped this way |\n|---|---|---|\n| first | `TRUNCATE events_staging` | clear leftovers before the JDBC load |\n| second | merge + `TRUNCATE events_staging` | the rows enter `events` **and** staging is emptied, together. If the merge fails, staging keeps its rows and nothing reaches `events`; the replay truncates and reloads |\n\nIn PostgreSQL `TRUNCATE` is transactional, so a rollback undoes it too.\n\n## 14. Queries to check the results\n\nOpen psql on the project database:\n\n```powershell\n& \"C:\\Program Files\\PostgreSQL\\18\\bin\\psql.exe\" -h localhost -U spark_app -d ecommerce\n```\n\n```sql\n\\d events                          -- columns, types, CHECKs, indexes\nSET timezone = 'UTC';              -- show times as the generator wrote them\n\n-- Totals and duplicates: the two numbers must be equal\nSELECT count(*) AS total, count(DISTINCT event_id) AS distinct_ids FROM events;\n\n-- Rows breaking any rule: must be 0\nSELECT count(*) FROM events\nWHERE user_id \u003c= 0 OR product_id \u003c= 0 OR price \u003c 0 OR quantity \u003c 0\n   OR event_type NOT IN ('view', 'add_to_cart', 'purchase');\n\n-- Staging must be empty between batches\nSELECT count(*) FROM events_staging;\n\n-- Latest arrivals and their latency\nSELECT event_id, event_time, ingested_at, ingested_at - event_time AS latency\nFROM events ORDER BY ingested_at DESC LIMIT 5;\n\n-- Mix of event types (about 75 / 17 / 8 %)\nSELECT event_type, count(*), round(100.0 * count(*) / sum(count(*)) OVER (), 1) AS pct\nFROM events GROUP BY event_type ORDER BY 2 DESC;\n\n-- Latency percentiles, the way src/perf_report.py computes them\nSELECT percentile_cont(0.5)  WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)) AS p50_s,\n       percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)) AS p95_s\nFROM events;\n```\n\nAfter TC-04's fix these gave 1,615 / 1,615, 0 rule-breakers, and an empty\nstaging table. After TC-08 the total was 3,428, with no duplicates.\n\n## Self-check\n\n1. Why does `CREATE DATABASE` need the `\\gexec` trick? (It has no\n   `IF NOT EXISTS` and cannot run inside a `DO` block; `\\gexec` runs the\n   command text only when the `SELECT` returns a row.)\n2. What does `%L` protect against? (Broken quoting and SQL injection when the\n   password is pasted into the `CREATE ROLE` text.)\n3. Why were times shifted by +2 hours with `TIMESTAMP`? (The JDBC driver\n   wrote the wall-clock time in the JVM's zone, UTC+2; `TIMESTAMPTZ` stores\n   the true instant.)\n4. Why can't the batch be JDBC-appended straight into `events`? (A replay hits\n   the primary key and fails for ever, and a JDBC append is not all-or-nothing.)\n5. Which rights does `spark_app` lack on `events`, and why? (`UPDATE`,\n   `DELETE`, `TRUNCATE`: a bug in the job cannot change or wipe stored data.)\n","study/06-reliability-checkpoints-exactly-once.md":"# 06 — Reliability: Checkpoints, Replays and \"Exactly Once\"\n\nHow the pipeline survives being stopped, killed or cut off from the database\nwithout losing or doubling a single row. This page opens the real\n`checkpoint/events/` folder, follows one micro-batch through it, and ties each\nguarantee to a test that proved it.\n\n> **Help:** the code lines this page refers to are in [04 · The streaming job line by line](04-streaming-job-line-by-line.md), and the merge SQL in [05](05-postgres-jdbc-and-the-merge.md#h-12-why-staging-merge-not-a-plain-append).\n\n## The problem: a job can die at any moment\n\nA streaming job runs for days. In that time it will be stopped for updates,\nthe machine will reboot, the database will be unreachable for a while. For each\nof those, two questions:\n\n1. **Loss**: after a restart, does every row that arrived still get written?\n2. **Duplicates**: does any row get written twice?\n\nA batch job can just be re-run from the start. A streaming job cannot: it has\nto remember exactly **where it was**. Spark keeps that memory in the\n**checkpoint folder**, set by one line:\n\n```python\n.option(\"checkpointLocation\", CHECKPOINT_DIR)   # which files are done + dedup state\n```\n\n## The checkpoint folder, opened up\n\nThis is the real folder after all the tests:\n\n```text\ncheckpoint/events/\n├── metadata            {\"id\":\"2887773f-bc1c-4ad3-b679-05876c549e9a\"}\n├── offsets/            10, 11, ..., 110     one file per batch: what the batch WILL process\n├── commits/            10, 11, ..., 110     one file per batch: the batch is DONE\n├── sources/0/          one file per input file Spark has accepted\n└── state/0/            the de-duplication memory\n    ├── _metadata       {\"operatorName\":\"dedupe\", ... \"numPartitions\":4}\n    ├── 0/ 1/ 2/ 3/     one folder per shuffle partition\n    │     1.delta ... 111.delta, 13.snapshot, 28.snapshot, ...\n```\n\n| Part | What it holds | Real example |\n|---|---|---|\n| `metadata` | the query's permanent id | every restart printed `query started: id=2887773f-...`: same checkpoint, same query |\n| `offsets/N` | written **before** batch N runs: which input it covers, the watermark, key settings | see below |\n| `commits/N` | written **after** batch N's sink (`write_batch`) returned without error | `{\"nextBatchWatermarkMs\":1793788313042}` |\n| `sources/0/K` | the file source's own log: entry K = one accepted file path | `sources/0/40` → `.../events_20261104_124153_042533.csv` |\n| `state/0/p/` | for partition `p`, the `event_id`s seen recently. Each batch writes a `.delta` (changes); every so often a `.snapshot` (full copy) | `state/0/0/41.snapshot` |\n\nWhy only 10 to 110? Spark keeps the last 100 batches of history and deletes\nolder files (setting `spark.sql.streaming.minBatchesToRetain`, default 100).\n\n### Inside offsets/42\n\n```text\nv1\n{\"batchWatermarkMs\":1793788312030,\"batchTimestampMs\":1793789005485,\"conf\":{..., \"spark.sql.shuffle.partitions\":\"4\", ...}}\n{\"logOffset\":40}\n```\n\n| Field | Value | Meaning |\n|---|---|---|\n| `batchWatermarkMs` | 1793788312030 = 10:31:52.030 UTC | the watermark for this batch ([below](#h-watermark-bounded-state)) |\n| `batchTimestampMs` | 1793789005485 = 10:43:25.485 UTC | when the batch was planned (processing time) |\n| `conf` | includes `shuffle.partitions = 4` | settings **frozen** for this checkpoint. The state is split into 4 partitions; changing the setting later has no effect on this checkpoint |\n| `logOffset` | 40 | \"up to and including entry 40 of `sources/0`\". Batch 41 had 39, so batch 42 = exactly one file, entry 40 |\n\nBatch ids and `logOffset` numbers drift apart because some batches read no\nfile. Batches 20, 27, 43 and 47 have the same `logOffset` as the batch before\nthem. Those are **no-data batches**: Spark runs one when the watermark has\nmoved, so the de-duplication step can clear out expired ids even though no new\nfile arrived. (Batch 21 is different: it read the duplicate file in TC-07\nand produced 0 new rows.)\n\n## The life of one micro-batch\n\n```\n 1. list data/incoming, pick up to MAX_FILES new files\n 2. append them to sources/0/K\n 3. write offsets/N                      \u003c- \"I am about to do batch N = these files\"\n 4. read files → clean() → dropDuplicates (reads state version N, writes N+1 delta)\n 5. call write_batch(batch_df, N)        \u003c- staging + merge into PostgreSQL\n 6. write commits/N                      \u003c- \"batch N is finished\"\n```\n\nSteps 3 and 6 are the key. `offsets/` is a **write-ahead log**: the plan is\nsaved before the work starts. `commits/` records completion. On every start,\nSpark compares the two:\n\n| On restart Spark finds... | It does... |\n|---|---|\n| `offsets/N` and `commits/N` | batch N is finished; plan batch N+1 from new files |\n| `offsets/N` but **no** `commits/N` | batch N was interrupted; **run batch N again, with exactly the same files** (read from `offsets/N` and `sources/0`) and the state as it was before N |\n\nThat second row is the whole recovery mechanism.\n\n## At-least-once + idempotent sink = effectively exactly-once\n\nThree delivery guarantees are usually named:\n\n| Guarantee | Meaning |\n|---|---|\n| **at-most-once** | each row is written 0 or 1 times: may lose data, never duplicates |\n| **at-least-once** | each row is written 1 or more times: never loses data, may duplicate |\n| **exactly-once** | each row is written exactly 1 time |\n\nFor `foreachBatch`, Spark gives **at-least-once**: if the job dies after\n`write_batch` finished but before `commits/N` was written, batch N runs\nagain. Spark cannot know that our database already has the rows.\n\nWe turn that into **effectively exactly-once** by making the sink\n**idempotent**: writing the same batch twice leaves the same result as writing\nit once. The recipe has three parts, and the pipeline has all three:\n\n| Ingredient | In this pipeline |\n|---|---|\n| a **replayable source**: the same batch can be re-read exactly | the file source + `offsets/` + `sources/0` say which files batch N was |\n| **deterministic processing**: the same input gives the same output | `clean()` is pure rules; the de-dup state is versioned per batch |\n| an **idempotent sink** keyed on a **stable id** | `INSERT ... ON CONFLICT (event_id) DO NOTHING`, with `event_id` created by the generator |\n\n\"Effectively\" because the batch really is processed twice; only the result in\n`events` is as if it ran once. Side outputs that are not idempotent show the\nsecond run: `metrics/batches.jsonl` has **two** lines for batch 42.\n\n## Crash before or after the commit\n\nWhere exactly the job dies decides what happens next. All cases end with the\nright rows in `events`:\n\n| The job dies... | State left behind | On restart | Tested by |\n|---|---|---|---|\n| before `offsets/N` is written | nothing about N | N is planned from scratch; the files are still \"new\" | (normal restart) |\n| after `offsets/N`, before the merge | maybe some rows in `events_staging` | N re-runs; `TRUNCATE events_staging` clears leftovers; rows inserted once | hard kill (runC/runD) |\n| inside the merge transaction | transaction rolled back; `events` unchanged | N re-runs, inserts everything | covered by the transaction ([05 §13](05-postgres-jdbc-and-the-merge.md#h-13-transactions-in-write-batch)) |\n| after the merge commit, before `commits/N` | rows already in `events` | N re-runs; `ON CONFLICT` skips all of them | TC-05 replay |\n| `write_batch` raises an error (DB down) | `offsets/N`, no `commits/N` | N re-runs when the DB is back | TC-08 |\n| after `commits/N` | N is done | next batch | TC-06 restart |\n\n## Watermark: bounded state\n\n`dropDuplicates` must remember ids it has seen. Kept for ever, that memory\ngrows with every event, and the checkpoint grows with it. The watermark bounds\nit:\n\n```python\n.withWatermark(\"event_time\", \"10 minutes\")\n.dropDuplicates([\"event_id\", \"event_time\"])\n```\n\n> **watermark** = (largest `event_time` seen so far) − 10 minutes\n\nSpark treats anything older than the watermark as \"too late to matter\" and\ndeletes stored ids with an `event_time` below it. Real numbers from the\ncheckpoint:\n\n- Batch 41's file had events up to about `10:41:52.030` UTC.\n- So batch 42's watermark is `10:31:52.030` (`batchWatermarkMs` in\n  `offsets/42`), exactly 10 minutes earlier.\n- After batch 42, `commits/42` says the next watermark is `10:31:53.042`:\n  batch 42's newest event, minus 10 minutes.\n\nIds older than that are forgotten, so the state holds roughly the last 10\nminutes of events, not the whole history.\n\nWhat this means for duplicates:\n\n| Duplicate arrives... | Caught by |\n|---|---|\n| within ~10 minutes (event time) of the original | Spark's `dropDuplicates`: the row never reaches PostgreSQL (TC-07: 98 rows read, 0 passed on) |\n| later than that | the `events` primary key: `ON CONFLICT (event_id) DO NOTHING` skips it |\n\nTwo layers, each covering the other's gap. The 10 minutes is a trade-off:\nlonger = more duplicates caught in Spark, but more state to keep.\n\nThe watermark also affects **late rows**. A row whose `event_time` is already\nbelow the watermark when it arrives is dropped by a stateful operator like\n`dropDuplicates`. In this lab the generator stamps events \"now\", so no row is\never 10 minutes late. In a real system with phones that go offline, you would\nsize the watermark from how late real data arrives.\n\n## The evidence\n\nAll numbers come from `reports/test_cases.md`, `metrics/batches.jsonl` and `reports/logs/`.\n\n### TC-06: a clean restart does not re-read old files\n\nThe job stopped after batch 20 with 20 files in the folder. On restart with\nthe same checkpoint, the first new batch was 21, and batches 22–26 each held\none of the 5 new files. None of the 20 old files was read again: they are\nlisted in `sources/0`.\n\n### TC-07: a duplicated file adds nothing\n\nAn already-processed file was copied to `events_zz_duplicate_copy.csv`. It is a\nnew **path**, so the file source accepted it (batch 21 read 98 rows). Every\n`event_id` was still in the de-dup state, so 0 rows passed on and\n`write_batch` returned early. Total: exactly the expected 2,014.\n\n### Hard kill: the job is killed mid-batch\n\nThe job was killed with `taskkill /F` (no clean shutdown) while the generator\nwrote 15 files. Evidence of the kill in the checkpoint: a 0-byte temporary file\n`state/0/0/.29.delta.ab800ee7-....TID1.tmp`, the state write of batch 28 that\nnever finished. Its log (`runC_job.log`) has no `batch` line at all.\n\nOn restart (`runD_job.log`) Spark found `offsets/28` without `commits/28` and\nbegan with batch 28: `78 rows, 78 inserted`. Batches 28 to 42 then took the\n15 files. Their rows add up to 1,176, which is exactly 1,500 generated − 324\nspoiled. Total `count = count(DISTINCT event_id) = 3,190`. Nothing lost,\nnothing doubled.\n\n### TC-05: forced replay of a finished batch\n\nThis is the \"died after the merge, before the commit\" case, the one the\nidempotent sink exists for. It cannot be timed by hand, so it was created\n(in a test environment only):\n\n1. Stop the job. `events` has 3,190 rows, batch 42 (83 rows) written and\n   committed.\n2. Delete `checkpoint/events/commits/42`, plus empty batch 43's offset and\n   commit files, so 42 is the last batch and looks unfinished.\n3. Start the job.\n\n```json\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83, ...}\n```\n\nSpark re-ran batch 42 with the same 83 rows; the merge skipped all 83. Total\nstill 3,190, distinct ids 3,190.\n\n### TC-08: database unreachable\n\nWith `PGPORT=5499` (nothing listening), the first `psycopg2.connect` in\n`write_batch` raised `Connection refused`. The error left `write_batch`, so\nSpark did **not** write the commit. The query stopped (exit code 1) with\n`offsets/44` and no `commits/44`. Restarted with the right port, batch 44\nre-ran (`80 rows, 80 inserted`), then 45 and 46. 300 rows − 62 spoiled = 238\n= 80 + 82 + 76. Total 3,428, no duplicates.\n\nNote the job **stops** when the database is down; it does not wait and retry.\nSomething outside (a person, a service manager) must restart it. No data is\nlost meanwhile: the files wait in the folder.\n\n## Rules for not breaking the checkpoint\n\n- **One checkpoint per query, one query per checkpoint.** Two jobs on one\n  checkpoint folder corrupt each other's logs.\n- **Do not edit or delete checkpoint files** in a real system. TC-05 did it on\n  purpose, in a test setup, to create a replay.\n- **Delete the checkpoint only as part of a full reset** (with the input files\n  and the table, see [01](01-setup-postgres-and-spark.md#h-reset-to-a-clean-slate)).\n  A fresh checkpoint treats every file in the folder as new.\n- **Changing the query can make an old checkpoint unusable.** Adding a\n  filter rule is fine. Changing the de-dup key, the watermark column or the\n  number of shuffle partitions changes the stored state's layout; then you need\n  a new checkpoint.\n- Keep input files until their batch is committed. Deleting a file that is\n  in an uncommitted `offsets/N` breaks the replay.\n\n## Self-check\n\n1. What is the difference between `offsets/N` and `commits/N`? (`offsets` is\n   written before the batch runs, recording its input; `commits` after the\n   sink succeeded.)\n2. Spark finds `offsets/44` but no `commits/44`. What does it do? (Re-runs\n   batch 44 with the same files and the pre-44 state.)\n3. Why is the pipeline \"effectively\" exactly-once and not just exactly-once?\n   (Spark may run a batch twice; the idempotent merge makes the second run\n   change nothing in `events`.)\n4. A duplicate file arrives 30 minutes after the original. What stops it?\n   (The watermark has let the ids go from Spark's state; the primary key with\n   `ON CONFLICT DO NOTHING` skips them.)\n5. Why are batches 20, 27, 43 and 47 missing from `batches.jsonl`? (No-data\n   batches: no new file, run so the watermark can clear old state; `rows == 0`,\n   so nothing is logged.)\n","study/07-testing-the-pipeline.md":"# 07 — Testing the Pipeline\n\nHow a streaming pipeline is tested by hand: deciding the exact expected\nresult before running, the commands used for each test case, the bug one test\nfound, the tricks for forcing rare failures, and what was not tested.\n\n> **Help:** the official test plan with expected vs actual for each case is [../reports/test_cases.md](../reports/test_cases.md). This page explains *how* and *why* those tests were done. How to run the project is in [../user_guide.md](../reports/user_guide.md).\n\n## What makes a pipeline testable\n\nA pipeline test asks: \"I put X in. Did exactly Y come out?\" Three things make\nthat answerable:\n\n| Need | How this lab provides it |\n|---|---|\n| **A known input** | the generator, with a fixed `--seed`, a fixed number of files and rows, and a printed count of spoiled rows |\n| **An exact expected output** | every spoiled row breaks a rule, so expected = generated − spoiled ([03](03-generator-line-by-line.md#h-3-spoil-bad-data-on-purpose)) |\n| **Observability**: you can see what happened inside | one `batch N: rows, inserted` line per batch, `metrics/batches.jsonl`, `metrics/progress.jsonl`, the checkpoint folder, and SQL counts |\n\nEvery run's console output was saved to a log file for evidence:\n\n```bash\npython spark_streaming_to_postgres.py --run-seconds 120 > reports/logs/runA_job.log 2>&1\npython data_generator.py --rows 100 --every 2 --batches 20 --bad-rate 0.2 --seed 42 > reports/logs/runA_gen.log\n```\n\n`> file` sends normal output to the file; `2>&1` sends errors to the same\nplace. Spark writes its warnings to the error stream, so without `2>&1` the\nlog would miss them. `--run-seconds` makes the job stop by itself, so a test\nhas a clear end.\n\n## Deriving exact expected counts\n\n\"Roughly 80% of rows arrived\" is not a test. A test needs one number.\n\n**Step 1: add up the spoiled rows the generator printed.**\n\n```text\nevents_20261104_123540_223838.csv: 100 rows (13 spoiled)\nevents_20261104_123542_229546.csv: 100 rows (19 spoiled)\n...\nevents_20261104_123618_410723.csv: 100 rows (26 spoiled)\ndone: 20 files, 2000 rows\n```\n\n```powershell\nSelect-String '\\((\\d+) spoiled\\)' logs\\runA_gen.log |\n    ForEach-Object { [int]$_.Matches[0].Groups[1].Value } | Measure-Object -Sum\n# Sum : 385\n```\n\n**Step 2: expected rows = 2,000 − 385 = 1,615.**\n\n**Step 3: compare with three independent views.**\n\n```sql\n-- PostgreSQL: what landed\nSELECT count(*), count(DISTINCT event_id) FROM events;      -- 1615 | 1615\n```\n\n```powershell\n# The job's own log: sum of \"rows\" in batches.jsonl\npython -c \"import json; print(sum(json.loads(l)['rows'] for l in open('metrics/batches.jsonl')))\"\n```\n\nIf all three agree with the number you worked out **before** the run, the\ntest passes. If not, the difference itself is a clue (27 extra rows, below).\n\nThe same method gave every other expected total:\n\n| Run | Generated | Spoiled | Expected new rows | Running total |\n|---|---|---|---|---|\n| A (TC-04) | 2,000 | 385 | 1,615 | 1,615 |\n| B (TC-06/07) | 500 + a duplicate file | 101 | 399 | 2,014 |\n| C/D (hard kill) | 1,500 | 324 | 1,176 | 3,190 |\n| E (TC-05 replay) | 0 | 0 | 0 | 3,190 |\n| F/G (TC-08) | 300 | 62 | 238 | 3,428 |\n\nDo not use `numInputRows` from `progress.jsonl` for this check. It is\nslightly lower than the rows in the files (98 for a 100-row file) because\nSpark drops rows with an empty `event_time` or `user_id` inside the CSV reader,\nbefore counting.\n\n## The tests, one by one\n\nAll tests ran with trigger 5 s and `MAX_FILES=1` unless stated, starting from\nthe reset in [01](01-setup-postgres-and-spark.md#h-reset-to-a-clean-slate)\nwhere the test says \"empty\".\n\n### TC-01: the generator writes complete files\n\n```powershell\npython data_generator.py --rows 100 --every 2 --batches 20 --bad-rate 0.2 --seed 42\n(Get-ChildItem data\\incoming -Filter 'events_*.csv').Count          # 20\n(Get-ChildItem data\\incoming -Force -Filter '_*').Count             # 0: no temp files left\n(Get-Content data\\incoming\\events_20261104_123540_223838.csv).Count  # 101 = header + 100\n```\n\nResult: 20 files, header + 100 rows each, 0 leftover `_` files.\n\n### TC-02: Spark picks up each new file\n\nStart the job first, then the generator. Watch the console. Expected: one\nbatch per file. Actual: batches 0–19, 74–87 valid rows each, 20 lines in\n`batches.jsonl`.\n\n### TC-03: types are right in PostgreSQL\n\n```sql\n\\d events\nSET timezone = 'UTC';\nSELECT event_time, price FROM events LIMIT 3;\n```\n\n`event_time` is `timestamp with time zone`, `price` is `numeric(10,2)`, and\ntimes match the CSV text exactly. This test exists because of the earlier\n+2 hour bug ([05](05-postgres-jdbc-and-the-merge.md#h-6-timestamptz-vs-timestamp-the-2-hour-story)).\n\n### TC-04: dirty rows rejected, clean rows all arrive\n\nExpected 1,615 rows and 0 rule-breakers. Story below.\n\n### TC-05: a replayed batch adds no duplicates\n\nForces a re-run of a finished batch (the replay trick, below). Result:\n`{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83}`,\ntotal unchanged at 3,190.\n\n### TC-06: a restart does not re-read old files\n\n```powershell\npython spark_streaming_to_postgres.py --run-seconds 120     # same checkpoint as TC-04\npython data_generator.py --rows 100 --every 2 --batches 5 --bad-rate 0.2\n```\n\nBatch numbers continued (21, then 22–26 for the 5 new files). None of the 20\nold files was read again.\n\n### TC-07: a duplicated input file adds no rows\n\nWhile the job ran, an already-processed file was copied in, using the same\n`_`-then-rename trick as the generator so Spark never saw a half-copied file:\n\n```powershell\nCopy-Item data\\incoming\\events_20261104_123540_223838.csv data\\incoming\\_events_zz_duplicate_copy.csv\nRename-Item data\\incoming\\_events_zz_duplicate_copy.csv events_zz_duplicate_copy.csv\n```\n\nBatch 21 read 98 rows and passed 0 on. Total exactly 2,014. The in-stream\n`dropDuplicates` caught it; the primary key would have caught it otherwise.\n\n### Hard kill (part of TC-05's evidence)\n\n```powershell\n# while the generator writes 15 files (100 rows every 1 s, bad-rate 0.2)\nGet-Process java                          # find the Spark JVM's process id\ntaskkill /F /T /PID \u003cpid>                 # /F = force, no clean shutdown\npython spark_streaming_to_postgres.py --run-seconds 120   # restart\n```\n\nThe restart began with the interrupted batch 28 and took all 15 files: 1,176\nrows, exactly 1,500 − 324. No duplicates. Details in\n[06](06-reliability-checkpoints-exactly-once.md#h-hard-kill-the-job-is-killed-mid-batch).\n\n### TC-08: database unreachable\n\nDescribed below under \"Simulating a database outage\".\n\n### TC-09: throughput keeps up\n\nThree 2-minute runs (P1, P2, P3) with their own input folder and checkpoint.\nP1 (50 rows/s, `MAX_FILES=1`) fell behind; P2 and P3 kept up. The numbers and\nwhy are in [08 · Performance and tuning](08-performance-and-tuning.md). A\n\"Fail at one setting\" result is still a useful result: it shows where the\nlimit is and which knob moves it.\n\n## TC-04: the test that found a real bug\n\n**First run: 1,642 rows. Expected 1,615. 27 too many.**\n\nThe difference is the clue. 27 rows got through that should not have. Which\nrule did they break?\n\n```sql\nSELECT count(*) FROM events\nWHERE user_id \u003c= 0 OR product_id \u003c= 0 OR price \u003c 0 OR quantity \u003c 0\n   OR event_type NOT IN ('view', 'add_to_cart', 'purchase');     -- 27\n\nSELECT user_id, count(*) FROM events WHERE user_id \u003c= 0 GROUP BY user_id;\n-- -5 | 27\n```\n\nAll 27 had `user_id = -5`. A quick sanity check: of 385 spoiled rows, about\n1 in 4 hit `user_id` and about 1 in 4 of those got `\"-5\"`, so roughly\n385 ÷ 16 ≈ 24 are expected. 27 fits.\n\n**Cause.** The filter said:\n\n```python\nF.col(\"user_id\").isNotNull()\n```\n\nThe text `\"-5\"` passes `try_cast(user_id AS INT)` as the valid integer -5. It\nis not null, so the rule passed it. The other bad values (`\"\"`, `unknown`,\n`NaN`) become null and were caught; that is why only 27 rows leaked and not\nall spoiled `user_id`s. And the same `\"-5\"` in `price` *was* caught, because\n`price >= 0` was already a range check.\n\n**Fix, in two places.**\n\n```python\n& (F.col(\"user_id\") > 0)        # \"> 0\" also rejects null; \"-5\" casts to a valid INT\n& (F.col(\"product_id\") > 0)\n```\n\n```sql\nuser_id    INT NOT NULL CHECK (user_id > 0),\nproduct_id INT NOT NULL CHECK (product_id > 0),\n```\n\nThe Spark filter keeps bad rows out; the database `CHECK` refuses them even\nif a future code change breaks the filter.\n\n**Re-run with the same seed: 1,615 rows**, 1,615 distinct ids, 0\nrule-breakers, `events_staging` empty. The generator logs of the two runs show\nidentical spoiled counts file by file, so the only change was the fix. The\nbuggy run is kept in `reports/logs/bug_run/` (its `batches.jsonl` adds up to 1,642).\n\n**Lessons.**\n\n1. **\"Not null\" is not \"valid\".** A value can be present, of the right type,\n   and still wrong. Write the rule the business means (`id > 0`), not the\n   rule the type system gives you for free.\n2. **Exact counts catch quiet bugs.** Nothing crashed. Every batch printed\n   `N rows, N inserted`. Only the comparison with a number worked out in\n   advance showed the problem. A test that checks \"some rows arrived\" would\n   have passed.\n3. **Keep the failed run.** A test plan that shows \"Failed first, then Pass\"\n   with the evidence is more convincing than a page of passes.\n4. **Fix the class, not the instance.** The bug was in `user_id`, but\n   `product_id` had the same weakness (the generator never spoils it, so no\n   test would show it). Both got the fix.\n\n## The replay trick\n\nThe most important failure (dying after the merge but before Spark's commit)\nlasts a few milliseconds. You cannot hit it by pressing Ctrl+C at the right\nmoment. So it was **created** by editing the checkpoint:\n\n```powershell\n# 1. stop the job cleanly; note the last batch with data (42, 83 rows)\n# 2. make batch 42 look unfinished\nRemove-Item checkpoint\\events\\commits\\42\n# batch 43 was an empty no-data batch after 42; remove it so 42 is the latest\nRemove-Item checkpoint\\events\\offsets\\43, checkpoint\\events\\commits\\43\n# 3. start the job again\npython spark_streaming_to_postgres.py --run-seconds 60 > reports/logs/runE_replay_job.log 2>&1\n```\n\nOn start, Spark found `offsets/42` without `commits/42` and re-ran batch 42,\nexactly as after a real crash in that window. The log line\n`batch 42: 83 rows, 0 inserted` is the proof that the merge is idempotent.\n\n**Only in a test environment.** Hand-editing a production checkpoint can lose\nor duplicate data. Here it was safe because the expected result was known and\nthe whole state could be reset.\n\n## Simulating a database outage safely\n\nThe PostgreSQL service on this laptop is shared with other projects. Stopping\nit needs admin rights and would cut off everything else using it. The job,\nthough, only sees \"I could not connect\". So the outage was simulated by\npointing **only this job** at a port where nothing listens:\n\n```bash\n# Git Bash: the variable applies to this one command\nPGPORT=5499 python spark_streaming_to_postgres.py > reports/logs/runF_dbdown_job.log 2>&1\n```\n\n```powershell\n# PowerShell equivalent\n$env:PGPORT = \"5499\"; python spark_streaming_to_postgres.py; Remove-Item Env:PGPORT\n```\n\n`load_dotenv()` does not overwrite a variable that is already set, so 5499\nwins over `.env`'s 5432.\n\nResult: `psycopg2.OperationalError: connection to server at \"localhost\" ...\nport 5499 failed: Connection refused`, the query stopped, exit code 1. The\ncheckpoint had `offsets/44` and no `commits/44`. Restarted with normal\nsettings, batches 44, 45, 46 wrote 80 + 82 + 76 = 238 rows = 300 − 62. Total\n3,428, no duplicates.\n\nWhat this does **not** reproduce: a server that goes away **during** a batch\n(mid-JDBC write or mid-merge). The design should handle it (staging is\ntruncated on retry, the merge is one transaction), but it was not shown.\n\n## What was not tested\n\nBe ready to say this in review. Knowing the limits is part of testing.\n\n| Not tested | Why it matters | How you would test it |\n|---|---|---|\n| **Long runs** (hours, days) | state and checkpoint size over time; a folder with thousands of files makes each listing slower; the `events` table and its indexes grow | run for a day at a steady rate; watch `state/` size, batch duration and latency for drift |\n| **A real outage of the Windows service** | a stop during a write, dropped connections mid-transaction, the time the service takes to come back | in a private PostgreSQL (e.g. a Docker container), stop it mid-run with `pg_ctl stop -m immediate` |\n| **Multiple writers** | two copies of the job share `events_staging`: one's `TRUNCATE` would wipe the other's staged rows. Two jobs on one checkpoint corrupt it | run two jobs with separate checkpoints and see it fail; fix with one staging table per job or a temp table per batch |\n| **Late data beyond the watermark** | rows more than 10 minutes late are dropped by the stateful step | generate files with old `event_time`s |\n| **Malformed files** | wrong column count, broken quotes, a different header | hand-made bad CSVs; check nothing crashes and what is dropped |\n| **Automatic restart** | after TC-08 the job stays stopped until someone starts it | a service manager or scheduler with restart-on-failure |\n\n## Self-check\n\n1. How was the expected count 1,615 obtained before the run? (2,000 rows\n   generated − 385 spoiled, summed from the generator's printed counts; every\n   spoil breaks a rule.)\n2. Why did 27 rows with `user_id = -5` pass the first version? (`\"-5\"` casts\n   to a valid INT and the rule only checked `IS NOT NULL`.)\n3. Why delete `commits/42` instead of killing the job at the right moment?\n   (The after-merge, before-commit window is milliseconds long; editing the\n   checkpoint creates it on demand.)\n4. Why was the database \"taken down\" with a wrong port? (The service is shared;\n   a wrong port gives the job the same connection error without affecting\n   anyone else.)\n5. Name one thing a two-copy deployment of this job would break. (The shared\n   `events_staging`: one job's `TRUNCATE` deletes the other's staged rows.)\n","study/08-performance-and-tuning.md":"# 08 — Performance and Tuning\n\nThis page explains what the numbers in `reports/performance_metrics.md` mean, where\neach one comes from, why run P1 fell behind and P2 did not, and which\nsettings change the result. Every number here comes from the real runs on\n4 November 2026.\n\n> **Help:** if \"micro-batch\" or \"trigger\" is still new, read [02 · Batch vs streaming](02-batch-vs-streaming.md) first. The code being measured is explained in [04 · The streaming job line by line](04-streaming-job-line-by-line.md).\n\n## 1. Three words: latency, throughput, batch duration\n\n| Word | Plain meaning | Unit | In this project |\n|---|---|---|---|\n| **Latency** | How long one event waits between happening and being queryable | seconds | `ingested_at − event_time` for each row in `events` |\n| **Throughput** | How many rows the system moves per second | rows/s | rows landed ÷ seconds of the run |\n| **Batch duration** | How long Spark takes to finish one micro-batch | ms | `triggerExecution` in Spark's progress report |\n\nAn analogy: a bus stop. **Batch duration** is how long the bus takes to\nload and drive. The **trigger** is how often a bus leaves. **Throughput**\nis passengers moved per hour. **Latency** is how long one passenger\nwaited at the stop plus the ride.\n\nTwo more words you need:\n\n- **Input rate.** How fast data arrives. Here it is set by the generator:\n  `--rows` ÷ `--every`. `--rows 100 --every 2` is 50 rows/s.\n- **Backlog.** Files that have arrived but are not processed yet. If the\n  backlog grows, latency grows with it. This is called **falling behind**.\n\nThe rule that matters most: a streaming job **keeps up** only if it can\nprocess data at least as fast as data arrives. If not, the backlog grows\nforever, no matter how fast each single batch is.\n\n## 2. Where each number comes from\n\nThere are three sources. Each one sees a different part of the pipeline.\n\n| Source | Written by | Sees |\n|---|---|---|\n| `metrics/progress.jsonl` | `ProgressLogger` (a Spark listener) | Spark's view: rows read, batch duration |\n| `metrics/batches.jsonl` | `write_batch()` | The database writes inside each batch |\n| `events.ingested_at` | PostgreSQL `DEFAULT now()` | The end-to-end view: event to row |\n\n### Spark's progress report (the listener)\n\nA **listener** is a class whose methods Spark calls when something\nhappens. `ProgressLogger` extends `StreamingQueryListener`. After every\nmicro-batch Spark calls `onQueryProgress(event)`, and `event.progress.json`\nholds a JSON report. The job keeps six fields of it:\n\n```python\ndef onQueryProgress(self, event: QueryProgressEvent) -> None:\n    p = json.loads(event.progress.json)\n    log_jsonl(\"progress.jsonl\", {\n        \"batch_id\": p[\"batchId\"], \"timestamp\": p[\"timestamp\"],\n        \"num_input_rows\": p[\"numInputRows\"],\n        \"input_rows_per_s\": p.get(\"inputRowsPerSecond\"),\n        \"processed_rows_per_s\": p.get(\"processedRowsPerSecond\"),\n        \"trigger_ms\": p[\"durationMs\"].get(\"triggerExecution\"),\n        \"add_batch_ms\": p[\"durationMs\"].get(\"addBatch\")})\n```\n\n| Spark field | Logged as | What it measures |\n|---|---|---|\n| `batchId` | `batch_id` | The micro-batch number (0, 1, 2 ...). Continues across restarts with the same checkpoint |\n| `timestamp` | `timestamp` | When the trigger fired, in **UTC** (`2026-11-04T10:49:55.005Z`) |\n| `numInputRows` | `num_input_rows` | Rows the source handed to the query in this batch |\n| `inputRowsPerSecond` | `input_rows_per_s` | `numInputRows` ÷ seconds since the *previous* batch started. How fast data came in |\n| `processedRowsPerSecond` | `processed_rows_per_s` | `numInputRows` ÷ this batch's duration. How fast Spark worked |\n| `durationMs.triggerExecution` | `trigger_ms` | The whole batch: list files, plan, run, write, commit the checkpoint |\n| `durationMs.addBatch` | `add_batch_ms` | Only the sink part: the time spent inside `write_batch()` |\n\nA real P1 line:\n\n```json\n{\"batch_id\": 60, \"timestamp\": \"2026-11-04T10:51:00.006Z\", \"num_input_rows\": 100,\n \"input_rows_per_s\": 20.0, \"processed_rows_per_s\": 36.6, \"trigger_ms\": 2734, \"add_batch_ms\": 1359}\n```\n\nRead it as: 100 rows arrived in this batch. They came in at 20 rows/s\n(one 100-row file per 5 s trigger). Spark could have handled 36.6 rows/s\nat this batch size. The whole batch took 2.7 s; 1.4 s of that was the\ndatabase write. The other ~1.4 s is Spark's own work: listing the folder,\nplanning, the deduplication state, and writing the checkpoint.\n\n**Gotcha: `processedRowsPerSecond` is not capacity.** It divides by the\nbatch duration, which is mostly fixed cost (section 4). With 100 rows a\nbatch it says 35 rows/s; with 10,000 rows it says 2,495 rows/s. Same\nmachine, same code.\n\n**Gotcha: `numInputRows` is a little below rows written.** In P2 the\ngenerator wrote 6,000 rows and Spark counted 5,984. Spark pushes the\n\"is not null\" part of the filter down into the CSV reader, so rows with an\nempty `event_id`, `event_time` or `user_id` are dropped before they are\ncounted. See [09 · Filter pushdown](09-hard-concepts-explained.md#h-15-filter-pushdown-and-why-numinputrows-is-low).\n\n### The per-batch log (`batches.jsonl`)\n\n`write_batch()` times its own two steps and appends one line per non-empty\nbatch:\n\n```json\n{\"batch_id\": 42, \"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83,\n \"jdbc_ms\": 5875, \"merge_ms\": 125, \"at\": \"2026-11-04T12:45:50\"}\n```\n\nThat is the forced replay of batch 42 (TC-05). The same batch appears\nearlier in the file with `\"inserted\": 83` from its first run.\n\n| Field | Meaning |\n|---|---|\n| `rows` | Valid rows in the batch, after cleaning and `dropDuplicates` (`batch_df.count()`) |\n| `inserted` | `cur.rowcount` of the merge: rows that were new to `events` |\n| `skipped_duplicates` | `rows − inserted`: rows whose `event_id` was already in `events` |\n| `jdbc_ms` | From the start of `write_batch` to the end of the JDBC append. Includes the `count()` and the first `TRUNCATE` |\n| `merge_ms` | The `INSERT ... ON CONFLICT` plus the second `TRUNCATE` |\n| `at` | **Local** time (UTC+2 here), not UTC. `progress.jsonl` uses UTC. Do not mix them up |\n\nMedians over all 145 lines: `jdbc_ms` 1,192 ms, `merge_ms` 57 ms. The JDBC\nappend is the slow step, not the SQL merge.\n\nEmpty batches are not in this file: `write_batch` returns early when\n`rows == 0`. That is why the duplicated file in TC-07 left no line.\n\nThe console line `batch 60: 100 rows, 100 inserted, 1.3 s` is the same\ntiming (`done − started`). Some of these lines are missing in the saved\n`reports/logs/*_job.log` files because Spark's `[Stage 1:> (0 + 4) / 4]` progress\nbar overwrote them. `batches.jsonl` has every batch.\n\n### The latency query in `perf_report.py`, line by line\n\n```sql\nSELECT count(*),\n       percentile_cont(0.5)  WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)),\n       percentile_cont(0.95) WITHIN GROUP (ORDER BY extract(epoch FROM ingested_at - event_time)),\n       max(extract(epoch FROM ingested_at - event_time)),\n       count(*) / greatest(extract(epoch FROM max(ingested_at) - min(ingested_at)), 1)\nFROM events WHERE ingested_at BETWEEN %s AND %s\n```\n\n| Piece | What it does |\n|---|---|\n| `ingested_at - event_time` | Subtracting two `TIMESTAMPTZ` values gives an `interval`, e.g. `00:00:05.4` |\n| `extract(epoch FROM \u003cinterval>)` | Turns the interval into a number of seconds (`5.4`), so it can be sorted and averaged |\n| `percentile_cont(0.5) WITHIN GROUP (ORDER BY x)` | Sorts all `x` values and returns the value halfway up: the **median**, or **p50**. \"cont\" (continuous) means it interpolates between the two middle values if needed |\n| `percentile_cont(0.95) ...` | The value 95% of the way up: **p95**. Only 5% of rows waited longer |\n| `max(...)` | The single worst row |\n| `max(ingested_at) - min(ingested_at)` | How long rows kept landing, first to last |\n| `greatest(..., 1)` | At least 1 second, so a run with one batch does not divide by zero |\n| `count(*) / ...` | **Landed rows/s**: the real end-to-end throughput |\n| `WHERE ingested_at BETWEEN %s AND %s` | Only rows that landed during this run. `%s` are psycopg2 parameters filled from `--since`/`--until` |\n\nWhy p50 and p95 and not the average? An average hides the tail. In P1 the\naverage would look \"medium\" while the last files waited almost 2 minutes.\np95 tells you what the unlucky users see.\n\nWhy `ingested_at` and not Spark's numbers? Spark only knows when a batch\nstarted. It does not know how long a file sat in the folder before the\nbatch picked it up. `ingested_at − event_time` covers the whole path:\ngenerator, folder, waiting, Spark, JDBC, merge.\n\n## 3. The P1 / P2 / P3 story\n\n| Run | Input | Trigger | `MAX_FILES` | Batches | Mean batch | Spark rows/s | Landed rows/s | Latency p50 / p95 / max |\n|---|---|---|---|---|---|---|---|---|\n| **P1** | 50 rows/s (100 every 2 s) | 5 s | 1 | 36 | 3,037 ms | 35 | **20.5** | 62.7 / 113.2 / 116.4 s |\n| **P2** | 50 rows/s (100 every 2 s) | 5 s | 5 | 24 | 3,306 ms | 84 | 53.3 | **5.4 / 13.4** / 15.4 s |\n| **P3** | 1,000 rows/s (1,000 every 1 s) | 10 s | 10 | 15 | 3,746 ms | 2,495 | 902.1 | 16.6 / 21.9 / 22.6 s |\n\n### P1: the queue arithmetic\n\nThink of files as people in a queue.\n\n- **Arrivals:** the generator writes 1 file every 2 s, so **0.5 files/s**.\n- **Service:** the job takes at most `MAX_FILES = 1` file per trigger, and\n  a trigger fires every 5 s, so at most **0.2 files/s**.\n- **Ratio:** 0.5 ÷ 0.2 = **2.5 files arrive for every file processed.**\n- **Growth:** the queue grows by 0.5 − 0.2 = 0.3 files every second.\n\nCheck against the logs: the generator wrote 60 files\n(`reports/logs/perf_P1_gen.log`: `done: 60 files, 6000 rows`). The job ran 36\nbatches of one file each (batches 48 to 83). **24 files were still\nwaiting** when it stopped. Landed rows/s was 20.5, almost exactly the\nceiling of 100 rows ÷ 5 s = 20 rows/s.\n\nThe important part: **the machine was not the limit.** Each batch took\nabout 3 s of its 5 s slot. The job was idle 40% of the time while files\npiled up. The cap on files per batch was the limit, not the CPU.\n\nLatency shows it too. Each new file joined the back of a longer queue, so\nlatency climbed steadily: p50 62.7 s, max 116.4 s.\n\n**The warning that did not help.** Spark printed\n`Current batch is falling behind. The trigger interval is 5000 milliseconds, but spent 11031 milliseconds`\nonce, for the slow first batch. It never printed it again, because every\nlater batch finished inside 5 s. The warning is about **one batch being\nslower than the trigger**, not about the backlog. Watch latency or the\ncount of waiting files instead.\n\n### P2: one setting fixes it\n\nSame load, same trigger, but `MAX_FILES=5`. Service capacity is now\n5 files per 5 s = **1 file/s**, twice the arrival rate. Each batch simply\ntakes whatever arrived since the last one: the batch sizes in\n`progress.jsonl` alternate between ~200 and ~300 rows (2 or 3 files). The\nqueue never builds.\n\np50 latency fell from 62.7 s to **5.4 s**. That is close to the floor for\nthis design:\n\n```\nexpected p50  ≈  half a trigger interval  +  one batch duration\n              ≈  5 s / 2                  +  ~2.8 s (median trigger_ms)\n              ≈  5.3 s                       (measured: 5.4 s)\n```\n\nA file waits on average half a trigger for the next batch to start, then\nthe batch takes ~3 s. Rows landed: 5,876. The generator spoiled 124 of\n6,000 rows, and 6,000 − 124 = 5,876. Nothing lost.\n\n### P3: 20 times the load\n\n1,000 rows every second, `MAX_FILES=10`, trigger 10 s. The job kept up:\n902 rows/s landed, batches of ~9,000 to 10,000 rows, mean batch 3.7 s.\n\nIts p50 latency, 16.6 s, is higher than the formula predicts\n(10 s / 2 + ~3.1 s ≈ 8 s). The checkpoint shows why. The file log\n`checkpoint/perf_P3/sources/0/5` lists the files batch 5 read: exactly 10,\nwritten between 11:07:00 and 11:07:09 UTC. Batch 5 started at 11:07:20, so\nten newer files (11:07:10 to 11:07:19) were already on disk and had to wait\nfor batch 6. The per-batch latency query below shows the same thing: the\nbatch that landed at 11:07:22.6 held events from 11:07:00.0 to 11:07:09.6.\n\n```sql\nSET timezone = 'UTC';\nSELECT ingested_at, count(*),\n       round(min(extract(epoch FROM ingested_at - event_time))::numeric, 1) AS min_s,\n       round(max(extract(epoch FROM ingested_at - event_time))::numeric, 1) AS max_s\nFROM events\nWHERE ingested_at BETWEEN '2026-11-04 11:06:00+00' AND '2026-11-04 11:09:30+00'\nGROUP BY 1 ORDER BY 1;\n--  2026-11-04 11:07:22.604787+00 |  9785 | 13.0 | 22.6\n```\n\nThe generator wrote one file about every 1.05 s (it sleeps 1 s, plus the\ntime to write 1,000 rows), so about 9.5 files per 10 s. The cap of 10 files\nper batch leaves only ~5% spare capacity, and a whole trigger's worth of\nfiles kept waiting one extra round. Spark's file source also keeps the\nunread rest of a folder listing in memory and serves the next batch from\nit instead of listing again. The file counts per batch in\n`checkpoint/perf_P3/sources/0/` follow that pattern: 3, 10, 2, 10, 6, 10,\n9, 10. Each \"short\" batch (2, 6, 9 files) is the leftover of the listing\nbefore it, even though newer files were already on disk. This is a reading of the checkpoint files,\nnot a tested fix. The likely fix is more headroom, for example\n`MAX_FILES=20`. A good follow-up run.\n\n## 4. Fixed cost vs per-row cost\n\nEvery batch pays two kinds of cost:\n\n- **Fixed cost**: paid once per batch, however many rows. Listing the\n  folder, planning the query, opening two psycopg2 connections and one JDBC\n  connection, two `TRUNCATE`s, one merge transaction, writing the\n  checkpoint and state files.\n- **Per-row cost**: parsing, casting, the dedup state lookup, sending the\n  row over JDBC.\n\n| Batch size | Mean batch duration | JDBC append (median) | Merge (median) |\n|---|---|---|---|\n| ~100 rows (P1) | 3,037 ms | 1.2 s | 56 ms |\n| ~10,000 rows (P3) | 3,746 ms | 1.4 s | 145 ms |\n\n100 times more rows cost only ~0.7 s more. Rough split:\n\n```\nper-row cost ≈ (3,746 − 3,037) ms ÷ (10,000 − 100) rows ≈ 0.07 ms per row\nfixed cost   ≈ 3,037 ms − 100 × 0.07 ms                ≈ 3.0 s per batch\n```\n\nSo at this scale **almost all of a batch is fixed cost**. Two lessons:\n\n1. Bigger batches are much cheaper per row. That is why P3 moved 20 times\n   P2's input with batches only ~0.4 s longer.\n2. A very short trigger (say 1 s) would not help here. Each batch needs\n   ~3 s of fixed work, so batches would just run back to back.\n\nThe first batch of every run is slower, 6 to 12 s (`trigger_ms` 10,979 in\nP1, 12,561 in P2, 12,481 in P3), because Spark compiles code, loads the\nJDBC driver and reads the old state from the checkpoint. Leave it out when\nyou judge the steady state.\n\n## 5. The dial: trigger and `maxFilesPerTrigger`\n\nThe two settings work together:\n\n| Setting | `.env` name | What it controls | Turn it up | Turn it down |\n|---|---|---|---|---|\n| Trigger interval | `TRIGGER` (`5 seconds`) | How often a batch starts | Bigger, cheaper batches; higher latency | Lower latency; more fixed cost per row |\n| `maxFilesPerTrigger` | `MAX_FILES` (`1`) | The most files one batch may take | Can catch up after a backlog; bigger batches | Small, predictable batches; can fall behind |\n\nThe capacity of the job, in files per second, is at most\n`MAX_FILES ÷ trigger seconds`. It must be **above** the arrival rate with\nroom to spare, so the job can also catch up after a restart or a slow\nbatch.\n\n| Run | Capacity (files/s) | Arrivals (files/s) | Headroom | Result |\n|---|---|---|---|---|\n| P1 | 1 ÷ 5 = 0.2 | 0.5 | −60% | Fell behind |\n| P2 | 5 ÷ 5 = 1.0 | 0.5 | +100% | Kept up, p50 5.4 s |\n| P3 | 10 ÷ 10 = 1.0 | ~0.95 | ~+5% | Kept up, but files waited an extra round |\n\nHow to choose, in order:\n\n1. **Pick the trigger from the latency the business needs.** If people\n   want rows within ~10 s, a 5 s trigger gives p50 ≈ 5 s.\n2. **Set `MAX_FILES` so capacity is at least 2× the arrival rate.**\n3. **Check that one batch finishes inside the trigger** (`trigger_ms`\n   below the interval). If not, batches run back to back and the trigger\n   no longer sets the pace.\n\n`MAX_FILES=1` stays the default in `.env.example` because it makes the\nfunctional tests easy to follow: one file = one batch. The settings table\nat the end of `reports/performance_metrics.md` gives the values for real loads.\n\n## 6. Other knobs\n\nThese were not changed in the measured runs. Know what each does.\n\n| Knob | Where | Current value | Effect |\n|---|---|---|---|\n| `spark.sql.shuffle.partitions` | `build_spark()` | `4` | How many pieces data is split into after a shuffle. `dropDuplicates` shuffles, so each batch runs as 4 tasks and the state store has 4 partitions (the `partitionId=0..3` in the logs). The default 200 would mean 200 tiny tasks per batch |\n| JDBC `batchsize` | `.option(\"batchsize\", ...)` on the write | default 1,000 | Rows sent per round trip to PostgreSQL |\n| JDBC `numPartitions` | `.option(\"numPartitions\", ...)` on the write | not set | Most parallel JDBC connections. Today the 4 partitions give up to 4 connections |\n| `reWriteBatchedInserts=true` | in the JDBC URL | not set | A PostgreSQL driver setting that turns a batch of single-row inserts into multi-row inserts. Often faster for the staging append |\n| More cores | `.master(\"local[*]\")` | all laptop cores | `*` already uses every core. More power means a cluster (`spark://...` or YARN/Kubernetes) |\n| `maxBytesPerTrigger` | — | — | Not available for the CSV file source. Only `maxFilesPerTrigger` |\n\n**Gotcha: shuffle partitions are fixed by the checkpoint.** The number is\nsaved in the checkpoint (`\"spark.sql.shuffle.partitions\":\"4\"` in\n`checkpoint/perf_P3/offsets/5`). A stateful query restarted with a new\nvalue keeps the old one. To change it you need a new checkpoint.\n\n## 7. How to reproduce a run\n\nEach run needs its **own input folder and its own checkpoint**. If P2 had\nreused P1's folder and checkpoint, it would first have to drain P1's 24\nwaiting files, and its latency would measure P1's backlog, not P2's\nsettings. `progress.jsonl` holds such a run: batches 84 to 110 on the\nshared checkpoint (10:53 to 10:55 UTC) read ~500 rows at a time, which\nlooks like P1's leftovers being drained. P2 and P3 were run with\n`data/perf_P2` + `checkpoint/perf_P2` and `data/perf_P3` +\n`checkpoint/perf_P3`.\n\nBoth scripts read `INPUT_DIR` from the environment, and `load_dotenv()`\ndoes not overwrite a variable that is already set. So exporting variables\nfor one run beats `.env`. A Git Bash helper in that pattern:\n\n```bash\nexport HADOOP_HOME=\"$USERPROFILE/hadoop\"\n\nperf() {   # perf NAME ROWS EVERY FILES MAX_FILES \"TRIGGER\"\n  local name=$1\n  local since\n  since=$(date -u +%Y-%m-%dT%H:%M:%SZ)          # UTC, for perf_report.py --since\n  INPUT_DIR=data/perf_$name CHECKPOINT_DIR=checkpoint/perf_$name \\\n  MAX_FILES=$5 TRIGGER=\"$6\" \\\n    python spark_streaming_to_postgres.py --run-seconds 150 > \"reports/logs/perf_${name}_job.log\" 2>&1 &\n  sleep 30                                      # Spark needs ~25-30 s to start\n  INPUT_DIR=data/perf_$name \\\n    python data_generator.py --rows \"$2\" --every \"$3\" --batches \"$4\" > \"reports/logs/perf_${name}_gen.log\"\n  wait                                          # until the job stops by itself\n  python -m src.perf_report --since \"$since\" --label \"$name\"\n}\n\nperf P2 100 2 60  5 \"5 seconds\"     # 50 rows/s, 2 minutes\nperf P3 1000 1 120 10 \"10 seconds\"  # 1,000 rows/s, 2 minutes\n```\n\nNotes:\n\n- `--batches 60` with `--every 2` is 2 minutes of files. `--bad-rate`\n  stays at its default 0.02 (2% spoiled), as in the measured runs.\n- `--run-seconds 150` = 30 s start-up + 2 minutes of data. The job then\n  calls `query.stop()`, which finishes the current batch cleanly.\n- `perf_report.py` takes UTC times. `--until` defaults to now.\n- If you rerun with the same name, delete `data/perf_NAME` and\n  `checkpoint/perf_NAME` first, or the old files count as already done.\n\nReal output for P2:\n\n```\nrun: P2\n  micro-batches with data : 24\n  rows read by Spark      : 5984\n  batch duration (ms)     : mean 3306, max 12561\n  processed rows/s (Spark): mean 84\n  rows landed in Postgres : 5876  (53.3 rows/s)\n  latency p50 / p95 / max : 5.4 s / 13.4 s / 15.4 s\n```\n\n(The max batch, 12,561 ms, is the slow first batch.)\n\n## 8. Limits of these measurements\n\nSay these before a reviewer does.\n\n- **One laptop.** The generator, Spark and PostgreSQL shared the same CPU\n  and disk. On a cluster with a separate database server, both the fixed\n  cost and the per-row cost would change.\n- **Short runs.** Each run had 2 minutes of data. That cannot show slow\n  growth, for example the deduplication state getting bigger over hours.\n  The 10-minute watermark should keep it flat, but that is not measured.\n- **One run per setting.** No repeats, so no spread. Treat 5.4 s vs 5.3 s\n  as \"about the same\".\n- **Warm-up included.** The slow first batch is in the means.\n- **The input rate is ideal.** Files arrive at a perfectly steady pace. Real\n  traffic comes in bursts, which is where headroom (section 5) matters.\n- **File source.** Listing a folder gets slower as the folder fills up. A\n  message queue such as Kafka does not have that cost.\n\n## Self-check\n\n1. In P1, how many files arrive per file processed, and why? [2.5. One file\n   every 2 s arrives; at most 1 file per 5 s trigger is processed.]\n2. Why is `processedRowsPerSecond` 35 in P1 but 2,495 in P3 on the same\n   laptop? [It divides rows by batch duration, and batch duration is\n   mostly fixed cost. Bigger batches give a bigger number.]\n3. What does `percentile_cont(0.95)` return? [The latency value 95% of the\n   way up the sorted list: only 5% of rows waited longer.]\n4. Why did each performance run get its own input folder and checkpoint?\n   [So no run inherits another's backlog or \"already done\" file list.]\n5. You need p50 under 10 s at 200 rows/s, files of 100 rows. Pick settings.\n   [Trigger 5 s gives p50 ≈ 2.5 s + ~3 s. Arrivals are 2 files/s = 10 files\n   per trigger, so `MAX_FILES` 20 or more for 2× headroom.]\n","study/09-hard-concepts-explained.md":"# 09 — The Hard Parts, Explained Simply\n\nThese are the ideas in this project that are easy to *say* and hard to\n*explain* when a reviewer asks \"why?\". Each section has four parts:\n\n- **Plain idea.** The concept without jargon.\n- **In this project.** Where it shows up in your files, with real numbers.\n- **Line to say in review.** A short answer to practise out loud.\n- **Follow-up trap.** The next question a reviewer is likely to ask.\n\n> **Help:** the code these concepts live in is walked through in [04 · The streaming job line by line](04-streaming-job-line-by-line.md) and [05 · PostgreSQL, JDBC and the merge](05-postgres-jdbc-and-the-merge.md). The tests that prove them are in [07 · Testing the pipeline](07-testing-the-pipeline.md).\n\n---\n\n## 1. The micro-batch model\n\n**Plain idea.** Spark Structured Streaming does not handle events one at\na time. It treats the stream as a table that keeps growing. Every few\nseconds it takes the rows that are new since last time and runs a normal\nbatch query on just those rows. That small batch is a **micro-batch**.\nThe same query runs again and again on each new slice.\n\n**In this project.** The \"new rows\" are new CSV files in\n`data/incoming/`. Each micro-batch reads the new files, runs `clean()`\n(casts, filter, dedup), and hands the result to `write_batch(batch_df,\nbatch_id)`. Batch numbers count up: the functional runs went from batch 0\nto batch 47 on one checkpoint, and P1 continued from 48 to 83.\n\n**Line to say in review.** \"Spark runs my query as a series of small\nbatch jobs, one per trigger, each on the files that arrived since the last\none. So I get batch tools, like JDBC and SQL, with a delay of a few\nseconds.\"\n\n**Follow-up trap.** \"So it's not real time?\" → It is near real time:\np50 latency 5.4 s in run P2. Spark also has a \"continuous\" mode with\nmillisecond latency, but it is experimental and does not support\n`dropDuplicates` or `foreachBatch`. For an e-commerce dashboard, seconds\nare enough.\n\n---\n\n## 2. The trigger interval\n\n**Plain idea.** The trigger is a clock. It says how often a new\nmicro-batch may start. With a 5 s trigger, Spark checks for new data at\n0 s, 5 s, 10 s... If a batch takes longer than 5 s, the next one starts\nas soon as it finishes.\n\n**In this project.** `.trigger(processingTime=TRIGGER)` with\n`TRIGGER = os.getenv(\"TRIGGER\", \"5 seconds\")`. P3 used `\"10 seconds\"`.\nSteady-state batches took ~2.7 to 3.7 s, so they fit inside the slot.\nThe first batch of each run took 10 to 12.5 s and caused the only\n`Current batch is falling behind` warning.\n\n**Line to say in review.** \"The trigger sets the rhythm. Half a trigger\nis the average wait before a file is picked up, so it sets the floor on\nlatency. P2's p50 of 5.4 s is half of 5 s plus a ~3 s batch.\"\n\n**Follow-up trap.** \"Why not a 1-second trigger?\" → Each batch has about\n3 s of fixed cost (planning, connections, checkpoint). With a 1 s\ntrigger, batches would run back to back and latency would not improve.\nSee [08 · Fixed cost vs per-row cost](08-performance-and-tuning.md#h-4-fixed-cost-vs-per-row-cost).\n\n---\n\n## 3. `maxFilesPerTrigger` and backlog\n\n**Plain idea.** `maxFilesPerTrigger` caps how many files one batch may\ntake. Files above the cap wait for a later batch. The waiting files are\nthe **backlog**. If files arrive faster than `cap ÷ trigger`, the backlog\ngrows without end.\n\n**In this project.** `.option(\"maxFilesPerTrigger\", MAX_FILES)`, default\n`MAX_FILES=1`. Run P1: one file every 2 s arrives, one file per 5 s is\nprocessed, so 2.5 files arrive for every one processed. After 2 minutes,\n24 of 60 files were still waiting, and latency reached 116.4 s. Run P2\nchanged only `MAX_FILES` to 5: p50 latency 5.4 s.\n\n**Line to say in review.** \"Capacity is files per batch divided by the\ntrigger. At MAX_FILES=1 that was 0.2 files a second against 0.5 arriving,\nso P1 fell behind even though each batch used only 3 of its 5 seconds.\nThe cap was the bottleneck, not the CPU.\"\n\n**Follow-up trap.** \"Then why not remove the cap?\" → Without a cap, the\nfirst batch after a long outage would take every waiting file at once.\nThat one batch could be huge and slow, or run out of memory. A cap keeps\nbatches a predictable size while still allowing catch-up, as long as it\nis set above the arrival rate.\n\n---\n\n## 4. The checkpoint\n\n**Plain idea.** A checkpoint is the job's notebook on disk. Before a\nbatch runs, Spark writes down *what* it is about to process. After the\nbatch succeeds, it writes down *that it finished*. On restart Spark reads\nthe notebook and carries on from where it was.\n\n**In this project.** `.option(\"checkpointLocation\", CHECKPOINT_DIR)`,\ndefault `checkpoint/events`. Inside:\n\n| Folder | Holds |\n|---|---|\n| `metadata` | The query id. That is why every functional run printed the same `id=2887773f-...` |\n| `offsets/N` | Written **before** batch N: which source position and watermark it covers |\n| `sources/0/N` | The exact file names batch N reads |\n| `commits/N` | Written **after** batch N's sink succeeded |\n| `state/` | The `dropDuplicates` memory: event ids seen recently, in 4 partitions |\n\nTC-06: after a restart, batch numbers continued at 21, and none of the 20\nold files was read again.\n\n**Line to say in review.** \"The checkpoint records which files each\nbatch read, and whether the batch finished. Offsets are written before\nthe batch, the commit after. A batch with an offset but no commit is\nre-run on restart.\"\n\n**Follow-up trap.** \"What if I delete the checkpoint?\" → Spark forgets\neverything and reads every file in the folder again. No duplicates reach\n`events`, because the primary key and `ON CONFLICT DO NOTHING` skip them.\nAlso: never share one checkpoint between two queries.\n\n---\n\n## 5. At-least-once delivery and an idempotent sink\n\n**Plain idea.** **At-least-once** means every batch is delivered, but\nsome might be delivered twice. This happens when the job writes a batch\nand then dies before writing the commit. **Idempotent** means doing\nsomething twice has the same effect as doing it once. At-least-once plus\nan idempotent write gives the *effect* of exactly-once.\n\n**In this project.** `foreachBatch` gives at-least-once. The write is\nmade idempotent by the merge:\n\n```sql\nINSERT INTO events (...) SELECT ... FROM events_staging\nON CONFLICT (event_id) DO NOTHING\n```\n\nTC-05 forced a replay by deleting `checkpoint/events/commits/42`. Spark\nre-ran batch 42: `{\"rows\": 83, \"inserted\": 0, \"skipped_duplicates\": 83}`.\nThe total stayed 3,190. A hard kill (`taskkill /F`) mid-run lost nothing\nand duplicated nothing either.\n\n**Line to say in review.** \"Spark can replay a batch, so the database\nwrite must be safe to repeat. Every event has a unique `event_id`, it's\nthe primary key, and the merge skips ids that are already there. I proved\nit by deleting a commit file: 83 rows replayed, 0 inserted.\"\n\n**Follow-up trap.** \"Is that true exactly-once?\" → It is exactly-once in\n*effect* for the `events` table. Side effects outside it are not\nprotected: `batches.jsonl` got a second line for batch 42. Exactly-once\nneeds both a replayable source (files + checkpoint) and an idempotent or\ntransactional sink.\n\n---\n\n## 6. The watermark\n\n**Plain idea.** A watermark is Spark's answer to \"how late can data\nbe?\". Spark tracks the newest event time it has seen. The watermark is\nthat time minus a delay. Anything older than the watermark is treated as\n\"too late\", and state about it can be thrown away.\n\n**In this project.** `.withWatermark(\"event_time\", \"10 minutes\")`. In\n`checkpoint/perf_P3/offsets/5` the watermark is `1793789819007` ms, which\nis 10:56:59.007 UTC: exactly 10 minutes before 11:06:59.007, the newest\n`event_time` in the batch before it.\n\n**Line to say in review.** \"The watermark is newest event time minus ten\nminutes. It lets Spark forget event ids older than that, so the\ndeduplication memory stays small instead of growing forever.\"\n\n**Follow-up trap.** \"What happens to an event that arrives 15 minutes\nlate?\" → `dropDuplicates` with a watermark **drops** rows older than the\nwatermark. That loss is silent. Here the generator always writes current\ntimes, so it never happened, but with real late data you would widen the\ndelay or deduplicate only in PostgreSQL.\n\n---\n\n## 7. `dropDuplicates` state, and why it needs a watermark\n\n**Plain idea.** To know whether an id is a repeat, Spark must remember\nevery id it has seen. That memory is called **state**, and it is saved in\nthe checkpoint. Without a limit, state grows with every event forever.\nThe watermark gives the limit.\n\n**In this project.**\n\n```python\nreturn (valid\n    .withWatermark(\"event_time\", \"10 minutes\")\n    .dropDuplicates([\"event_id\", \"event_time\"]))\n```\n\n`event_time` is in the key list on purpose. Spark can only evict an\nentry when it knows the entry's event time, so the watermark column must\nbe one of the keys. TC-07 copied an already-processed file: batch 21\nread 98 rows and passed **0** on, because every id was still in state.\n\n**Line to say in review.** \"dropDuplicates keeps the ids it has seen in\nstate. Including event_time in the keys, with a ten-minute watermark,\nlets Spark drop ids older than ten minutes, so state stays bounded. The\nprimary key is the second line of defence for anything older.\"\n\n**Follow-up trap.** \"Same `event_id`, different `event_time`?\" → In\nSpark those are two different keys, so both pass. The primary key then\nkeeps the first one and skips the second. (Spark 3.5+ also has\n`dropDuplicatesWithinWatermark([\"event_id\"])` for exactly this case.)\n\n---\n\n## 8. Event time vs processing time\n\n**Plain idea.** **Event time** is when the thing happened (the user\nclicked). **Processing time** is when the system handles it. They differ\nby the delay in the pipeline, and on a bad day by minutes or hours.\n\n**In this project.** Three clocks:\n\n| Time | Column / setting | Set by |\n|---|---|---|\n| Event time | `event_time` | The generator: `datetime.now(timezone.utc)` when the event is made |\n| Processing time | `.trigger(processingTime=...)` | Spark's clock, when a batch starts |\n| Ingestion time | `ingested_at DEFAULT now()` | PostgreSQL, when the merge transaction starts |\n\nLatency is `ingested_at − event_time`. The watermark uses event time.\nReports should group by `event_time`.\n\n**Line to say in review.** \"Reports and the watermark use event time,\nwhen the user acted. The trigger uses processing time. The gap between\nevent time and ingested_at is my end-to-end latency.\"\n\n**Follow-up trap.** \"Why not just use `now()` for event time?\" → After a\ntwo-minute outage, a whole batch would be stamped with the recovery time.\nA \"sales per minute\" chart would show a false spike. Event time stays\ncorrect whatever the delay.\n\n---\n\n## 9. `foreachBatch` vs built-in sinks\n\n**Plain idea.** A **sink** is where a streaming query writes. Spark has\nbuilt-in streaming sinks (files, Kafka, console, memory), but **no\nstreaming JDBC sink**. `foreachBatch` gives you each micro-batch as an\nordinary DataFrame plus its batch id, and you write it however you like.\n\n**In this project.** `.foreachBatch(write_batch)`. Inside, `batch_df` is\na normal DataFrame, so it can use the batch JDBC writer\n(`batch_df.write.format(\"jdbc\")`) and then run SQL with psycopg2.\n\n**Line to say in review.** \"There's no streaming JDBC sink, so I use\nforeachBatch. It lets me write each batch with the normal JDBC writer and\nthen run my own merge SQL. The price is at-least-once delivery, which the\nprimary key handles.\"\n\n**Follow-up trap.** \"Where does `write_batch` run?\" → On the **driver**\n(the main Python process), once per batch. The JDBC write inside it is\nstill split across executor tasks, one per partition. psycopg2 runs on\nthe driver only.\n\n---\n\n## 10. Staging table + merge\n\n**Plain idea.** Write the batch into an empty side table first\n(**staging**), then move it into the real table with one SQL statement.\nThe bulk load stays simple and fast, and all the rules apply in one\ntransaction at the end.\n\n**In this project.** `write_batch()`:\n\n1. `TRUNCATE events_staging` (clear leftovers of a failed earlier try)\n2. JDBC `mode(\"append\")` into `events_staging`. It has no constraints\n   (`LIKE events INCLUDING DEFAULTS EXCLUDING CONSTRAINTS`), so it never\n   fails half way\n3. In one transaction: `INSERT ... SELECT ... ON CONFLICT (event_id) DO\n   NOTHING`, then `TRUNCATE events_staging`\n\nMedian times: JDBC append 1.2 s, merge 57 ms.\n\n**Line to say in review.** \"Spark's JDBC writer can only do plain\ninserts. A replayed batch would hit the primary key and fail. So I land\nthe batch in staging, then merge with ON CONFLICT DO NOTHING in one\ntransaction. Replays become no-ops instead of errors.\"\n\n**Follow-up trap.** \"Is that an upsert?\" → Strictly no: an upsert\nupdates existing rows (`DO UPDATE`). Events never change once they\nhappen, so \"insert if absent\" is the right rule. And: \"What if two jobs\nrun at once?\" → They would share `events_staging` and truncate each\nother's rows. The design assumes a single writer.\n\n---\n\n## 11. `TIMESTAMPTZ` vs `TIMESTAMP` (the +2 hours story)\n\n**Plain idea.** `TIMESTAMP` (without time zone) stores a wall-clock\nreading like `09:42`, with no idea which zone it was in. `TIMESTAMPTZ`\nstores an absolute instant. It converts input to UTC and shows it in the\nsession's zone.\n\n**In this project.** Earlier in the week the columns were `TIMESTAMP`.\nThe generator writes UTC times, and Spark's session zone is UTC\n(`spark.sql.session.timeZone`). But the JDBC driver converts timestamps\nusing the **JVM's own zone**, which on this laptop is UTC+2. So\n`09:42:17` UTC was stored as `11:42:17`, two hours off. Changing\n`event_time` and `ingested_at` to `TIMESTAMPTZ` fixed it: TC-03 shows\nthe values match the CSV exactly with `SET timezone='UTC'`. You can see\nthe two zones in the files: generator file names use local time\n(`events_20261104_130700_...`), `event_time` values use UTC (11:07:00).\n\n**Line to say in review.** \"I store event times as TIMESTAMPTZ, an\nabsolute instant. With plain TIMESTAMP, the JDBC driver wrote in the\nJVM's local zone and every time was two hours late. TIMESTAMPTZ removes\nthe guessing.\"\n\n**Follow-up trap.** \"psql shows `+02` on my times. Is it still wrong?\"\n→ No. The server's zone is Africa/Johannesburg, so psql *displays* in\nUTC+2. The stored instant is right. `SET timezone = 'UTC'` displays the\nsame instant in UTC.\n\n---\n\n## 12. Schema-on-read with strings, then `try_cast` (ANSI mode)\n\n**Plain idea.** **Schema-on-read** means the file has no types; the\nreader decides them. A streaming source needs its schema given up front.\nIf you declare `user_id` as an integer and a file contains `unknown`,\nthe read itself can fail. Reading everything as text, then converting\ncolumn by column, moves the problem into your own code where you can\nhandle it.\n\n**ANSI mode** is a stricter SQL rule set, on by default in Spark 4. In\nANSI mode, `CAST('unknown' AS INT)` throws an error instead of returning\nnull. One bad value would stop the whole stream. `try_cast` returns null\ninstead.\n\n**In this project.** `RAW_SCHEMA` makes all nine columns `StringType`.\nThen `clean()`:\n\n```python\n.withColumn(\"user_id\", F.expr(\"try_cast(user_id AS INT)\"))\n.withColumn(\"event_time\", F.expr(\"try_to_timestamp(event_time, 'yyyy-MM-dd HH:mm:ss.SSS')\"))\n```\n\nThe generator's bad values are `\"\"`, `\"-5\"`, `\"unknown\"`, `\"NaN\"`. The\nfirst, third and fourth become null and fail the filter. `\"-5\"` is a\nvalid integer, which is exactly the TC-04 bug: 27 rows with\n`user_id = -5` got in until the filter changed from \"is not null\" to\n`> 0`.\n\n**Line to say in review.** \"Every column is read as a string, then\nconverted with try_cast. A bad value becomes null and the row is\nfiltered out, instead of a cast error stopping the whole stream.\"\n\n**Follow-up trap.** \"Why does `> 0` reject nulls?\" → In SQL, `NULL > 0`\nis unknown, not true, and a filter keeps only rows where the condition\nis true. That is the comment on line 90 of the job.\n\n---\n\n## 13. Atomic file rename\n\n**Plain idea.** Writing a file takes time. If a reader looks halfway, it\nsees half a file. A **rename** on the same disk is **atomic**: it\nhappens all at once, so a reader sees either no file or the complete\nfile.\n\n**In this project.** `write_file()` writes `_events_....csv`, then:\n\n```python\nos.replace(tmp_path, os.path.join(out_dir, name))     # atomic rename\n```\n\nSpark's file source ignores names starting with `_` or `.`, so it never\nlists the temporary file. TC-01: 20 files, 0 leftover `_` files. TC-07\nused the same trick when copying a duplicate file.\n\n**Line to say in review.** \"The generator writes to an underscore name\nand renames when done. Spark skips underscore files and the rename is\natomic, so Spark never reads half a file.\"\n\n**Follow-up trap.** \"What would go wrong without it?\" → Spark could\nlist the file while 40 of 100 rows are written, read those 40, and mark\nthe file as done in the checkpoint. The other 60 rows would never be\nread.\n\n---\n\n## 14. The least-privilege database role\n\n**Plain idea.** **Least privilege** means each program gets only the\nrights it needs. If the program is buggy or its password leaks, the\ndamage is limited.\n\n**In this project.** `postgres_setup.sql` creates `spark_app`, a normal\nlogin (not a superuser), and grants:\n\n| Table | Rights |\n|---|---|\n| `events` | `SELECT`, `INSERT` |\n| `events_staging` | `SELECT`, `INSERT`, `TRUNCATE` |\n\nChecked live in `information_schema.role_table_grants`: exactly those\nfive. No `UPDATE`, `DELETE` or `TRUNCATE` on `events`. The tables are\nowned by `postgres`, so `spark_app` cannot drop or alter them. The\npassword lives only in the gitignored `.env`.\n\n**Line to say in review.** \"The job logs in as spark_app, which can add\nand read events and empty its own staging table, nothing else. It cannot\ndelete or change events, so a bug cannot wipe history.\"\n\n**Follow-up trap.** \"Why does it need `SELECT` on `events`?\" →\n`perf_report.py` reads `events` with the same `.env` login to measure\nlatency. The merge itself reads `events_staging`, which needs `SELECT`\nthere.\n\n---\n\n## 15. Filter pushdown and why `numInputRows` is low\n\n**Plain idea.** **Pushdown** means the optimizer moves a filter as close\nto the data source as it can, so fewer rows travel through the rest of\nthe query. Spark can also *infer* extra filters: if you keep only\n`user_id > 0`, then `user_id` cannot be null, so it adds an \"is not\nnull\" check and pushes it into the CSV reader.\n\n**In this project.** Run P2: the generator wrote 6,000 rows, but Spark's\n`numInputRows` was **5,984**. The 16 missing rows had an empty value in\na checked column and were dropped inside the reader, before Spark counted\ninput
